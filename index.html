/* --- 1. 中英連連看 --- */
function gmLink(){
  const pool=gmWords(gmLevel()).slice(0,15);const lw=new Set();let round=0,mistakes=0,t0=Date.now(),sel=null,done=0,all=[];
  const timer=setInterval(()=>{const el=document.getElementById('glt');if(el)el.textContent=((Date.now()-t0)/1000).toFixed(0)+' 秒'},500);gm.stop.push(()=>clearInterval(timer));
  function draw(){
    const words=pool.slice(round*5,round*5+5);all.push(...words);const right=gshuf(words);sel=null;done=0;
    gmScreen('中英連連看',`<div class="hud gm-hud"><span>第 ${round+1} / 3 輪</span><span id="glt">0 秒</span><span>錯 <b id="glm">${mistakes}</b></span><span>${gmLvName()}</span></div>
     <div class="gm-link" id="glk"><svg class="gm-lines" id="gls" aria-hidden="true"></svg>
      <div class="gm-col">${words.map((w,i)=>`<button class="gm-it en" data-gl="L" data-gw="${esc(w[0])}">${esc(w[0])}</button>`).join('')}</div>
      <div class="gm-col">${right.map(w=>`<button class="gm-it" data-gl="R" data-gw="${esc(w[0])}">${esc(w[1])}</button>`).join('')}</div></div>
     <p class="muted" style="margin:0;font-size:13px">先點英文，再點中文。</p>`);
    document.getElementById('glt').textContent=((Date.now()-t0)/1000).toFixed(0)+' 秒';
    document.getElementById('glk').onclick=ev=>{const b=ev.target.closest('.gm-it');if(!b||b.classList.contains('ok'))return;
      if(b.dataset.gl==='L'){document.querySelectorAll('.gm-it.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;speak(b.dataset.gw,.95);return}
      if(!sel){b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:180});return}
      if(sel.dataset.gw===b.dataset.gw){sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');line(sel,b);sel=null;done++;
        if(done===5){round++;if(round<3)setTimeout(draw,550);else setTimeout(end,550)}}
      else{mistakes++;lw.add(sel.dataset.gw);document.getElementById('glm').textContent=mistakes;[sel,b].forEach(x=>{x.classList.add('ng');setTimeout(()=>x.classList.remove('ng'),450)})}}}
  function line(a,b){const box=document.getElementById('glk').getBoundingClientRect(),r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect();
    const s=document.getElementById('gls');s.insertAdjacentHTML('beforeend',`<line x1="${r1.right-box.left}" y1="${r1.top+r1.height/2-box.top}" x2="${r2.left-box.left}" y2="${r2.top+r2.height/2-box.top}"/>`)}
  function end(){clearInterval(timer);const sec=(Date.now()-t0)/1000;const score=150+Math.max(0,120-sec)-mistakes*5;
    const line=sec<45&&mistakes<=1?'很好，女人，妳已經成功引起我的注意。':sec<80?'還行。明天，我要看到更快。':'這麼慢？再給我連三遍。';
    const cn=cramAdd(all.filter(w=>lw.has(w[0])));gmScreen('中英連連看',`<div class="hud gm-hud"><span>${sec.toFixed(0)} 秒</span><span>錯 ${mistakes} 次</span></div>`+cramNote(cn)+gmFinish('link',score,line,all,'link'))}
  draw();
}
/* --- 2. 掉落打字 --- */
function gmFall(){
  const SP={slow:{v:9.8,acc:.25,gap:6.8,min:3.9},mid:{v:15.4,acc:.42,gap:5.5,min:3.1},fast:{v:22.4,acc:.63,gap:4.4,min:2.3}}[rawStore.get('gmSpd','slow')]||{v:9.8,acc:.25,gap:6.8,min:3.9};
  gmScreen('掉落打字',`<div class="hud gm-hud"><span id="gfs">0 分</span><span id="gfc">連擊 0</span><span class="gm-hearts" id="gfh">♥♥♥</span><span>${gmLvName()}</span></div>
   <div class="gm-field" id="gff"><div class="gm-ground"></div></div>
   <form class="gm-type" id="gfform" autocomplete="off"><input id="gfin" aria-label="輸入英文單字" placeholder="在這裡打英文…" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" type="submit">送出</button></form>`);
  const ff=document.getElementById('gff'),inp=document.getElementById('gfin');
  let drops=[],score=0,combo=0,lives=3,raf=0,last=0,spawnT=0,el=0,run=true,missed=[],pool=gmWords(gmLevel()).filter(w=>w[0].length<=9&&/^[a-z]+$/.test(w[0])).slice(0,60).reverse();
  const hint=w=>w.length<=2?w[0]+' _':w[0]+' '+Array(w.length-2).fill('_').join(' ')+' '+w[w.length-1];
  function spawn(){const w=pool.pop()||gshuf(gmPool(gmLevel()))[0];const d=document.createElement('div');d.className='gm-drop';d.innerHTML=`<b>${esc(w[1])}</b><i>${esc(hint(w[0]))}</i>`;
    d.style.left=(16+Math.random()*68)+'%';ff.appendChild(d);drops.push({w,el:d,y:-46,v:SP.v+Math.min(el*SP.acc*.2,SP.v)+Math.random()*4})}
  function hud(){document.getElementById('gfs').textContent=score+' 分';document.getElementById('gfc').textContent='連擊 '+combo;document.getElementById('gfh').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}
  function loop(ts){if(!run)return;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;el+=dt;spawnT-=dt;
    if(spawnT<=0){spawn();spawnT=Math.max(SP.min,SP.gap-el*0.03)}
    const H=ff.clientHeight;
    for(const d of drops.slice()){d.y+=d.v*dt;d.el.style.top=d.y+'px';
      if(d.y>H-50){d.el.remove();drops=drops.filter(x=>x!==d);lives--;combo=0;missed.push(d.w);hud();if(lives<=0){end();return}}}
    raf=requestAnimationFrame(loop)}
  function end(){run=false;cancelAnimationFrame(raf);drops.forEach(d=>d.el.remove());
    const line=score>=200?'打字比我的秘書還快。不錯。':score>=80?'及格。明天，我要更多。':'就這樣？女人，妳在考驗我的耐心。';
    const cn=cramAdd(missed);gmScreen('掉落打字',`<div class="hud gm-hud"><span>${score} 分</span></div>`+cramNote(cn)+gmFinish('fall',score,line,missed.slice(-8),'fall'))}
  document.getElementById('gfform').onsubmit=e=>{e.preventDefault();chk(true)};inp.addEventListener('input',()=>chk(false));
  function chk(force){const v=inp.value.trim().toLowerCase();if(!v||!run)return;const d=drops.find(x=>x.w[0]===v);
    if(d){combo++;score+=10+Math.min(combo-1,10)*2;d.el.classList.add('hit');drops=drops.filter(x=>x!==d);setTimeout(()=>d.el.remove(),350);inp.value='';hud();speak(d.w[0],1)}
    else if(force){combo=0;hud();inp.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:200})}}
  const vis=()=>{if(document.hidden){run=false;cancelAnimationFrame(raf)}else if(!run&&lives>0&&document.getElementById('gff')){run=true;last=0;raf=requestAnimationFrame(loop)}};
  document.addEventListener('visibilitychange',vis);gm.stop.push(()=>{run=false;cancelAnimationFrame(raf);document.removeEventListener('visibilitychange',vis)});
  spawn();spawnT=SP.gap*.6;inp.focus();raf=requestAnimationFrame(loop);
}
/* 單字講解（聽力測驗答題後顯示）：詞性、中文、同義、反義、例句 */
function gmWordInfo(lv,w){const k=norm(w),Dd=lv==='toeic'?D2:lv==='ielts'?IELTS_D:D3,d=Dd[k]||D2[k]||IELTS_D[k]||D3[k];if(!d)return '';

  return `<div class="gm-winfo">${d.p?`<span class="pos">${esc(d.p)}</span> `:''}<b>${esc((d.z||[]).slice(0,3).join('、'))}</b>
   <div class="gw-r"><span class="lbl">同義字</span>${tg(d.s,'')}</div><div class="gw-r"><span class="lbl">反義字</span>${tg(d.a,'ant')}</div>
   ${ex?`<div class="gw-r"><span class="lbl">例句</span><div class="ex"><span class="en">${esc(ex[0])}</span><button class="mini" data-speak="${esc(ex[0])}" aria-label="朗讀例句">${ICON.speak}</button><span class="zh">${esc(ex[1])}</span></div></div>`:''}</div>`}
/* --- 3. 聽力測驗 --- */
function gmListen(){
  const N=10,lv=gmLevel(),P=gmPool(lv),qs=gshuf(gmWords(lv).slice(0,N));let i=0,score=0,wrong=[];
  function q(){const w=qs[i];const opts=gshuf([w,...gshuf(P.filter(x=>x[1]!==w[1])).slice(0,3)]);
    gmScreen('聽力測驗',`<div class="hud gm-hud"><span>第 ${i+1} / ${N} 題</span><span>答對 ${score}</span><span>${gmLvName()}</span></div>
     <div class="gm-lq"><button class="gm-play${i===0?' pulse':''}" id="glp" aria-label="播放發音">▶</button><button class="btn ghost sm" id="gls2">慢速再聽</button><div class="gm-reveal" id="glr" aria-live="polite"></div></div>
     <div class="gm-opts">${opts.map((o,k)=>`<button class="gm-opt" data-go="${k}">${esc(o[1])}</button>`).join('')}</div><div id="gln"></div>`);
    const play=r=>{speak(w[0],r);document.getElementById('glp').classList.remove('pulse')};
    document.getElementById('glp').onclick=()=>play(.85);document.getElementById('gls2').onclick=()=>play(.55);if(i>0)setTimeout(()=>play(.85),250);
    let ans=false;document.querySelector('.gm-opts').onclick=ev=>{const b=ev.target.closest('.gm-opt');if(!b||ans)return;ans=true;const ok=opts[+b.dataset.go][0]===w[0];
      if(ok)score++;else{b.classList.add('ng');wrong.push(w)}
      document.querySelectorAll('.gm-opt').forEach((x,k)=>{if(opts[k][0]===w[0])x.classList.add('ok');x.disabled=true});
      document.getElementById('glr').innerHTML=`${esc(w[0])} <small>${esc(w[2])}</small>`+gmWordInfo(lv,w[0]);
      document.getElementById('gln').innerHTML=`${gmSay(ok?['耳朵不錯，下一題。','很好，繼續。','答對了，別得意。'][i%3]:['聽清楚了嗎？再背三遍。','這都聽不出來？今晚別想睡。'][i%2])}<button class="btn" id="glgo" style="width:100%;margin-top:10px">${i+1<N?'下一題':'看成績'}</button>`;
      document.getElementById('glgo').onclick=()=>{i++;i<N?q():end()}}}
  function end(){const line=score>=9?'這種耳朵，配得上我。':score>=6?'還可以。明天我要聽到滿分。':'耳朵借我，我親自教妳。';
    const cn=cramAdd(wrong);gmScreen('聽力測驗',`<div class="hud gm-hud"><span>答對 ${score} / ${N}</span></div>`+cramNote(cn)+gmFinish('listen',score*15,line,wrong,'listen'))}
  q();
}
/* --- 4. 情境找物品 --- */
function gmScene(){
  const S=GM_SCENES[Math.floor(Math.random()*GM_SCENES.length)];const targets=gshuf(S.hs).slice(0,8);const sw=[];let ti=0,score=0,tries=0,zoom=false;
  gmScreen('情境找物品',`<div class="hud gm-hud"><span id="gsp">第 1 / 8 個</span><span id="gss">0 分</span><span>${S.name}</span></div>
   <div class="gm-ask"><span><small>找出這個東西，點一下</small><b id="gsw"></b></span><button id="gssay" aria-label="念出單字">♪</button></div>
   <div class="gm-scwrap" id="gsw2"><div class="gm-sc" id="gsc"><img src="${S.img}" alt="${S.name}" draggable="false"></div></div>
   <div class="gm-row"><button class="btn ghost sm" id="gzoom">放大照片</button><button class="btn ghost sm" id="gskip">跳過這個</button></div><div id="gsend"></div>`);
  const sc=document.getElementById('gsc');
  const inR=(r,x,y)=>x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3],area=r=>(r[2]-r[0])*(r[3]-r[1]);
  const hit=(x,y)=>{let best=null,ba=1e12;for(const h of S.hs)for(const r of h[2])if(inR(r,x,y)&&area(r)<ba){ba=area(r);best=h}return best};
  const center=h=>{const r=h[2][0];return [(r[0]+r[2])/2,(r[1]+r[3])/2]};
  function mark(h,cls,label,ri){const r=h[2][ri||0];const w=(r[2]-r[0])/1536*100,hh=(r[3]-r[1])/1024*100;
    sc.insertAdjacentHTML('beforeend',`<span class="gm-mk ${cls}" style="left:${r[0]/1536*100}%;top:${r[1]/1024*100}%;width:${w}%;height:${hh}%"><em>${esc(label)}</em></span>`)}
  function ask(){const t=targets[ti];document.getElementById('gsw').textContent=t[0];document.getElementById('gsp').textContent=`第 ${ti+1} / 8 個`;tries=0}
  function next(){ti++;if(ti<8)setTimeout(ask,400);else setTimeout(end,500)}
  document.getElementById('gssay').onclick=()=>targets[ti]&&speak(targets[ti][0],.85);
  document.getElementById('gzoom').onclick=ev=>{zoom=!zoom;sc.classList.toggle('z',zoom);ev.target.textContent=zoom?'縮小照片':'放大照片'};
  document.getElementById('gskip').onclick=()=>{if(ti>=8)return;sw.push([targets[ti][0],targets[ti][1]]);mark(targets[ti],'skip',targets[ti][0]+' '+targets[ti][1]);next()};
  sc.onclick=ev=>{if(ti>=8)return;const r=sc.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*1536,y=(ev.clientY-r.top)/r.height*1024;const t=targets[ti];const h=t&&t[2].some(r=>inR(r,x,y))?t:hit(x,y);
    if(h===t){score+=tries?5:10;if(tries)sw.push([t[0],t[1]]);const ri=t[2].findIndex(r=>x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3]);mark(t,'ok',t[0]+' '+t[1],ri<0?0:ri);speak(t[0],.9);document.getElementById('gss').textContent=score+' 分';next()}
    else{tries++;const tip=document.createElement('span');tip.className='gm-tap';tip.style.left=(x/1536*100)+'%';tip.style.top=(y/1024*100)+'%';tip.innerHTML=`<em>${h?esc(h[0]):'不是這裡'}</em>`;sc.appendChild(tip);setTimeout(()=>tip.remove(),1100)}};
  ask();
  function end(){const line=score>=70?'眼力不錯。這間'+S.name.replace('總裁的','')+'，歸妳管了。':score>=40?'還行，但我的東西妳要記清楚。':'東西就在眼前都找不到？再來。';
    const cn=cramAdd(sw);document.getElementById('gsend').innerHTML=cramNote(cn)+gmFinish('scene',score,line,targets.map(t=>[t[0],t[1]]),'scene');document.getElementById('gsend').scrollIntoView({behavior:'smooth',block:'start'})}
}

function collCan(i){return unlocked||i<COLL_FREE}
const collMet=(c,n,xp)=>n>=c.x&&xp>=c.p;
function collCheck(){const o=collOwned(),n=collReads(),xp=gmXP(),nu=[];COLL.forEach((c,i)=>{if(!o.includes(i)&&collMet(c,n,xp)&&collCan(i)){o.push(i);nu.push(i)}});if(nu.length)rawStore.set('coll',o);return nu}

function collTease(){if(unlocked)return null;const n=collReads(),seen=rawStore.get('collTease',[])||[];const xp=gmXP();const i=COLL.findIndex((c,k)=>k>=COLL_FREE&&collMet(c,n,xp)&&!seen.includes(k));if(i<0)return null;rawStore.set('collTease',seen.concat(i));return i}

/* ---------- 錯字補習班（遊戲通行證）：遊戲答錯的字自動收集，照記憶曲線複習 ---------- */
const CRAM_GAP=[0,1,3,7];/* 第 n 盒答對後，隔幾天再複習；第 4 盒再答對就畢業 */
const dplus=n=>dkey(new Date(Date.now()+n*864e5));
function cramGet(){return rawStore.get('cram',{})||{}}
function cramAdd(list){if(!list||!list.length)return 0;const C=cramGet(),td=dkey();let n=0;
  list.forEach(x=>{const w=Array.isArray(x)?x[0]:x.w,z=Array.isArray(x)?x[1]:x.z;if(!w||!z)return;const k=norm(w);
    if(C[k]){C[k].b=0;C[k].d=td;C[k].n=(C[k].n||1)+1}else{C[k]={w:String(w).toLowerCase(),z,b:0,d:td,n:1,t:Date.now()};n++}});
  rawStore.set('cram',C);return n}
function cramDue(){const C=cramGet(),td=dkey();return Object.values(C).filter(x=>x.d<=td).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(b.n||1)-(a.n||1))}
function cramNote(n){if(!n)return '';return `<p class="cram-note">📒 答錯的 <b>${n}</b> 個字已收進「錯字補習班」${gamePass?'，明天記得來複習':'・<b>通行證</b>可以照記憶曲線複習'}</p>`}
function cramBanner(){const C=cramGet(),all=Object.keys(C).length;if(!all)return '';const due=cramDue().length;
  return `<button class="cram-ban" data-gopen="cram"><span>📒</span><span><b>${due?`今天有 ${due} 個錯字該複習`:'今天的錯字都複習完了'}</b><small>錯字補習班・共 ${all} 個${gamePass?'':'・通行證限定'}</small></span><span aria-hidden="true">${gamePass?'›':ICON.lock}</span></button>`}
function cramTeaser(){const all=Object.keys(cramGet()).length,due=cramDue().length;
  openModal(`<span class="kicker">遊戲通行證限定</span><h2>錯字補習班</h2>
   <p>${all?`你已經累積 <b>${all}</b> 個錯字，今天有 <b>${due}</b> 個該複習。`:'在遊戲裡答錯的字，會自動收進這裡。'}</p>
   <ul class="annl" style="text-align:left;margin:4px 0 10px;padding-left:20px;line-height:1.8">
    <li>所有遊戲<b>答錯的字自動收集</b>，不用自己抄</li>
    <li>照<b>記憶曲線</b>安排：隔 1 天、3 天、7 天再考一次</li>
    <li>連續答對 4 次就<b>畢業</b>，真的背起來了</li>
    <li>答錯就重新排回明天，霸總親自盯妳</li></ul>
   <div class="acts">${passBuy()}<button class="linkbtn" data-close style="align-self:center">先不用</button></div>`)}
function cramHome(){gmStopAll();gm.cur='cram';const C=cramGet(),L=Object.values(C).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0),due=cramDue().length,grad=rawStore.get('cramGrad',0)||0,td=dkey();
  const when=d=>d<=td?'今天':d===dplus(1)?'明天':d.slice(5).replace('-','/');
  gmScreen('錯字補習班',`<div class="cram-kpi"><div><b>${due}</b><span>今天要複習</span></div><div><b>${L.length}</b><span>還在補習</span></div><div><b>${grad}</b><span>已畢業</span></div></div>
   <div class="gm-panel">${gmSay(due?'今天的錯字，一個都不准漏。':L.length?'今天的份做完了。明天準時報到。':'還沒有錯字？那就去玩一局，我等著抓妳的錯。')}
    ${due?`<button class="btn" data-gstart="cram">開始複習 ${Math.min(due,10)} 個字</button>`:`<button class="btn ghost" data-ghome>回遊戲間</button>`}
    <p class="muted" style="margin:0;font-size:13px">每個字要在不同天答對 4 次才畢業（隔 1、3、7 天）。答錯會重新排到明天。</p></div>
   ${L.length?`<div class="cram-list">${L.map(x=>`<div class="cram-row"><span class="en">${esc(x.w)}</span><span class="zh">${esc(x.z)}</span><span class="cram-b" aria-label="進度 ${x.b}/4">${[0,1,2,3].map(i=>`<i${i<x.b?' class="on"':''}></i>`).join('')}</span><small>${when(x.d)}</small></div>`).join('')}</div>`:''}`)}
function cramStart(){const Q=gshuf(cramDue()).slice(0,10);if(!Q.length){cramHome();return}gmStopAll();gm.cur='cram';
  const P=gmPool(gmLevel()),others=Object.values(cramGet());let i=0,score=0,wrong=[];
  function q(){const it=Q[i],zh2en=i%2===0;
    const pool=gshuf(others.filter(x=>x.w!==it.w&&x.z!==it.z).map(x=>[x.w,x.z]).concat(gshuf(P).slice(0,12))).filter(x=>x[0]!==it.w&&x[1]!==it.z);
    const seen=new Set([zh2en?it.w:it.z]),ds=[];for(const x of pool){const v=zh2en?x[0]:x[1];if(!seen.has(v)){seen.add(v);ds.push(x)}if(ds.length>=3)break}
    const opts=gshuf([[it.w,it.z],...ds]);
    gmScreen('錯字補習班',`<div class="hud gm-hud"><span>第 ${i+1} / ${Q.length} 題</span><span>答對 ${score}</span><span>進度 ${it.b}/4</span></div>
     <div class="gm-panel cram-q"><small>${zh2en?'這個中文，英文是？':'這個字是什麼意思？'}</small><b class="${zh2en?'':'en'}">${esc(zh2en?it.z:it.w)}</b>${zh2en?'':`<button class="iconbtn" id="crs" aria-label="朗讀">${ICON.speak}</button>`}</div>
     <div class="gm-opts">${opts.map((o,k)=>`<button class="gm-opt${zh2en?' en':''}" data-go="${k}">${esc(zh2en?o[0]:o[1])}</button>`).join('')}</div><div id="crn"></div>`);
    const sp=document.getElementById('crs');if(sp)sp.onclick=()=>speak(it.w,.85);
    let ans=false;document.querySelector('.gm-opts').onclick=ev=>{const b=ev.target.closest('.gm-opt');if(!b||ans)return;ans=true;const ok=opts[+b.dataset.go][0]===it.w;
      const C=cramGet(),c=C[norm(it.w)];let msg;
      if(ok){score++;if(c){c.b++;if(c.b>=4){delete C[norm(it.w)];rawStore.set('cramGrad',(rawStore.get('cramGrad',0)||0)+1);msg='畢業了。這個字，妳終於記住了。'}else{c.d=dplus(CRAM_GAP[c.b]);msg=['很好，'+CRAM_GAP[c.b]+' 天後我再考妳。','記住了？'+CRAM_GAP[c.b]+' 天後見真章。'][i%2]}}}
      else{b.classList.add('ng');wrong.push([it.w,it.z]);if(c){c.b=0;c.d=dplus(1);c.n=(c.n||1)+1}msg=['又錯？明天再來，直到妳記住為止。','同一個字錯兩次，妳在挑戰我的耐心。'][i%2]}
      rawStore.set('cram',C);speak(it.w,.9);
      document.querySelectorAll('.gm-opt').forEach((x,k)=>{if(opts[k][0]===it.w)x.classList.add('ok');x.disabled=true});
      document.getElementById('crn').innerHTML=`${gmSay(msg)}<button class="btn" id="crgo" style="width:100%;margin-top:10px">${i+1<Q.length?'下一題':'看成績'}</button>`;
      document.getElementById('crgo').onclick=()=>{i++;i<Q.length?q():end()}}}
  function end(){const left=cramDue().length,line=score===Q.length?'全對。今天的補習，准妳下課。':score>=Q.length/2?'還有幾個不熟，明天繼續盯妳。':'錯這麼多？明天提早到。';
    gmScreen('錯字補習班',`<div class="hud gm-hud"><span>答對 ${score} / ${Q.length}</span>${left?`<span>還有 ${left} 個待複習</span>`:''}</div>`+gmFinish('cram',score*12,line,wrong,left?'cram':'cramhome'))}
  q()}

/* ---------- 霸總來電：不用語音，用對話考單字；答對 3 題才准掛電話 ---------- */
const CALL_FREE=1;
function callLeft(){if(gamePass)return 99;const r=rawStore.get('callDay',{})||{};return r.d===dkey()?Math.max(0,CALL_FREE-r.n):CALL_FREE}
function callUse(){if(gamePass)return;const r=rawStore.get('callDay',{})||{},td=dkey();rawStore.set('callDay',{d:td,n:(r.d===td?r.n:0)+1})}
/* 來電出題：生字本／已讀最多 3 個，其餘從等級字庫隨機；最近 60 個問過的字先避開 */
function callWords(lv){const rc=new Set(rawStore.get('callSeen',[])||[]),p=gmPersonal(lv),zs=new Set(),ws=new Set(),out=[];
  const add=(x,cap)=>{if(out.length>=cap||ws.has(x[0])||zs.has(x[1]))return;ws.add(x[0]);zs.add(x[1]);out.push(x)};
  const per=gshuf(p.saved.concat(p.read)),pool=gshuf(gmPool(lv));
  per.filter(x=>!rc.has(x[0])).forEach(x=>add(x,3));pool.filter(x=>!rc.has(x[0])).forEach(x=>add(x,12));pool.forEach(x=>add(x,12));
  const W=gshuf(out);rawStore.set('callSeen',(rawStore.get('callSeen',[])||[]).concat(W.slice(0,6).map(x=>x[0])).slice(-60));return W}
function callStart(){
  if(!callLeft()){openModal(`<span class="kicker">霸總來電</span><h2>今天的電話接過了</h2><p>免費版每天可以接 1 通霸總來電。開通遊戲通行證，霸總隨時打給妳，所有遊戲無限玩。</p><div class="acts">${passBuy()}<button class="linkbtn" data-close style="align-self:center">明天再來</button></div>`);return}
  gmStopAll();gm.cur='call';const full=gm.gnName||((typeof CB_BOSSES!=='undefined'&&CB_BOSSES.length)?CB_BOSSES[Math.floor(Math.random()*CB_BOSSES.length)]:'傅寒州');gm.gnName=null;const sur=full.length>3?full.slice(0,2):full[0];
  const img=nextBossImg();let rejects=0;
  const ring=(sub)=>{app.innerHTML=`<div class="view call-v"><div class="call-scr ring"><img class="call-av" src="${img}" alt=""><b class="call-nm">${esc(full)}</b><span class="call-st">${sub||'來電中…'}</span>
    <div class="call-btns"><button class="call-no" id="cno" aria-label="拒接">✕<small>拒接</small></button><button class="call-yes" id="cyes" aria-label="接聽">✆<small>接聽</small></button></div></div></div>`;window.scrollTo(0,0);
    try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    document.getElementById('cyes').onclick=talk;
    document.getElementById('cno').onclick=()=>{rejects++;if(rejects===1)ring(genderize('「妳敢掛我電話？」<br>再次來電中…'));else if(rejects===2)ring(genderize('「第二次了。我數到三。」<br>再次來電中…'));else talk()}};
  function talk(){callUse();const lv=gmLevel(),P=gmPool(lv),W=callWords(lv);let qi=0,ok=0,wrong=[],t0=Date.now(),busy=false;
    app.innerHTML=`<div class="view call-v"><div class="call-scr talk"><div class="call-hd"><img src="${img}" alt=""><span><b>${esc(full)}</b><small id="ctm">00:00</small></span><button class="call-end" id="cend" aria-label="掛斷">✕</button></div>
      <div class="call-log" id="clog" aria-live="polite"></div><div class="call-opts" id="copt"></div></div></div>`;window.scrollTo(0,0);
    const tm=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000),el=document.getElementById('ctm');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);gm.stop.push(()=>clearInterval(tm));
    const log=document.getElementById('clog'),opt=document.getElementById('copt');
    const say=(t,me)=>{log.insertAdjacentHTML('beforeend',`<p class="cb ${me?'me':'boss'}">${esc(me?t:genderize(t))}</p>`);log.scrollTop=log.scrollHeight};
    const later=(f,ms)=>{const h=setTimeout(f,ms);gm.stop.push(()=>clearTimeout(h))};
    document.getElementById('cend').onclick=()=>{if(ok>=3)return;say(['想掛我電話？答對三題再說。','我還沒說完，誰准妳掛的？'][qi%2])};
    const OPEN=['在哪？……算了，先考妳單字。','我在開會，但我想聽妳的聲音。順便考考妳。','剛下飛機，第一通電話打給妳。別讓我失望。','聽說妳今天又在偷懶？三題，答對才准掛。'];
    const GOOD=['……還算聰明。','嗯，這才是我的人。','答對了。別得意，下一題。','不錯，今晚准妳早點睡。'];
    const BAD=['錯了。給我記清楚：','這都不會？我親自教妳：','妳是故意惹我生氣嗎？答案是：'];
    say(OPEN[Math.floor(Math.random()*OPEN.length)]);later(ask,900);
    function ask(){if(qi>=W.length||qi>=6){fin();return}const w=W[qi],zh2en=qi%2===0;
      const seen=new Set([zh2en?w[0]:w[1]]),ds=[];for(const x of gshuf(P)){const v=zh2en?x[0]:x[1];if(!seen.has(v)){seen.add(v);ds.push(x)}if(ds.length>=2)break}
      const opts=gshuf([w,...ds]);
      say(zh2en?`「${w[1]}」，英文怎麼說？`:`我剛剛說「${w[0]}」，是什麼意思？`);
      opt.innerHTML=opts.map((o,k)=>`<button class="call-o${zh2en?' en':''}" data-co="${k}">${esc(zh2en?o[0]:o[1])}</button>`).join('');busy=false;
      opt.onclick=ev=>{const b=ev.target.closest('.call-o');if(!b||busy)return;busy=true;const pick=opts[+b.dataset.co];say(zh2en?pick[0]:pick[1],true);opt.innerHTML='';
        const right=pick[0]===w[0];qi++;try{speak(w[0],.85)}catch(e){}
        if(right){ok++;later(()=>{say(GOOD[(ok+qi)%GOOD.length]+(ok<3?` 還差 ${3-ok} 題。`:''));later(ok>=3?fin:ask,900)},600)}
        else{wrong.push(w);later(()=>{say(BAD[qi%BAD.length]+`${w[0]}＝${w[1]}。`+(qi<6?'再來一題。':''));later(ask,1100)},600)}}}
    function fin(){clearInterval(tm);const s=Math.floor((Date.now()-t0)/1000),dur=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
      const END=ok>=3?['准妳掛電話了。……晚安。','今天表現不錯。明天這個時間，等我電話。','記住，下次我打來，不准讓我等。']:['今天先放過妳。明天，我要聽到全對。'];
      say(END[Math.floor(Math.random()*END.length)]);const n=cramAdd(wrong);
      later(()=>{const line=ok>=3&&!wrong.length?'一題都沒錯，這通電話我很滿意。':ok>=3?'答錯的字，我幫妳記下來了。':'下次再這樣，我就親自去找妳。';
        app.innerHTML=`<div class="view gm"><div class="gm-top"><button class="gm-back" data-ghome aria-label="回遊戲間">‹</button><h2>霸總來電</h2></div>
          <div class="hud gm-hud"><span>通話 ${dur}</span><span>答對 ${ok} 題</span><span>${esc(full)}</span></div>${cramNote(n)}${gmFinish('call',ok*20+(wrong.length?0:20),line,wrong,'call')}</div>`;window.scrollTo(0,0)},1400)}
  }
  ring();
}

function cbLayout(ctx,p,maxW,size){const {SERIF,SANS,EN,NOHEAD}=CBX;const lines=[];let line=[],x=size*2;
  const wW=tk=>{ctx.font=`600 ${size*1.05}px ${EN}`;const a=ctx.measureText(' '+tk.w).width;ctx.font=`500 ${size*.72}px ${SANS}`;return a+ctx.measureText('（'+tk.g+'）').width+10};
  for(const tk of cbTokens(p)){ctx.font=`500 ${size}px ${SERIF}`;const w=tk.t!=null?ctx.measureText(tk.t).width:wW(tk);
    if(x+w>maxW&&line.length&&!(tk.t!=null&&NOHEAD.includes(tk.t))){lines.push(line);line=[];x=0}

function cbWrap(ctx,text,maxW){const out=[];let l='';for(const ch of text){if(ctx.measureText(l+ch).width>maxW&&l&&!CBX.NOHEAD.includes(ch)){out.push(l);l=ch}else l+=ch}if(l)out.push(l);return out}
