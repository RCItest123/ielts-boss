<style>
/* Layout: one-column phone app — paperback reading surface, word "highlighter" marks, bottom tab bar, slide-up word sheet */
:root{
  --paper:#FBF8F7; --card:#FFFFFF; --ink:#2B2030; --muted:#76697B; --line:#ECE3E5;
  --wine:#9A2B4A; --wine-ink:#FFFFFF; --mark:#F7DCE3; --mark-ink:#7E1F3B; --soft:#F4ECEE; --ok:#2F7A5B;
  --shadow:0 10px 30px rgba(60,20,40,.12);

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161117; --card:#1F1820; --ink:#EEE5EC; --muted:#A698A8; --line:#30272F;
  --wine:#E27B98; --wine-ink:#1A0F14; --mark:#40222E; --mark-ink:#F5B5C7; --soft:#251C25; --ok:#6CC59E;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161117; --card:#1F1820; --ink:#EEE5EC; --muted:#A698A8; --line:#30272F;
  --wine:#E27B98; --wine-ink:#1A0F14; --mark:#40222E; --mark-ink:#F5B5C7; --soft:#251C25; --ok:#6CC59E;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--wine);outline-offset:2px;border-radius:6px}

/* Home */
.hero{padding-top:12px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--wine)}

.plan-head{display:flex;flex-direction:column;gap:4px}

.orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:2px 0}.orline:before,.orline:after{content:'';flex:1;border-top:1px solid var(--line)}

.tour{position:fixed;inset:0;z-index:90}

.tour-card{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:18px;padding:16px 18px;box-shadow:0 14px 34px rgba(0,0,0,.3);display:grid;gap:6px;transition:top .25s}
.tour-card b{font-size:18px}.tour-card p{margin:0;font-size:14.5px;line-height:1.65}.tour-card p b{font-size:inherit;color:var(--wine)}
.tour-n{font-size:12px;color:var(--muted);letter-spacing:.1em}
.tour-acts{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.tour-acts span{display:flex;gap:8px}.tour-acts .btn.sm{padding:8px 16px;font-size:14px;min-height:0;width:auto}

.mvbar{display:block;width:100%;text-align:left;font:inherit;font-size:14px;font-weight:700;color:#fff;background:var(--wine);border:0;border-radius:14px;padding:12px 14px;margin-bottom:12px;cursor:pointer}
.brandacts{display:flex;align-items:center;gap:8px}.loginbtn{font:inherit;font-size:13px;font-weight:700;color:var(--wine);background:var(--soft);border:0;border-radius:999px;padding:7px 12px;cursor:pointer}
.ml-shop{margin:2px 0 0;text-align:center;font-size:12px}.ml-shop a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}.ml-shop img{border-radius:4px}

.author .links{display:flex;flex-direction:column;gap:8px}
.author .support{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}

/* Story list */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:46px}

.chip{padding:6px 14px;border-radius:999px;background:var(--soft);font-size:14px;color:var(--muted)}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}

.row div{min-width:0}

.empty{padding:30px 6px;color:var(--muted);text-align:center}

/* Theme / intro page */
.cover{position:relative;border-radius:22px;padding:26px 22px 22px;background:var(--ink);color:var(--paper);overflow:hidden;display:flex;flex-direction:column;gap:12px}

.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.section-h h3{font-size:17px}

/* Reader */
.readbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:10px;padding:10px 0;margin-top:-18px;margin-bottom:-12px}

.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden}

.story{font-size:var(--read-size);line-height:2.05;display:flex;flex-direction:column;gap:1.1em}

.endcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}

  padding:8px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .25s ease}

式而",["rebound","反彈"],"。三個月的試用期到了，人資經理把一份新的",["agreement","協議"],"交給語晴，上面寫著：正式",["employee","員工"],"，職稱是總裁特別",["consultant","顧問"],"。語晴正要",["sign","簽署"],"，季宸川卻把筆拿走，從口袋裡拿出一個絲絨盒子。\"這份合約有一條",["clause","條款"],"是我自己加的，\"他單膝跪下，\"終身",["commitment","承諾"],"，沒有試用期，也不能",["cancel","取消"],"。林語晴，妳願意",["accept","接受"],"嗎？\"窗外的陽光灑進辦公室，她笑著點頭——這一次，她簽下的，是一輩子的約定。"]],"nw":66},{"id":2,"title":"總裁的替身秘書","paras":[["夏知微本來只",["intend","打算"],"做三個月就走。那份",["offer","工作邀約"],"開出翻倍年薪，條件只有一行：貼身秘書，二十四小時待命。她的",["savings","存款"],"早已見底，母親的醫藥",["expense","費用"],"像無底洞，她咬牙簽下名字。第一天，她",["enter","進入"],"霍氏集團那棟極度",["modern","現代化"],"的玻璃大樓，人資",["specialist","專員"],"上下打量她，眼神古怪得像在比對一張舊照片。總裁霍廷深沒有",["greet","問候"],"她，只丟下一句：\"妳的",["routine","例行公事"],"只有一條：我在哪，妳就在哪。\"從此她的每一項",["task","任務"],"，從挑選午餐的",["location","地點"],"到核對",["financial","財務的"],"報表，都必須達到他近乎苛刻的",["expectation","期望"],"。"],["相處久了，夏知微發現他並不如傳聞冷血。每次深夜的",["session","會議"],"結束，他總會帶她去頂樓的",["dining","用餐"],"區吃宵夜，說這是",["efficient","有效率的"],"管理員工體力。某天她為了找檔案",["browse","瀏覽"],"他的電腦，卻意外看見一個加密資料夾，裡面全是另一個女人的照片——那張臉，和她有七分像。她這才",["notice","注意到"],"，同事們在",["discussion","討論"],"中",["mention","提及"],"\"宋小姐\"時總會偷看她。她",["suppose","猜想"],"自己不過是個替身，壓抑的",["stress","壓力"],"讓她整夜失眠。隔天她冷淡地",["respond","回應"],"他的每一句話，霍廷深皺眉，扣住她的手腕：\"我給妳的",["response","回應"],"時間是三秒。說，誰惹妳了？\"兩人之間的",["distance","距離"],"近得能聽見心跳，她卻只想逃。"],["一個月後，宋婉寧",["return","回來"],"了。她是董事會",["chairperson","主席"],"的掌上明珠，一下飛機就登上財經",["broadcast","新聞節目"],"的頭條，聲稱將主導霍氏下一",["phase","階段"],"的海外",["trade","貿易"],"計畫。她踩著高跟鞋走進辦公室，笑著對夏知微說：\"替身就該有替身的自覺。妳拿走的那些溫柔，本來就是我的。\"隔天，一份匿名",["complaint","投訴"],"送到人資，指控夏知微洩漏新",["product","產品"],"的定價策略。董事們以",["authority","職權"],"施壓，要霍廷深",["persuade","說服"],"她主動請辭，以免公司承擔法律",["liability","責任"],"，人資甚至建議她先請長期",["leave","休假"],"。事件的",["scope","範圍"],"與",["scale","規模"],"迅速擴大，記者守在大樓門口。夏知微站在這場鬧劇的正中央，第一次覺得自己什麼都不是。"],["記者會當天，霍廷深一把拉住準備離開的她。\"誰准妳走了？\"他走上台，牢牢掌握",["initiative","主動權"],"，向全場",["demonstrate","展示"],"一份",["comprehensive","全面的"],"調查報告：系統日誌顯示，有人",["modify","修改"],"過檔案權限，而",["involve","牽涉"],"其中的帳號，正屬於宋婉寧的助理。經過",["extensive","廣泛的"],"比對，證據 ""]],"nw":63},{"id":7,"title":"總裁的真千金逆襲","paras":[["程映雪在霍氏集團只是一名實習生，沒有",["title","職稱"],"，也沒人記得她的名字。她每天在",["counter","櫃檯"],"後面整理",["retail","零售"],"報表，把每一個",["figure","數字"],"核對得分毫不差，從不出錯。同事說她",["rather","相當"],"死心眼，她卻只想用",["effort","努力"],"證明自己。直到那天，總裁霍廷深經過她的座位，翻開她的",["portfolio","作品集"],"，停了三秒。\"這份",["district","地區"],"分析，是你做的？\"她點頭。他冷冷丟下一句：\"明天起，調到我辦公室。這是命令，不是商量。\"沒有人",["anticipate","預期"],"到，一個普通實習生會被總裁親自點名。"],["調職後，她才知霍廷深多難伺候。他",["frequently","經常"],"深夜傳訊息要她",["finalize","定案"],"報告，對咖啡的",["preference","偏好"],"精準到溫度。可她加班時，桌上總多一碗熱粥。\"誰說是我買的？\"他頭也不抬，\"吃完。我的人，不准餓著。\"這時，蘇家千金蘇曼琪出現了。蘇家是霍氏最大的",["sponsor","贊助者"],"，經營",["luxury","精品"],"百貨，在商界",["reputation","名聲"],"極佳。曼琪走進辦公室，對映雪的",["opinion","意見"],"嗤之以鼻：\"實習生也配參與",["board","董事會"],"的",["campaign","活動"],"企畫？\"她",["generous","慷慨"],"地替每位同事",["upgrade","升級"],"成最新",["model","型號"],"的手機，唯獨略過映雪。映雪看著曼琪頸間那條玉墜，心口忽然一緊——那和她夢裡見過的一模一樣。"],["年度",["evaluation","評估"],"前夕，一份",["overseas","海外的"],"商場",["lease","租約"],"的",["legal","法律"],"文件外洩，系統紀錄顯示是映雪的帳號",["authorize","授權"],"下載。曼琪在會議上哭得梨花帶雨：\"我只是",["concern","擔心"],"公司的資安，沒想到她的",["intention","意圖"],"這麼可怕。\"她又拿出一份交易",["volume","數量"],"龐大的報表，說映雪故意把",["surplus","盈餘"],"寫成虧損、把",["cost","成本"],"灌水，害蘇家損失大筆",["credit","信用"],"額度。主管認定這個",["mistake","錯誤"],"該由她負責，要她立刻",["close","關閉"],"所有權限。映雪百口莫辯，",["unable","無法"],"解釋任何事。曼琪貼近她耳邊低語：\"就算你真是蘇家的女兒，我也不會讓你",["remain","留下"],"。\"原來她早知真相。"],["會議室的門被一腳踹開。霍廷深走進來，身後跟著資安",["engineer","工程師"],"與律師團。\"誰准你們動她？\"全場噤聲。\"我的人，輪不到你們來審。\"工程師調出",["latest","最新的"],"紀錄：外洩的",["source","來源"],"是一個隱藏",["link","連結"],"，登入裝置卻是曼琪的",["private","私人的"],"筆電，連報表的",["structure","結構"],"都被她動過手腳。接著，霍廷深將一份文件甩在桌上——那是醫學",["institute","機構"],"出具的親子鑑定。\"二十多年前那段",["period","期間"],"，醫院停電，保溫箱只能靠",["battery","電池"],"撐著，護理師慌亂中抱錯了兩個女嬰。\"他看向臉色慘白的曼琪，\"你偷走她整整兩個",["decade","十年"],"。我早就",["predict","預測"],"你會動手，只等你自己跳出來。\"蘇家夫婦紅著眼衝進來，蘇夫人顫抖著握住映雪的手，那條玉墜，本該",["represent","代表"],"她的身分。"],["真相大白，曼琪被撤銷慈善",["association","協會"],"理事的",["position","職位"],"，蘇家再也不",["protect","保護"],"她。董事會一致",["nominate","提名"],"映雪進入新品",["selection","選拔"],"小組，霍廷深只說：\"這是",["final","最終的"],"決定，有意見的，來找我。\"蘇父想",["organize","籌辦"],"盛大晚宴",["celebrate","慶祝"],"女兒回家，還要送她環球",["tour","旅遊"],"，映雪卻只說，想繼續靠自己為公司",["contribute","貢獻"],"。那晚，他把她堵在門口，遞上戒指。\"蘇家給你的，是遲來的",["promise","承諾"],"；我給你的，是",["ultimate","最終的"],"答案。\"她愣住：\"我得",["consider","考慮"],"一下。\"\"給你三秒。\"他俯身逼近，\"這份終身合約，我說了算。\"她笑著踮腳，在他唇上一吻，當作",["exchange","交換"],"。他低聲說：\"從第一天看見你，我就",["expect","預期"],"會有今天。\""]],"nw":63},{"id":8,"title":"總裁的豪賭","paras":[["陸聿寒把一只牛皮",["envelope","信封"],"推到方知夏面前。\"三個月內，你一定會愛上我。賭注，是整間分公司。\"那是他手上規模",["relatively","相對地"],"小、卻最賺錢的據點。知夏是業界最",["reputable","信譽良好的"],"公證會計師，見過無數對賭協議，卻沒見過這麼",["ambitious","有野心的"],"又荒唐的。\"陸總，這種賭約，法律上未必",["valid","有效"],"。\"\"那就讓它有效。\"他靠回椅背，\"輸的人，答應對方一個條件。你唯一的",["obligation","義務"],"，是每天出現在我面前。\"條款寫明：賭約期間，她享有",["fringe","附加"],"福利與",["stipend","津貼"],"，分公司的",["operational","營運的"],"數據須由她",["onsite","現場"],"稽核。她正要拒絕，他淡淡補了一句：\"我不接受拒絕。\""],["接下來的日子，陸聿寒的追求",["constant","持續"],"又霸道，訊息",["frequent","頻繁"],"得像鬧鐘。他把她臨時辦公室的",["interior","室內"],"全部重新裝潢，只為",["ease","減輕"],"她加班的疲憊；她胃不好，他就讓廚房把每道菜的",["ingredient","食材"],"換成溫和滋補的藥膳。她隨口說想逛夜市，他便包下整條街的每個",["stall","攤位"],"，連",["hygiene","衛生"],"都親自檢查。\"你這是浪費。\"\"為你，不算。\"他陪她去",["contemporary","當代的"],"美術館，畫裡",["depict","描繪"],"的海港，竟與她的故鄉",["resemble","相似"],"得驚人。她不得不承認，他比傳聞中",["considerate","體貼"],"，也有",["distinct","截然不同的"],"兩面：會議上冷酷無情，在她面前卻像個笨拙的",["companion","同伴"],"。賭局的",["momentum","動能"],"，正悄悄倒向他。"],["然而，有人不想讓賭局善終。陸聿寒的堂兄陸景鋒覬覦分公司已久，他買通",["distributor","經銷商"],"切斷",["supply","供應"],"，又讓南部",["plant","工廠"],"發生大規模",["outage","停電"],"，門市無法",["restock","補貨"],"，原本",["tentative","暫定的"],"上市計畫被迫喊停。接著，他在董事會上甩出一份帳本",["revision","修訂"],"紀錄，指控知夏為了讓陸聿寒贏，竄改數據、隱瞞",["insufficient","不足的"],"庫存。\"收錢辦事的會計，也敢自稱公正？\" ",["majority","多數"],"董事倒向他，",["influential","有影響力的"],"媒體大肆報導，知夏的名聲變得無比",["vulnerable","脆弱"],"。違約",["penalty","罰款"],"高達九位數，",["imminent","迫在眉睫"],"的危機一觸即發。她咬著唇想：是我",["overlook","忽略"],"了細節，是我的",["oversight","疏漏"],"。"],["關鍵時刻，陸聿寒推門而入，把她拉到身後。\"誰准你們碰她？她的帳，我信。\"其實調查早已",["underway","進行中"],"：他帶來一位老",["mechanic","技工"],"，證實停電是蓄意破壞；資安團隊調出自動化系統的原始紀錄，證明被竄改的是陸景鋒的版本。知夏迅速冷靜，十分鐘內",["summarize","彙整"],"出一份",["elaborate","詳細的"],"對帳報告，每筆數字都",["comply","遵守"],"會計準則。\"你的故事很",["plausible","合理"],"，可惜是假的。\"陸聿寒早已",["foresee","預見"],"一切，暗中",["devise","設計出"],"一套",["remedy","補救"],"方案，新經銷合約提前簽妥，局勢瞬間",["reverse","反轉"],"。陸景鋒被迫接受",["settlement","和解"],"，交出股份。董事們這才見識到兩人聯手的威力。"],["三個月期滿那天，陸聿寒",["invite","邀請"],"她回到初見的會議室。分公司營收創下",["extraordinary","非凡的"],"紀錄，",["improvement","改善"],"幅度遠勝其他",["comparable","可比較的"],"據點，連員工",["handbook","手冊"],"都依她的",["insight","洞察"],"改寫。他把",["envelope","信封"],"推回她面前：\"結算吧，誰輸了？\"她抽出一張紙，上面只寫著：我輸了。他愣住，下一秒把她擁入懷中。\"我贏了，所以你得答應我一個條件：我剩下的每一天，都要有你。這份賭約",["perpetual","永久"],"有效，誰都不得",["exempt","豁免"],"。\"她笑了：\"愛的",["essence","本質"],"不是輸贏。這筆交易，",["worth","值得"],"。\"他吻上她的額頭：\"我會用",["utmost","最大的"],"誠意，",["provide","提供"],"你一輩子的寵愛。為你做的一切，都",["worthwhile","值得"],"。\""]],"nw":63},{"id":9,"title":"總裁的心跳捐贈者","paras":[["夏沐心換心滿一年，人生突然失控。掌握全城醫材",["monopoly","壟斷"],"的傅氏集團",["announce","宣布"],"收購她任職的小公司，總裁傅景淵指名要她調到頂樓。術後醫師叮嚀她凡事保持",["caution","謹慎"],"，她卻天生",["resilient","有韌性的"],"，只想好好工作。新職務只有一項：整理公司",["repository","儲存庫"],"的舊檔，把每份會議",["transcript","逐字稿"],"都",["download","下載"],"備份。說是工作，更像監視——他總坐在她身旁盯著",["screen","螢幕"],"，有時卻閉上眼，像在聽什麼。\"傅總，這份工作的",["objective","目標"],"是什麼？我的",["responsibility","責任"],"又是什麼？\"他抬眼，語氣冷得像冰：\"待在我看得見的地方。這不是",["optional","可選的"],"。\""],["他的關心霸道得莫名。她租屋處的",["plumbing","水管"],"爆裂，隔天整棟",["occupant","住戶"],"都被安置進飯店，她卻被直接接到與他住處",["adjacent","相鄰的"],"公寓。\"我不需要你可憐。\"\"我不可憐任何人。\"他主動替她戴上一只",["portable","可攜式的"],"心律監測器，\"有任何異常，我第一個",["detect","偵測"],"到。\"公司年會的",["theme","主題"],"是「新生」，她在",["ballroom","宴會廳"],"裡不擅與人",["mingle","交際"],"，他便寸步不離，誰靠近就冷冷一瞥。這個行事",["conservative","保守的"],"、說話",["prudent","謹慎的"],"男人，竟偷偷",["rehearse","排練"],"了好幾遍才開口邀她跳舞。她在他懷裡，焦慮慢慢",["diminish","減少"],"，心中滿是",["gratitude","感謝"],"，再也",["resist","抵抗"],"不了心動。只是她不懂，他看她的眼神，為何總像在看另一個人。"],["年會結束那晚，一封匿名郵件被",["forward","轉寄"],"到全公司，",["enclosure","附件"],"是一份器官捐贈紀錄。寄件人是傅景淵已故未婚妻的妹妹沈若嵐。她當眾攔住沐心：\"你以為他愛你？你胸口那顆心，是我姊姊的！\"原來三年前那場車禍",["incident","事件"],"後，沈清禾簽下捐贈",["consent","同意書"],"，而沐心正是受贈者。依照",["statute","法規"],"，醫院",["prohibit","禁止"],"公開受贈者身分，若嵐卻以",["plaintiff","原告"],"身分提告，指控傅景淵違法調閱。流言隨之",["arise","產生"],"，輿論",["volatile","不穩定"],"，傅氏的",["profit","利潤"],"預估暴跌，",["impending","即將到來的"],"併購",["negotiation","談判"],"也被",["disrupt","中斷"],"。沐心再也",["endure","忍受"],"不了——原來他要的，只是那顆心跳。她遞出",["resignation","辭呈"],"，把他的號碼",["delete","刪除"],"，連夜搬走。"],["第三天，她的心臟出現排斥，在雨夜街頭昏倒。醒來時，傅景淵守在床邊，眼裡滿是血絲。\"誰准你走了？\"他嗓音沙啞，\"你的命，現在歸我管。\"他把所有會議",["streamline","精簡"],"到最短，直到確認她得到",["adequate","足夠的"],"照顧，才召開記者會，親自",["acknowledge","承認"],"一切：他從未違法，所有程序都",["adhere","遵守"],"器捐規範，是清禾生前留下遺願，請他",["oversee","監督"],"受贈者的健康。他拿出",["tangible","具體的"],"證據——清禾的親筆信、醫院的",["eligibility","資格"],"審查紀錄與配對報告，證明沐心依法",["qualify","符合資格"],"。反倒是若嵐花錢找駭客竊取病歷。真相終究",["prevail","勝出"],"，若嵐被",["compel","強迫"],"撤告道歉。"],["出院那天，傅景淵在頂樓等她。\"一開始，我只想聽那顆心跳。\"他坦白，\"後來我才弄清楚，讓我心動的是你的倔強、你的笑，是你本人。\"清禾的心選擇了她，是要",["motivate","激勵"],"她好好活，而不是讓他困在過去。他",["empower","授權"],"她主持傅氏器捐基金會，第一屆",["tenure","任期"],"五年。\"你夠",["competent","稱職"],"，和我無關。\"計畫",["comprise","包含"],"心理輔導與",["inexpensive","平價的"],"居家照護，",["potentially","可能"],"幫助上千個家庭，因為器捐觀念在這裡還不夠",["prevalent","普遍"],"。新計畫",["commence","開始"],"那天，她問他：\"留在你身邊，要什麼資格？\"他把她的手按在自己心口：\"唯一的",["prerequisite","先決條件"],"，是讓我愛你。從今天起，你有權管我一輩子。\"她笑著吻他，晚風裡，兩顆心跳漸漸同頻。"]],"nw":61},{"id":10,"title":"總裁的街區收購戰","paras":[["唐初蕾守著外婆的老麵包店已經五年。店在一條",["historic","歷史悠久的"],"老街上，",["exclusively","專門"],"賣外婆傳下的紅豆麵包，隨",["seasonal","季節性的"],"水果換口味。清晨五點起床揉麵，是她改不掉的",["habit","習慣"],"。利潤",["marginal","微薄"],"，帳戶",["balance","餘額"],"常常見底，老舊的",["premises","店面"],"年年漏水，但這間店是她唯一的",["asset","資產"],"。直到國內",["leading","龍頭"],"建設集團總裁厲北辰帶著",["architect","建築師"],"上門，開出天價。\"不賣。\"她把合約推回去。三天後，整條街的房東全換成厲氏，每家店的",["tenancy","租約"],"都握在他手裡。這個以",["rational","理性"],"冷血聞名的男人推門而入：\"現在，願意談了嗎？這條街，我說了算。\""],["從那天起，厲北辰每天下午三點準時出現，買店裡最貴的蛋糕，連找零都不要。這種",["repetitive","重複的"],"戲碼持續了一個月，街上的",["acquaintance","熟人"],"都笑說，總裁的甜食",["consumption","消耗量"],"恐怕是全城之冠。初蕾對他保持",["courteous","客氣"],"而冷淡的態度，說話",["succinct","簡短"],"得像收據。可他總會",["detour","繞道"],"到後巷，替她修好漏電的烤箱，臨走丟下一句：\"這次的",["warranty","保固"],"，一輩子。\"某夜，她隔著櫥窗不經意一瞥，看見他獨自坐在車裡，一口一口吃完那塊蛋糕，神情竟有幾分溫柔。其餘的蛋糕，他都讓助理送去附近的",["nursing","護理"],"之家。她不得不",["admire","欽佩"],"他的耐心，也讀懂了那份",["implicit","隱含的"],"心意。"],["然而，厲氏副總裴子昂早就盯上這塊地。他背著厲北辰與外部財團私下聯手開發，趁都市更新",["deregulation","解除管制"],"強推拆遷，又對初蕾提起",["civil","民事"],["lawsuit","訴訟"],"，指控店面違反",["stringent","嚴格的"],"消防法規。法院先裁定",["partial","部分"],"查封，媒體",["speculate","推測"],"厲北辰才是幕後黑手，裴子昂更當眾",["disclose","揭露"],"一封有厲北辰簽名的郵件。厲氏股價劇烈震盪，初蕾的心像被撕開。漫長的",["litigation","訴訟"],["deplete","耗盡"],"了她的積蓄，店裡的",["liquidity","流動資金"],"瞬間見底，那些吃她麵包長大的老客人也被嚇跑。冷冰冰的",["bureaucracy","官僚體制"],"讓她求助無門，她抱著外婆的照片，在貼滿封條的門前哭了一夜。"],["怪手開到街口那天，厲北辰的車橫停在店前。他一把將初蕾拉到身後：\"誰准你們動她的店？\"裴子昂冷笑：\"厲總，合約上的",["signatory","簽署人"],"是你。\"厲北辰把文件摔在他臉上：\"那是偽造的。董事會昨晚已通過",["resolution","決議"],"，撤你的職，所有工程",["indefinitely","無限期地"],"暫停。\"他早料到這個",["scenario","情境"],"，暗中蒐證，連裴子昂的",["predecessor","前任"],"都出面作證。律師團引用",["favorable","有利的"],"判決",["precedent","先例"],"，法院",["uphold","維護"],"老店的權益，所有",["administrative","行政的"],"處分也一併撤回。他轉頭看她，聲音低了下來：\"我做了這麼多",["concession","讓步"],"，只為了你。從一開始，我就",["wholly","完全地"],"站在你這邊。買下這條街，從來不是為了拆。\""],["一個月後，老街舉辦盛大的",["event","活動"],"。厲北辰當著所有",["audience","觀眾"],"宣布：整條街改為保存計畫，交由",["nonprofit","非營利的"],"基金會管理，他",["appoint","任命"],"的執行長，是唐初蕾。他把集團文創部門的總部遷到老街，還在街口",["erect","建造"],"了外婆的紀念碑。\"這是我最具",["strategic","戰略意義"],"的投資。\"街坊紛紛上前",["congratulate","恭喜"],"她，連當初看熱鬧的",["spectator","觀眾"],"都成了熟客。後續的",["fundraising","募款"],"與",["collaboration","合作"],"將",["stimulate","刺激"],"老街重生，麵包也會送進",["rural","鄉村的"],"小學，讓老店",["diversify","多元化"],"經營。夜裡，他又點了最貴的蛋糕。\"這次不賣，\"她說，\"我請你。\"他低頭吻她：\"所有難題我都替你",["solve","解決"],"，餘生慢慢",["complete","完成"],"這筆交易——這家店，連同你，都歸我。\""]],"nw":59},{"id":11,"title":"總裁的婚禮搶婚","nw":61,"locked":1},{"id":12,"title":"總裁的違約聯姻","nw":60,"locked":1},{"id":13,"title":"總裁的替嫁新娘","nw":60,"locked":1},{"id":14,"title":"總裁的天價違約金","nw":64,"locked":1},{"id":15,"title":"總裁的海上救援","nw":62,"locked":1},{"id":16,"title":"總裁的還債契約","nw":64,"locked":1},{"id":17,"title":"總裁的親子鑑定風暴","nw":63,"locked":1},{"id":18,"title":"總裁的白月光竟是我","nw":61,"locked":1},{"id":19,"title":"總裁的反間計 年口譯約","paras":[["溫以安推開會議室的門時，整個",["delegation","代表團"],"都安靜了。他是公司臨時",["recruit","招募"],"的同步",["interpreter","口譯員"],"，負責陪同總裁顧承曜前往東京，協助",["headquarters","總部"],["expand","擴展"],"海外市場。坐在長桌盡頭的男人抬起頭，手中的鋼筆停在",["proposal","企劃書"],"上。七年前，他們是大學室友；七年前，溫以安在畢業典禮前一晚不告而別。\"你的",["qualification","資格"],"很漂亮，\"顧承曜翻著他的",["reference","推薦信"],"，語氣平靜得可怕，\"希望這次你能",["punctual","準時"],"一點，至少撐到合約結束。\"溫以安握緊公事包，只回了一句：\"我會",["confirm","確認"],"每一項",["itinerary","行程"],"。\""],["飛往東京的航班因為颱風",["delay","延誤"],"了四個小時。在",["departure","出境"],"大廳，顧承曜一句話也沒說，卻把自己的",["complimentary","免費的"],"貴賓室券塞進他手裡。過了",["customs","海關"],"，他又順手接過溫以安的",["luggage","行李"],"。到了飯店，",["reception","接待處"],"說只剩一間",["available","可入住的"],["suite","套房"],"。\"我去找其他",["accommodation","住宿"],"。\"溫以安轉身要走，手腕卻被一把拉住。\"沙發歸我，\"顧承曜說，\"明天的",["presentation","簡報"],"很重要，你需要休息。\"那一晚，溫以安翻著",["revise","修改"],"到第十版的講稿，才發現每一頁的",["margin","頁邊空白"],"都有顧承曜的手寫字：專有名詞的",["pronunciation","發音"],"、日方",["investor","投資人"],"的喜好，甚至他當年最愛的",["beverage","飲料"],"——溫牛奶，不加糖。"],["簡報當天，",["venue","會場"],"的",["projector","投影機"],"突然",["malfunction","故障"],"，現場",["technician","技術人員"],"忙了二十分鐘仍找不到原因。更糟的是，對手公司的代表趁機",["interrupt","打斷"],"，質疑顧氏的",["revenue","營收"],["forecast","預測"],"根本不",["feasible","可行"],"。台下的",["attendee","與會者"],"開始交頭接耳。溫以安深吸一口氣，拿出他前一晚準備的",["backup","備份"],["handout","講義"],"，用流利的日文把每一個",["estimate","估計"],"、每一筆",["budget","預算"],"講得清清楚楚。最後，他看著對手補了一句：\"如果貴公司對",["sustainable","永續的"],"供應鏈有疑問，我們很樂意",["collaborate","合作"],"。\"全場掌聲響起。顧承曜看著他，眼裡第一次有了溫度——他又一次被這個人打動了，七年前是，現在也是。"],["慶功",["banquet","宴會"],"上，日方社長舉杯",["toast","敬酒"],"，宣布與顧氏建立長期",["partnership","合作關係"],"。溫以安躲到陽台透氣，顧承曜的特助卻跟了出來，遞給他一個厚厚的檔案夾。\"七年前，總裁的父親拿你家公司的債務當",["leverage","籌碼"],"，逼你離開，對吧？\"特助嘆氣，\"總裁後來才知道真相。這七年，他一直在",["track","追蹤"],"你的消息。這次口譯的",["vacancy","職缺"],"，是他特地為你開的。\"溫以安翻開檔案夾，裡面是他每一場研討會的",["agenda","議程"],"、每一份工作的履歷紀錄。原來這場重逢不是",["coincidence","巧合"],"，而是一個人",["persistent","堅持不懈的"],"等待。"],["回國那天，溫以安在",["gate","登機門"],"前停下腳步。\"顧總，口譯合約今天到期，\"他說，\"我想",["apply","申請"],"一個",["permanent","長期的"],"職位。\"顧承曜挑眉：\"什麼職位？\"溫以安把自己的",["boarding pass","登機證"],"塞進他手裡，背面寫著一行字：「應徵：你身邊的位置。可",["relocate","搬遷"],"，可配合",["overtime","加班"],"，不需要",["compensation","報酬"],"。」身後的",["colleague","同事"],"們開始起鬨。顧承曜看了很久，低頭笑了。他把人拉進懷裡，在登機",["announcement","廣播"],"聲中輕聲說：\"面試通過了。不過我有一個",["condition","條件"],"——這次你是我的",["priority","優先事項"],"，不准再",["withdraw","退出"],"。\"窗外的飛機",["depart","起飛"],"了，他們終於一起回家。"]],"nw":63},{"id":2,"title":"總裁與宿敵的聯姻契約","paras":[["宋氏",["corporation","集團"],"與裴氏",["organization","組織"],"鬥了二十年，兩位父親卻在一場",["seminar","研討會"],"後突然",["decide","決定"],"讓兒子聯姻。婚前協議寫得清清楚楚：一年後離婚，雙方",["benefit","利益"],"平分，沒有任何",["exception","例外"],"。新婚當晚，宋霆鈞把一張",["diagram","示意圖"],"甩在桌上，用",["label","標籤"],"標出每一區的歸屬，連走廊都畫了界線。\"這間",["apartment","公寓"],"的",["design","設計"],"是我的，你住左邊。\"裴知遠冷笑著拿筆",["calculate","計算"],"面積：\"不",["accurate","準確"],"，你多畫了三坪。\"兩個在各自",["sector","產業"],"呼風喚雨的男人，第一晚就為了",["exact","確切的"],"坪數吵到半夜。這段婚姻不過是一年的",["trial","試用"],"，誰先",["adapt","適應"],"誰就輸了。"],["同居第一週，兩人連早餐都要較勁。宋霆鈞嫌裴知遠的咖啡機是舊型號，直接訂一整套新",["equipment","設備"],"，還要求",["delivery","送貨"],"當天到；裴知遠就把大門換成",["electronic","電子的"],"密碼鎖，順手把冰箱",["inventory","庫存"],"全部換新。管家給的",["advice","建議"],"是各退一步，兩人誰也不聽。直到某個深夜，宋霆鈞發燒到三十九度，裴知遠一邊罵他連照顧自己的",["skill","技能"],"都沒有，一邊用",["mobile","手機"],"叫醫生，把冷氣調到最溫和的",["level","檔位"],"。宋霆鈞昏沉中抓住他的手腕：\"誰准你走了？\"裴知遠耳根一熱，竟沒有掙開。等宋霆鈞",["recover","康復"],"後嘴上照樣不饒人，卻悄悄替他",["subscribe","訂閱"],"了最愛的財經雜誌，還把他的名字設成私人通訊錄的第一位。"],["宋氏最",["profitable","賺錢的"],"晶片部門即將發表新品，裴知遠的堂弟裴景豪卻在董事會上丟出一份",["technical","技術的"],"文件，聲稱裴知遠把核心",["design","設計"],"外洩給對手，還有一筆海外款項",["wire","匯"],"進他的帳戶。消息傳遍全球財經媒體，宋氏的信用",["rating","評等"],"一夜下滑，股東要求",["suspend","暫停"],"裴知遠的一切職權，媒體的",["description","描述"],"更把他寫成見錢眼開的叛徒。這成了全城最熱的",["issue","議題"],"，裴知遠被保全護送到記者會，台下閃光燈刺得人睜不開眼。他望向台側那位名義上的",["employer","雇主"],"兼丈夫，心想對方終於能提前離婚了，便失望地垂下眼。"],["下一秒，宋霆鈞大步上台，把他拉到身後。\"我的人，輪不到你們審判。\"他示意助理",["display","展示"],"螢幕，投出",["overall","整體的"],"資金流向：那筆匯款的",["initial","最初的"],"來源，正是裴景豪的海外空殼公司；所謂外洩文件，連",["version","版本"],"編號都是偽造的。原來他早就",["instruct","指示"],"法務團隊",["coordinate","協調"],"各方展開調查，還請來資安",["field","領域"],"最",["outstanding","傑出的"],"專家與他",["correspond","通信"],"往來、逐一比對，那位專家正是裴知遠當年",["recommend","推薦"],"的人。\"你以為靠堂哥身分的那點",["influence","影響力"],"，就敢動我丈夫？\"裴景豪腿一軟，被帶走時",["identification","身分證明"],"都掉在地上。全場先是死寂，接著快門響成一片，今晚的",["highlight","重點"],"是宋總當眾護夫。"],["一年之期到了，律師送來離婚協議，裴知遠握著筆遲遲沒簽。\"這份合約，我說了算。\"宋霆鈞把協議撕成兩半：\"我不",["allow","允許"],"你走。新條款只有一條，期限是一輩子，沒有",["alternative","替代方案"],"。\"裴知遠挑眉：\"你這是求婚，還是想",["restore","恢復"],"舊約？\"宋霆鈞耳根泛紅：\"是",["desire","渴望"],"。我",["depend","依賴"],"你，比你想的還多。\"後來兩人把禮金",["donate","捐贈"],"給",["community","社區"],"的職業",["training","培訓"],"計畫，幫陷入",["unemployment","失業"],"困境的人重新拿回",["salary","薪水"],"與尊嚴。媒體說，這是年度最",["popular","熱門的"],"話題，也是最好的",["example","例子"],"：宿敵",["eventually","最終"],"成了愛人。而在",["vacation","假期"],"的海邊，宋霆鈞只對陌生人",["introduce","介紹"],"一句：\"這是我先生。\""]],"nw":62},{"id":3,"title":"總裁與他的保鏢","paras":[["恆盛集團的",["president","總裁"],"祁慕寒以冷血聞名，全",["firm","公司"],"上下沒人敢直視他。接連收到恐嚇",["message","訊息"],"後，董事",["committee","委員會"],"強制替他請了保鏢——退役特種兵韓烈。報到第一天，韓烈就遞上一本自製的安全",["guide","指南"],"，列出",["multiple","多重的"],"檢查",["procedure","程序"],"：進電梯前要先",["locate","找到"],"出口，門禁",["access","權限"],"全部重設，連每天的行程都得即時",["update","更新"],"給他。祁慕寒翻兩頁就丟進碎紙機：\"我付你薪水，不是請你來管我。\"韓烈面不改色，又放上",["additional","額外的"],"一份",["file","檔案"],"：\"我的",["role","角色"],"是讓你活著。有意見，你可以去",["consult","諮詢"],"律師。\""],["接下來一個月，祁慕寒處處刁難。他故意",["adjust","調整"],"行程，在機場",["terminal","航廈"],"趁",["transit","轉機"],"甩開人，一轉身卻看見韓烈站在登機口，連呼吸都沒亂。他在員工餐廳跟",["cashier","收銀員"],"多聊幾句，韓烈就一聲不響地",["remove","移除"],"他手邊來路不明的飲料。某次",["municipal","市政的"],"工程",["site","地點"],"視察，鷹架的固定",["component","零件"],"突然鬆脫，韓烈一把將他按進懷裡，鋼管擦著背砸下。祁慕寒聽著對方沉穩的心跳，第一次說不出刻薄的",["remark","評論"],"。連秘書都察覺到他的",["change","改變"],"。那晚他把碎紙拼回去，嘴硬說只是想",["review","審查"],"那些",["instruction","指示"],"是否",["effective","有效的"],"，順便",["weigh","權衡"],"對方的",["suggestion","建議"],"。"],["年度記者會前夕，副總董振邦在內部",["bulletin","公告"],"放出風聲，說祁慕寒挪用公益",["donation","捐款"],"填補私人",["loan","貸款"],"，還附上偽造的",["income","收入"],"報表與灌水的數字。各大財經",["platform","平台"],"一片譁然，早報特別",["edition","版"],"用斗大標題痛批，網路",["survey","調查"],"顯示九成股民要他下台。董振邦的耐心早已到了",["limit","極限"],"，更",["severe","嚴重"],"的是，董振邦暗中買通一名假記者，打算在現場製造「意外」，好名 "reward","獎勵"],"。你把房子變成了家，這是我唯一的",["conclusion","結論"],"。\""]],"nw":58},{"id":7,"title":"總裁的替身情人","paras":[["許知南第一次走進沈氏集團的",["building","大樓"],"，是為了一筆",["enormous","龐大的"],"債務。父親",["bankruptcy","破產"],"後留下的",["arrears","欠款"],"壓得他喘不過氣，",["bank","銀行"],"的",["payment","付款"],"催繳單一張接一張。頂樓辦公室裡，沈硯舟冷冷地",["inspect","審視"],"他的",["profile","資料"],"，又端詳他的臉，像在",["analyze","分析"],"一件精密的",["instrument","儀器"],"。\"你很像一個人。\"他把合約推過來，\"一年。我替你還債，你留在我身邊。\"合約",["attach","附上"],"一張照片，青年眉眼與他極像——是沈硯舟過世的初戀。許知南明白這是唯一",["viable","可行的"],"出路，終究提筆簽名。他告訴自己：等",["paycheck","薪水"],"存成足夠的",["deposit","存款"],"，他就",["immediately","立刻"],"離開。"],["沈硯舟規矩極多，連泡茶的",["method","方法"],"都得照那個人的習慣。許知南被調進策略",["department","部門"],"，明明是",["qualified","合格的"],"分析師，同組的",["associate","同事"],"卻私下議論他靠臉上位。他默默",["perform","執行"],"每一項任務，刻意",["avoid","避免"],"與沈硯舟對視，保持",["appropriate","適當的"],"距離，卻總在加班深夜發現桌上多了一碗",["nearby","附近的"],"老店熱湯。有一次他",["misplace","放錯"],"了季度報表，翻遍每個",["cabinet","櫃子"],"，沈硯舟卻把文件遞回來：\"慌什麼？有我在。\"許知南心口一顫，又逼自己",["refrain","克制"],"——這份溫柔不屬於他。他不能動搖，不能",["express","表達"],"半點心動。"],["董事會上，周子恆突然發難。他是力捧的接班",["candidate","候選人"],"，也是那位初戀的表哥。\"許助理私吞了一筆",["commission","佣金"],"，還挪用海外",["investment","投資"],"的",["fund","資金"],"。\"他把一份",["preliminary","初步的"],"調查",["record","紀錄"],"投上螢幕，用圖表",["illustrate","說明"],"每一筆可疑的",["incoming","匯入的"],"款項，甚至附上",["website","網站"],"後台的登入紀錄截圖。有人冷笑：\"替身就是替身，果然手腳不乾淨。\"許知南想解釋，卻發現所有證據都經過",["deliberate","蓄意的"],"安排。周子恆更宣布凍結他名下的",["equity","股權"],"，並要求",["guarantor","保證人"],"出面賠償——偏偏是住院中的母親。他第一次",["suspect","懷疑"],"自己從頭到尾只是一枚棋子。"],["\"說完了？\"沈硯舟緩緩起身，全場死寂。\"我的人，輪不到你來動。\"他讓法務",["insert","插入"],"一支隨身碟，螢幕上跳出完整金流，每一筆錢的",["direction","方向"],"都指向周子恆的海外帳戶。\"你花三個月做假帳，我只用三天就",["diagnose","診斷"],"出",["notable","顯著的"],"漏洞。\"證據的時間",["span","跨度"],"長達兩年，牽連範圍之",["broad","廣"],"，董事們倒抽一口氣。周子恆被警衛帶離，收購案重新順利推進。許知南的恐懼才被",["relieve","緩解"],"，卻在散會後聽見沈硯舟對律師說：\"合約到期，一切",["revert","恢復"],"原狀。\"他心沉谷底，當晚留下字條：\"這一年，我很",["appreciate","感激"],"。\"便訂了出國的單程機票。"],["機場外",["traffic","交通"],"大打結，沈硯舟丟下",["upscale","高檔的"],"座車，穿過",["outdoor","戶外的"],"廣場一路狂奔，終於在安檢",["barrier","閘口"],"前攔住許知南。\"誰准你走了？\"他喘著氣，眼底發紅。許知南苦笑：\"合約到期，替身也沒有存在的必要了。\"\"你聽錯了。\"沈硯舟一字一句地",["reiterate","重申"],"，\"恢復原狀，是要把你的債務和你母親的",["prescription","處方"],"藥費全部清掉，讓你不再欠任何人。董事會的",["approval","核准"],"我昨天就拿到了。\"他從懷裡掏出一份新合約，\"這是",["supplement","補充"],"條款，期限一輩子。\"他承認起初確實把他當影子，可早就分得清誰是誰。\"我不要什麼相像的替代品，我",["pick","挑選"],"的人是你，我想",["possess","擁有"],"的也只有你。\"許知南眼眶一熱，被他",["embrace","擁抱"],"進懷裡。廣播催促登機，沈硯舟握緊他的手：\"這份合約，我說了算——你只要簽名。\""]],"nw":60},{"id":8,"title":"冰山總裁與天才駭客","paras":[["凌晨兩點，傅氏集團的",["entire","整個"],"系統全面",["breakdown","故障"],"，螢幕跳出勒索訊息：七十二小時內付出一億，否則公開所有客戶資料。三個月前，白昭然才被傅凜當眾開除，人事",["appraisal","考核"],"上寫著他",["violate","違反"],"資安規範。其實他不過太",["candid","坦率"],"，在會議上直指系統有",["fundamental","根本的"],["flaw","缺陷"],"，得罪了技術長鄭明哲，也因此丟了飯碗。此刻他盯著服務",["disruption","中斷"],"的新聞快訊，咬牙搭上末班",["shuttle","接駁車"],"，衝回那棟城市",["landmark","地標"],"般的玻璃大樓。值班",["secretary","秘書"],"想攔他，他冷笑：\"你們的防火牆，是我寫的。\""],["機房裡，傅凜一身黑西裝站在伺服器前，眼神比冷氣還冰。\"誰准你回來的？\"\"要罵可以",["defer","延後"],"，\"白昭然頭也不抬，\"先讓我進去。\"他在層層日誌間",["navigate","穿梭"],"，擷取一段",["excerpt","摘錄"],"程式碼，發現病毒",["predominantly","主要"],"藏在",["maintenance","維護"],"帳號裡。傅凜沉默片刻，下令把所有運算",["capacity","資源"],["allocate","分配"],"給他。白昭然",["switch","切換"],"到備援主機，逐一",["validate","驗證"],"每筆",["raw","原始的"],"封包，手速",["accelerate","加速"],"到極限。兩人熬了三天三夜，傅凜親自替他",["replenish","補充"],"咖啡，把西裝外套蓋在他肩上。\"這裡根本沒辦法好好思考。\"白昭然早已到了",["physical","體能"],"極限。傅凜淡淡道：\"那就習慣。從今天起，你只准待在我看得到的地方。\""],["第三天清晨，駭客放話要把資料放上暗網",["auction","拍賣"],"，由出價最高的",["bidder","投標人"],"得標。就在這時，鄭明哲帶著董事闖進機房，",["cite","引用"],"一段日誌：\"入侵程式上有白昭然的數位",["signature","簽名"],"，他離職時還帶走一個可疑的",["gadget","小工具"],"。\"他高舉一支隨身碟，\"裡面全是",["harmful","有害的"],"程式，足以",["constitute","構成"],"犯罪證據！\"消息外流，輿論掀起",["controversy","爭議"],"，股價連續三日跳水，市值嚴重縮水。董事們",["reckon","估計"],["economic","經濟的"],"損失已破十億，要求報警。鄭明哲冷笑：\"這種危險人物，就該關起來。\"白昭然握緊拳頭，看向傅凜——他以為，那個人會像三個月前一樣不信他。"],["\"說夠了？\"傅凜擋在白昭然身前，聲音冷得像刀，\"我的人，輪不到你來動。\"他示意助理播放影片：三個月前開除白昭然，只是為了讓鄭明哲鬆懈，好暗中保全證據；這段期間，他讓偽裝成",["electrician","電工"],"的調查員在鄭明哲辦公室裝了監控。白昭然同時敲下最後一行指令，兩組攻擊來源",["respectively","分別"],"指向鄭明哲的私人電腦和海外人頭帳戶。\"這就是最終",["confirmation","確認"],"。\"警方依",["jurisdiction","管轄權"],"當場帶走鄭明哲。他原以為除掉白昭然就少了個",["hassle","麻煩"],"，卻輸給對方",["sheer","純粹的"],"實力。董事們紛紛",["commend","讚揚"],"白昭然，傅凜則宣布",["reinforce","加強"],"資安、",["unify","統一"],"所有系統，並說：\"他是我見過最",["dependable","可靠的"],"人。\""],["風波平息後，財經",["article","文章"],"連日報導這場反擊，",["publicity","宣傳"],"效果勝過任何廣告，網友還敲碗等",["sequel","續集"],"。傅凜把新合約放到白昭然面前：薪水",["double","加倍"],"，最高等級",["clearance","權限"],"，加班費全額",["reimburse","報銷"],"，外加研發",["grant","補助金"],"，且不必再上",["orientation","新進訓練"],"。\"辦公室已經",["furnish","布置"],"好了，就在我隔壁。\"白昭然挑眉：\"開除我一次，就想這樣",["reconcile","和好"],"？\"傅凜俯身替他理好凌亂的領口：\"我們的",["capability","能力"],"剛好互相",["complement","互補"],"——你守系統，我守你。\"他甚至把保險",["beneficiary","受益人"],"改成了白昭然的名字。窗外城市",["landscape","景觀"],"亮起燈火，白昭然終於笑了：\"那晚餐的",["booking","預訂"],"，你來付。\"\"全部都是你的。\"傅凜低聲說，\"包括我。\""]],"nw":59},{"id":9,"title":"總裁的契約室友","paras":[["葉澄被房東趕出門那晚，所有",["expensive","昂貴的"],"畫具都被扣作",["collateral","抵押品"],"。他曾是畫壇最",["promising","有潛力的"],["independent","獨立"],"畫家，卻因經紀人捲款，背上一張",["lengthy","長長的"],"債務清單。大雨中，霍廷琛的轎車停在他面前，車窗降下，遞來一份",["draft","草稿"],"合約：\"同居一年，替我畫一幅畫，債我替你還。\"條款寫得極其",["explicit","明確"],"：未經",["permission","許可"],"不得搬走；畫作完成，",["thereafter","此後"],"兩不相欠。葉澄翻看時十分",["cautious","謹慎"],"，暗自",["presume","推測"],"這男人必有所圖，可窗外",["metropolitan","大都會的"],"夜色冰冷，他已無處可去。霍廷琛的語氣強勢而不耐：\"上車。我不說第二次。\""],["霍廷琛把頂樓一個房間改成畫室，",["equip","裝備"],"了最頂級的顏料與畫架。合約的",["guideline","守則"],"沒寫的是，他每天下班都會出現，坐在角落看葉澄畫畫，一看就是整晚。\"你在監工？\"葉澄皺眉。\"我在看我的東西。\"霍廷琛答。兩人的生活形成強烈",["contrast","對比"],"：一個整天",["attend","出席"],"會議，一個只與色彩相處。葉澄原以為這樣的陪伴會很",["tedious","乏味"],"，卻發現畫的",["composition","構圖"],"每天都在",["vary","變動"],"，每一次",["adjustment","調整"],"，都繞著那道沉默的身影。某次他發燒，霍廷琛推掉",["keynote","主題演講"],"，親自盯著他吃完",["medication","藥物"],"。那份在乎如此",["obvious","明顯"],"，葉澄才發覺，自己嚴重",["underestimate","低估"],"了這個男人。"],["畫展前夕，前經紀人秦朗突然現身。他大肆",["circulate","傳閱"],"一本",["pamphlet","小冊子"],"，",["contend","主張"],"葉澄的新作抄襲他手上的舊畫，還在媒體上",["advertise","宣傳"],"自己才是版權人，甚至把葉澄的畫印成",["promotional","促銷的"],["merchandise","商品"],"販售。他出示的證據十分",["dubious","可疑"],"，卻成功",["induce","誘導"],"輿論，抄襲傳聞變得",["widespread","廣為流傳"],"，網路",["comment","評論"],"一面倒地質疑葉澄的",["ethical","道德的"],"底線。秦朗更揚言：\"我的獨家合約還有效，你跟霍家的約定根本",["void","無效"],"。\"霍氏董事會隨即下達",["directive","指令"],"，要求總裁切割。葉澄看著新聞，默默收拾行李——他不想再躲在霍廷琛的",["protection","保護"],"之下，更不想成為他的",["obstacle","障礙"],"。"],["開幕當天，秦朗帶著記者堵在門口。霍廷琛緩步走來，一個眼神便讓全場噤聲。\"我的人，輪不到你來動。\"他讓助理在大螢幕播放葉澄",["desktop","桌上型電腦"],"裡的原始檔案，每張草圖都附時間戳記，三年前就",["transmit","傳送"],"到雲端。\"至於那份獨家合約，\"他冷笑，\"你的公司上週已經",["dissolve","解散"],"，所有債權由我買下。\"律師",["simultaneously","同時"],"遞上訴狀，要求",["enforce","執行"],"賠償；",["regulatory","監管的"],"機關也宣布展開",["further","進一步的"],"調查，秦朗恐將面臨",["sanction","制裁"],"，私吞的款項也將從他的資產中",["deduct","扣除"],"。霍廷琛早已備齊",["classified","機密的"],"調查報告與",["compliance","合規"],"文件，悄悄",["safeguard","保障"],"葉澄的每一分權益。他只丟下一句話：\"再碰他一次，我讓你永遠消失在這個圈子。\""],["風波過後，畫展反而",["draw","吸引"],"了大批人潮，",["prospective","潛在的"],"買家排滿預約，評論家的",["recommendation","推薦"],"接連而來，美術館也爭取作品",["placement","陳列"],"，人人都在談這位新銳的",["merit","優點"],"與",["competence","能力"],"。一年期滿那晚，葉澄掀開完成的畫——畫裡是霍廷琛坐在畫室角落凝視的側臉。\"合約完成了，\"他輕聲說，\"我可以",["redeem","贖回"],"自由了。\"霍廷琛扣住他的手腕：\"誰准你走了？這個",["notion","念頭"],"，立刻刪掉。\"他拿出新合約，宣布舊約已經",["outdated","過時"],"，新約只有一條",["mandatory","強制的"],"條款：此後每一幅畫，都要在他身邊完成，另附",["incentive","獎勵"],"：每完成一幅，換他一個吻。\"我要的不是畫，\"他低頭吻上葉澄的額頭，\"是你在我身邊",["thrive","發光"],"。\""]],"nw":63},{"id":10,"title":"總裁與談判桌上的宿敵","paras":[["嚴墨是業界最",["aggressive","強勢的"],["entrepreneur","企業家"],"，可當對面那人走進會議室，他的眼神仍冷了三度。唐既白——大學辯論賽上讓他輸得最慘的死對頭，",["career","職涯"],"一路順遂，如今是恆遠",["group","集團"],"的首席談判代表。這場併購關乎嚴氏的海外",["expansion","擴張"],"，也是業界矚目的",["alliance","聯盟"],"。\"好久不見，嚴總。我方的",["purpose","目的"],"很簡單：價格再加三成。\"\"不",["realistic","實際"],"。\"嚴墨把資料推回去，\"恆遠",["overhead","營運開銷"],"居高不下，在",["downturn","衰退"],"裡撐不了多久。\"唐既白不疾不徐：\"但恆遠握有市場上最",["lucrative","賺錢的"],["trademark","商標"],"，少了它，你的",["mission","使命"],"只是口號。\""],["談判持續整整兩週，雙方",["rotate","輪流"],"提案，又一一駁回。唐既白做事",["rigorous","嚴謹"],"，每份文件都經得起",["scrutiny","審查"],"，每個提問都",["pertinent","切中要點"],"；嚴墨則以",["swift","迅捷的"],["maneuver","手段"],"步步進逼。對嚴墨而言，被人當面頂撞是種久違的",["novelty","新奇"],"。\"你還是一樣",["rigid","死板"],"。\"唐既白冷聲道。\"恰恰相反，我只對你寸步不讓。\"兩人",["inherent","固有的"],"好勝心讓每場會談都像戰場，可休息時在茶水間",["interact","互動"],"，唐既白發現嚴墨仍記得他的咖啡不加糖。回頭再看，那些針鋒相對的夜晚忽然變了味道，他",["persist","堅持"],"冷著臉，卻漸漸",["distinguish","分辨"],"不出那是敵意，還是在意。"],["最後一晚，恆遠的",["proprietor","業主"],"黎董突然闖進會議室，要求加收天價",["surcharge","附加費"],"，還把一批",["questionable","可疑的"],"債務打包成",["package","套案"],"塞進合約，",["thereby","藉此"],"把風險轉嫁給嚴氏。唐既白當場變臉——這不是他談好的條件。嚴墨冷冷起身：\"這筆債一旦",["default","違約"],"，嚴氏就成了",["liable","須負責的"],"一方。這份合約，我不簽。\"黎董的貪婪",["trigger","觸發"],"了全面",["dispute","爭議"],"，",["ongoing","進行中的"],"談判宣告破裂，這是唐既白入行以來最大的",["setback","挫折"],"。深夜，兩人前後走進同一部電梯，電梯卻在二十八樓猛然停住，燈光全滅——大樓",["periodic","定期"],["preventive","預防性"],"保養，偏偏延誤了。"],["狹小的電梯把兩人",["confine","困住"],"在黑暗裡。唐既白靠著牆低聲說：\"黎董想",["extract","抽取"],"嚴氏的資金填補虧空，我會",["ensure","確保"],"你不被拖下水。\"嚴墨卻輕笑：\"他的海外",["remittance","匯款"],"紀錄，我三天前就拿到了。\"\"那你為什麼陪我耗兩週？\"\"因為對面坐的是你。大學那場決賽，我是故意輸的。\"唐既白心跳失序。隔天清晨，黎董在董事會上反咬唐既白洩密，要當場開除他。嚴墨推門而入，把證據甩在桌上：黎董勾結空殼",["merchant","商人"],"偽造進出口",["manifest","貨物清單"],"，每一筆都有",["related","相關的"],"憑證，他簽過的文件毫無",["validity","效力"],"。\"你的指控，",["irrelevant","無關緊要"],"。\"嚴墨擋在唐既白身前，\"我的人，輪不到你來動。\""],["黎董被移送法辦，恆遠宣布",["restructure","重組"],"，董事會一致推舉唐既白為",["successor","繼任者"],"，這份",["recognition","認可"],"遲來卻實至名歸。嚴墨下令",["expedite","加快"],"交割，兩家公司攜手",["facilitate","促進"],"彼此",["transition","轉型"],"，並",["adopt","採用"],"同一套管理",["practice","實務"],"。簽約那天，嚴墨把一把鑰匙推過去：\"作為",["precaution","預防措施"],"，你得搬進我的",["residence","住所"],"，我才放心。你那麼",["frugal","節儉"],"，房租就免了。\"\"這算哪門子條款？\"\"霸王條款。連",["decor","裝潢"],"都照你的喜好改好了。往後每一場談判，我都",["accompany","陪同"],"你。\"唐既白失笑，握住他的手：\"你一點都不",["sensible","理智"],"。\"\"對你，我不需要理智。\""]],"nw":61},{"id":11,"title":"總裁與米其林主廚","nw":62,"locked":1},{"id":12,"title":"總裁的家教財務長","nw":61,"locked":1},{"id":13,"title":"總裁的主治醫生","nw":59,"locked":1},{"id":14,"title":"總裁的臥底特助","nw":64,"locked":1},{"id":15,"title":"總裁的雪山承諾","nw":62,"locked":1},{"id":16,"title":"總裁的假戀愛危機","nw":60,"locked":1},{"id":17,"title":"總裁的倉庫小少爺","nw":66,"locked":1},{"id":18,"title":"總裁與毒舌攝影師","nw":63,"locked":1},{"id":19,"title":"總裁的翻案律師","nw":59,"locked":1},{"id":20,"title":"總裁的大螢幕求婚","nw ,["faded","褪色的"],"舊合照。言書白頭也不抬，態度",["indifferent","冷淡"],"：\"成績不會改，你想",["withdraw","退選"],"也行。\"裴鈞澤俯身撐在桌前，聲音低沉：\"我從不",["yield","讓步"],"。這門課我修定了；你，我也看上了。\"言書白指尖微微",["tremble","顫抖"],"，仍語氣平淡地回應：\"請保持",["appropriate","適當的"],"距離。\"他轉身要走，手腕卻被扣住。\"誰准你走了？\"那一刻，兩人之間",["intense","強烈的"],"火花幾乎就要",["erupt","爆發"],"。之後幾週，裴鈞澤每晚留下重寫報告，才",["discover","發現"],"這位教授的",["diligence","勤奮"],"：他替清寒學生",["organize","籌辦"],"獎學金募款，熬夜批改，從不喊累。裴鈞澤第一次真心",["admire","欽佩"],"一個人。"],["然而他的",["rival","對手"],"鄒子豪也在同一班。此人",["arrogant","傲慢"],"又記仇，公司早已瀕臨",["bankruptcy","破產"],"，正",["desperate","不顧一切地"],"想搶下一筆",["enormous","鉅額的"],"投資。他",["deliberately","蓄意地"],"偽造郵件，指控言書白收受裴家賄賂、洩漏考題。消息在學院",["annual","年度"],["charity","慈善"],"晚宴上曝光，台下對言書白滿是",["contempt","輕蔑"],"與",["hostility","敵意"],"。院長不願",["interfere","插手"],"，只要求他",["comply","配合"],"調查、暫停授課，改任一份",["temporary","臨時的"],"行政職。言書白站在",["magnificent","富麗堂皇的"],"水晶燈下，臉色蒼白，卻挺直背脊守住最後的",["dignity","尊嚴"],"。鄒子豪假意客氣地舉杯：\"教授，識時務者為俊傑。\""],["就在眾人以為大局已定，宴會廳大門被推開。裴鈞澤走上台，從容地拿起麥克風，大螢幕播出鄒子豪與駭客的對話紀錄，字字清楚。全場一片死寂。為了",["eliminate","消除"],"所有質疑，他",["emphasize","強調"],"：\"言教授當掉我，是因為他有原則，不是因為收了錢。誰再敢污衊他的",["reputation","名聲"],"，就是與我為敵。\"鄒子豪還想狡辯，裴鈞澤冷冷",["inquire","問道"],"：\"你公司的假帳，要不要我也公開？\"他當場宣布捐出一筆",["substantial","可觀的"],"善款，為學院",["raise","籌集"],"獎學金，要",["rescue","拯救"],"每一個像言書白當年一樣的窮學生。走過",["opponent","對手"],"身邊時，他壓低聲音：\"我的人，輪不到你來動。\"保全上前帶走鄒子豪，所有人都",["witness","見證"],"了這場",["spectacular","精彩的"],"打臉。"],["風波平息，言書白",["regain","重回"],"講台，名譽也被",["restore","恢復"],"。夜裡，他在空教室等裴鈞澤交第三版報告。這一次，報告寫得精簡而深刻，處處是",["extraordinary","非凡的"],["intelligence","才智"],"。翻到最後一頁，卻多了一行字：\"我想和你訂一份",["pact","契約"],"，期限是一輩子。\"言書白心裡湧起",["complex","複雜的"],["emotion","情感"],"，終於",["realize","意識到"],"自己早已動心，眼底冷意化成",["radiant","燦爛的"],"笑意：\"這是我讀過最不",["romantic","浪漫"],"的告白。\"裴鈞澤將他困在黑板與自己之間，語氣霸道卻",["heartfelt","真摯"],"：\"這份合約，我說了算。你只需要",["nod","點頭"],"。\"言書白輕笑，主動吻上他：\"那就……及格。\""]],"nw":63},{"id":2,"title":"總裁與博物館策展人","paras":[["封北辰是全城最",["notorious","惡名昭彰的"],["tycoon","大亨"],"，出手",["generous","大方"],"，坐擁無數",["luxurious","奢華的"],"收藏，從沒有買不到的東西。直到他走進市立博物館，盯上鎮館之寶——一只",["exquisite","精美的"],"宋代青瓷盞。年輕策展人杭知遠穿著",["modest","樸素的"],"灰毛衣，擋在展櫃前，態度",["severe","嚴厲"],"：\"這件瓷器不賣。\"封北辰把",["contract","合約"],"推過去，金額足以讓整座館翻修三次。杭知遠連看都沒看：\"它的",["significance","意義"],"，不是錢能",["define","定義"],"的。\"封北辰第一次被拒絕，卻沒有動怒，反而",["scrutinize","審視"],"起眼前這個看似",["ordinary","平凡的"],"男人：\"我要的東西，從來沒有拿不到的。\""],["此後，他天天出現在展廳",["corridor","走廊"],"。杭知遠用一貫的",["eloquence","口才"],"解說釉色、窯火與時代，聲音沉穩而",["tranquil","平靜"],"。封北辰起初只是",["pretend","假裝"],"有興趣，後來卻真的聽進去了，目光總在對方身上",["linger","停留"],"。這個",["perceptive","敏銳的"],"男人漸漸",["comprehend","理解"],"：這只盞是杭家祖父捐出的，捐贈時立下",["covenant","盟約"],"，要它永遠屬於大眾。杭知遠守的不只是文物，還有",["principle","原則"],"與",["obligation","責任"],"。某夜閉館後，杭知遠在燈下修補一片",["fragile","易碎的"],"殘瓷，指尖被割傷。封北辰一把抓住他的手，眼神",["tender","溫柔"],"，語氣卻霸道：\"以後這種事叫我。我的人，不准受傷。\"杭知遠身體一僵，心跳卻亂了。"],["然而一場",["conspiracy","陰謀"],"正悄悄展開。副館長聶昌勾結走私集團，用一件",["identical","一模一樣的"],"贗品",["substitute","調換"],"真品，再把假消息",["leak","洩露"],"給媒體：杭知遠私下與封北辰完成",["transaction","交易"],"，把國寶賣給了大亨。新聞一夕延燒，各種",["speculation","臆測"],"滿天飛，封氏股價",["plunge","暴跌"],"。展覽開幕當天，專家當眾宣布展櫃裡是假貨，記者用",["suspicious","懷疑的"],"眼光圍住杭知遠逼問。他強忍",["anxiety","焦慮"],"，努力",["compose","鎮定"],"自己，卻在最",["vulnerable","脆弱的"],"時刻聽見聶昌冷笑：\"杭策展人，你還要",["pretend","假裝"],"多久？\""],["就在此時，封北辰大步穿過人群，冷冽的目光足以",["intimidate","震懾"],"全場。他毫不",["hesitate","猶豫"],"，讓助理投出影像：\"三個月前，我",["instruct","指示"],"團隊用",["laser","雷射"],"掃描過真品，每一道冰裂紋都有紀錄。\"比對結果一目了然——展櫃裡的是聶昌找人",["imitate","仿造"],"的贗品。監視畫面更拍下聶昌",["disguise","喬裝"],"成清潔工，在",["corridor","走廊"],"調包。原來封北辰早已",["anticipate","預料"],"有人會動手，做了",["strategic","戰略性的"],"布局，手下已",["pursue","追查"],"到走私倉庫，真品完好",["recover","尋回"],"，經鑑定確實",["authentic","貨真價實"],"。他走到聶昌面前，聲音低得讓人發冷：\"動他之前，你該先想清楚",["consequence","後果"],"。我的人，輪不到你來誣陷。\"警察帶走聶昌，這場",["elaborate","精心設計的"],"騙局當眾崩塌。"],["風暴平息，真品重回展櫃，晨光",["illuminate","照亮"],"青瓷，美得",["splendid","燦爛"],"如夢。杭知遠在空無一人的展廳找到封北辰：\"你明明可以買下整座館，為什麼要幫我？\"封北辰把一張",["crumpled","皺巴巴的"],"紙遞給他——正是第一天被拒絕的合約，背面寫著一行字。\"我的",["judgment","判斷"],"從不",["err","出錯"],"，只錯過一次：我以為自己想要的是那只盞。\"杭知遠眼眶",["moist","溼潤"],"，再也",["stifle","壓抑"],"不住心意，鼓起",["courage","勇氣"],"，帶著擂鼓般的心跳",["confess","坦白"],"：\"我也是……從你第一次站在這裡",["gaze","凝視"],"我開始。\"封北辰心跳",["accelerate","加速"],"，一把將他",["embrace","擁抱"],"在懷裡，這份",["mutual","彼此的"],"心意終於說破。他語氣",["passionate","熱烈"],"而霸道：\"從今天起，你是我唯一不買、也不准任何人碰的珍寶。這份",["genuine","真誠的"],"承諾，我會",["honor","信守"],"一輩子，永不",["abandon","拋下"],"你。\""]],"nw":65},{"id":3,"title":"總裁與天文學家","paras":[["山頂天文台的經費被砍，處境",["precarious","岌岌可危"],"，隨時可能關門。身為",["junior","資淺的"],"研究員的蘇星野，抱著一疊星圖",["sketch","草圖"],"，闖進城中最",["prestigious","有名望的"],"投資集團。總裁晏淮之坐在落地窗前，",["figure","身形"],"挺拔得像被",["sculpt","雕刻"],"出來的，周身是",["overwhelming","壓倒性的"],["presence","氣場"],"。他用",["stern","嚴厲的"],"語氣說出",["routine","例行的"],"拒絕：\"天文台不賺錢，結局完全",["predictable","可以預料"],"。\"蘇星野沒有",["retreat","退縮"],"，只把一張手繪星圖推到他面前：\"那你看看，你錯過了什麼。\"晏淮之盯著那張圖，冰冷的",["facade","表象"],"出現一道裂痕。他向來對",["classical","古典"],"星圖有種",["peculiar","奇特的"],"偏執，卻從沒對人說過。\"給你三分鐘。\""],["三分鐘變成了三個月，誰也沒能",["foresee","預見"],"。晏淮之養成了一個新",["habit","習慣"],"：每週五深夜開車上山。刺骨的寒風裡，蘇星野替他調好望遠鏡，在星光下露出難得的笑容，聲音帶著淡淡的",["melancholy","憂鬱"],"：\"這台設備是我恩師留下的，他年輕時偶然發現一本",["legendary","傳奇的"],"古星圖，能證明台灣最早的觀星紀錄。\"晏淮之看著他凍紅的指尖，眼底浮起連自己都沒察覺的",["compassion","憐惜"],"。他以一貫的紳士",["manner","風度"],"脫下大衣披在對方肩上，動作",["affectionate","親暱"],"，語氣卻不容拒絕：\"從今天起，你的天空歸我管。\"蘇星野無法",["fathom","看透"],"這個男人深不見底的眼神，只知道自己正",["gradually","逐漸"],["fall","陷落"],"其中，無法",["resist","抗拒"],"。"],["然而一場",["scheme","陰謀"],"悄悄",["surface","浮出水面"],"。副台長魏崇出於",["greed","貪婪"],"，勾結晏氏的",["competitor","競爭對手"],"戚家，將天文台",["confidential","機密的"],"衛星資料私下",["transfer","轉移"],"，再",["forge","偽造"],"郵件，栽贓是蘇星野洩密。更",["disturbing","令人不安"],"的是，戚家宣布將那本古星圖送上",["auction","拍賣"],"。消息一出，所有人都說蘇星野",["betray","背叛"],"了投資人。晏淮之神情冰冷，一句解釋也沒給。蘇星野以為連他也不信自己，心中滿是",["sorrow","悲傷"],"與",["torment","煎熬"],"，連夜收拾行李",["flee","逃離"],"山頂。"],["拍賣會當天，戚家少爺得意地展示星圖，宣稱是",["veritable","名副其實的"],"孤本，起價高得令人",["shock","震驚"],"。晏淮之起身，語氣",["decisive","果斷"],"：\"看似",["flawless","完美無瑕"],"，卻是",["counterfeit","贗品"],"。紙上的",["pigment","顏料"],"是去年才上市的化學合成色。\"他早已讓專家查驗，並調出魏崇收受轉帳、足以送上法庭的證據，原來他的冷淡，只是為了",["conceal","隱瞞"],"調查、引蛇出洞。魏崇在全場注視下臉色慘白，晏淮之的",["fury","怒火"],"冷得刺骨：\"想",["deceive","欺騙"],"我，先問問你的",["conscience","良心"],"還有沒有",["moral","道德的"],"底線。\"真本被他從戚家倉庫",["reclaim","奪回"],"。走出會場，他在車站攔住蘇星野，一把扣住他的手腕，聲音",["hoarse","沙啞"],"：\"誰准你逃了？我的人，我從沒懷疑過。\""],["那夜回到天文台，蘇星野用力",["swallow","嚥下"],"哽咽。頭頂的星空像一場",["fateful","命中注定的"],"約定。他低聲",["probe","追問"],"：\"你為什麼什麼都不",["divulge","透露"],"，讓我那麼痛？\"晏淮之沉默片刻，終於坦白開口：\"因為我寧可被你誤會、",["sacrifice","犧牲"],"自己在你心裡的位置，也不願你捲入危險。對不起。\"他的",["sincerity","真誠"],"像",["profound","深邃的"],"星河，一下子",["pierce","穿透"],"蘇星野所有防備。晏淮之以",["gentle","溫柔的"],"手勢托起他的臉，眼底的",["warmth","暖意"],["pour","傾瀉"],"而下：\"我花了一筆",["fortune","鉅款"],"買下這座山，只為了讓你一輩子看星星。\"蘇星野輕輕",["sigh","嘆息"],"，終於",["surrender","投降"],"，吻上那雙曾經",["fierce","凌厲的"],"眼睛。銀河在他們頭頂靜靜流淌，像是最",["fitting","恰當的"],"見證。"]],"nw":68},{"id":4,"title":"總裁與海洋生物學家","paras":[["海洋生物學家葉澄海帶著一份抗議書，闖進嚴氏集團頂樓。嚴驍的度假村開發案，將毀掉南灣最後一片",["scarce","稀有的"],"珊瑚礁。秘書說總裁不見客，他",["insist","堅持"],"站在門口等了六小時。嚴驍終於開門，",["narrow","眯起"],"雙眼打量他：\"多少人帶著",["flattery","奉承"],"來找我，你是第一個帶著罵聲來的。\"葉澄海毫不退讓，冷靜",["explain","解釋"],"珊瑚白化的數據，每一項結論都令人無法反駁。他的",["competence","能力"],"與",["integrity","正直"],["astonish","震撼"],"了嚴驍，這男人向來只",["value","看重"],"兩種東西：實力與挑戰。他丟出一份",["proposal","提議"],"：\"當我的",["exclusive","專屬"],"顧問，三個月內說服我，我就停工。這是你的",["challenge","挑戰"],"。\""],["於是，從不",["frequent","常去"],"海邊的嚴驍，開始陪他",["immerse","沉浸"],"在深藍海裡。葉澄海",["concentrate","專注"],"記錄數據時，嚴驍的目光從未離開他。珊瑚像大海親手完成的",["masterpiece","傑作"],"，光線在魚群間",["stream","流淌"],"。上岸後，葉澄海裹著毛巾說起童年的",["anecdote","往事"],"：父親是漁夫，在一場風暴中失蹤，從此他習慣了",["solitary","孤單的"],"日子，只對海說話。嚴驍聽著，心裡某種",["nuanced","微妙的"],"情緒悄悄",["evolve","轉變"],"。他",["secretly","暗中"],"向畫家",["commission","委託"],"一幅葉澄海在礁岩邊的",["portrait","肖像"],"，掛進自己私人的",["gallery","畫廊"],"。有",["colleague","同事"],"開玩笑說葉澄海被總裁收買，嚴驍冷聲道：\"我的人，輪不到你們議論。\""],["然而",["inevitable","無可避免的"],"風暴來了。慈善",["gala","晚宴"],"上，嚴驍的",["ex-fiancee","前未婚妻"],"柯蔓妮一身",["glamorous","光鮮亮麗的"],"禮服",["appear","現身"],"，一把",["cling","緊挽"],"在他臂彎，對著鏡頭",["announce","宣布"],"兩人即將",["reunite","復合"],"，度假村也將如期動工。更",["dangerous","危險"],"的是，她早已安排媒體",["broadcast","播出"],"一段剪接影片，誣陷葉澄海收了開發商的賄賂。學界輿論炸開了鍋，葉澄海臉色",["pale","蒼白"],"，在龐大的",["pressure","壓力"],"下渾身",["numb","麻木"],"。他",["refuse","拒絕"],"聽任何解釋，當夜便",["vanish","消失"],"了。"],["嚴驍動用所有船隻",["search","搜尋"],"一整夜，即使",["exhaust","耗盡"],"了體力也不肯停，終於在研究站的碼頭找到他。葉澄海眼底滿是",["pain","痛苦"],"：\"你們本來就是一對，我能",["understand","理解"],"。\"嚴驍一把將他拉進懷裡，看穿他此刻有多脆弱：\"誰准你替我做決定？你所有的",["concern","顧慮"],"，交給我。\"隔天記者會，他當眾播出柯蔓妮與開發商",["clandestine","秘密的"],"交易錄音——她想",["retaliate","報復"],"嚴驍退婚，故意拿葉澄海當",["target","靶子"],"。所謂深情，不過是她用來掩蓋貪婪的一層",["veil","面紗"],"。嚴驍隨即宣布度假村全面停建，改設",["legitimate","合法的"],"海洋保護區，投入的金額",["unprecedented","史無前例"],"。全場起立",["applaud","鼓掌"],"，柯蔓妮在鏡頭前狼狽離場。"],["事件的",["aftermath","餘波"],"出乎所有人",["expectation","預料"],"：南灣成了國際研究基地，葉澄海也風光重返學界。夕陽下，嚴驍帶他走進私人畫廊，空氣裡飄著",["fragrant","芬芳的"],"白花香，牆上那幅肖像",["reflect","映著"],"暖金色的光。嚴驍向來",["remain","保持"],"冷硬，此刻卻終於",["relax","放鬆"],"下來。\"我見過",["countless","無數"],["sophisticated","精緻的"],"珍寶，曾經以為自己最",["precious","珍貴的"],"收藏是",["diamond","鑽石"],"。\"他低聲說，\"後來才",["discern","看清"],"，我只是用冷漠掩飾",["cowardice","懦弱"],"，不敢",["acknowledge","承認"],"我愛你。\"葉澄海眼眶發熱，不再",["plead","懇求"],"任何承諾，只是踮腳吻他。嚴驍扣住他的腰，語氣霸道又溫柔：\"這片海是你的，你是我的。這句話，我說了算。\""]],"nw":67},{"id":5,"title":"總裁與考古學者","paras":[["在這座",["metropolitan","大都會"],"的核心地段，秦氏建案的工地挖出一座漢代古墓，推土機被一個人硬生生攔下。方以謙是",["senior","資深的"],"考古學者，態度",["professional","專業"],"，手裡拿著文化局的停工令。一輛",["sleek","流線型的"],"黑色跑車停在泥地上，下車的是",["pharmaceutical","製藥"],"集團",["heir","繼承人"],"、地產新貴秦烈川。他",["lean","倚"],"在車門邊，語氣",["condescending","居高臨下"],"：\"一個",["novice","新手"],"都看得出這只是破陶罐，停工一天，我損失幾千萬。\"方以謙冷冷",["retort","反駁"],"：\"那你就連",["basic","基本的"],"常識都不如新手。\"秦烈川",["stare","盯著"],"他許久，薄唇緩緩",["curve","勾起"],"：\"有意思。從今天起，這塊地，連同你，都歸我管。\""],["此後，秦烈川天天往工地跑，名義上是來",["inspect","視察"],"進度，實際上總是",["coincidentally","碰巧"],"出現在方以謙身邊。他",["sponsor","贊助"],"全部發掘經費，還",["casually","隨手"],"帶來",["nutritious","營養的"],"便當，連方以謙對花生",["allergic","過敏"],"這種小事都",["memorize","記住"],"了。方以謙的",["defense","防線"],"一點點",["crack","裂開"],"。某夜收工，秦烈川忽然",["mention","提起"],"自己的過去：父親早早",["remarry","再婚"],"，他是在被",["neglect","忽視"],"中長大的",["lonely","孤獨的"],["adolescent","少年"],"。\"所以我學會拿傲慢當",["shield","盾牌"],"。\"方以謙看著他，第一次讀懂了那份",["hubris","狂妄"],"底下的寂寞。"],["然而秦烈川同父異母的弟弟秦昊，一直想奪權。他散播謠言，說古墓裡的黴菌會引發",["epidemic","疫情"],"，附近居民人心惶惶，一致",["exclude","排斥"],"考古隊，衝突",["incident","事件"],"不斷",["escalate","升級"],"。方以謙不肯讓步，",["persist","堅持"],"帶隊下墓。偏偏此時，他在墓室裡受到",["infection","感染"],"，起初只是發燒等輕微",["symptom","症狀"],"，手臂的",["swelling","腫脹"],"卻迅速",["deteriorate","惡化"],"，送醫時已陷入",["critical","危急的"],"狀態，醫生連夜",["conduct","進行"],"搶救，用強效藥物",["treat","治療"],"。秦昊趁機在董事會上宣布：秦烈川為一個外人延誤工程，必須立刻卸任，古墓即刻剷平。"],["消息傳到醫院，秦烈川",["clench","攥緊"],"拳頭，守在病床邊整整兩夜，用盡全力",["restrain","克制"],"想立刻找秦昊算帳的衝動。第三天，他忽然出現在秦昊的記者會上，冷冽的",["composure","沉著"],"讓全場噤聲，那張",["enigmatic","高深莫測的"],"臉上看不出喜怒。他直接",["confront","質問"],"秦昊：\"你要的不過是",["material","物質的"],"權力，卻拿人命當籌碼？\"隨後他當眾攤開證據，公開醫院的",["clinical","臨床"],"報告：黴菌不具傳染性，",["mortality","死亡率"],"為零，所謂疫情根本是造謠；接著又播出秦昊收買居民、雇人散布恐慌的錄音。他直視秦昊，聲音不高卻像",["roar","怒吼"],"：\"拿我的人當棋子，你也配？\"董事們紛紛倒戈，秦昊的支持一路崩盤，當場被解除職務。"],["方以謙出院那天，陽光正好，彷彿一切都回到",["daylight","光天化日"],"之下。他滿臉",["reluctant","不情願"],"，被秦烈川押上車，卻發現目的地是工地——原址已改建為",["permanent","永久的"],"遺址博物館，牌匾上寫著由秦氏",["donate","捐贈"],"。\"你不是要蓋大樓嗎？\"秦烈川",["clasp","緊握"],"他的手：\"我找到更值得",["invest","投資"],"、更有",["potential","潛力"],"的",["asset","資產"],"。你對古蹟的",["pursuit","追求"],"，讓我心生",["admiration","欽佩"],"；你對我的",["patience","耐心"],"，讓我第一次有了",["bona fide","真正的"],"家。\"方以謙眼裡",["sparkle","閃爍"],"著光，笑他",["brave","勇敢"],"得近乎任性。秦烈川低頭吻他，霸道地宣告：\"我們有",["common","共同的"],"未來。你的",["duty","職責"],"是守護古蹟，我的職責是守護你。這件事，我說了算。\""]],"nw":66},{"id":6,"title":"總裁與建築系學長","paras":[["宋亦琛的",["enterprise","企業"],"要蓋一座新總部，他親自挑中的建築師，竟是大學時的學長白景行。十年前，宋亦琛是系上最",["obnoxious","討人厭的"],"學弟，",["rude","無禮"],"又自負；白景行卻總是",["humble","謙遜"],"而",["earnest","認真"],"，熬夜陪他改模型。如今宋亦琛",["manage","管理"],"整個",["corporation","集團"],"，站在會議室落地窗前，",["silhouette","身影"],"冷硬。而白景行仍窩在",["cramped","狹小的"],"事務所裡天天",["overtime","加班"],"。宋亦琛把一份",["formal","正式的"],["proposition","提案"],"丟到桌上：\"設計費三倍。條件只有一個，期限內，你只為我工作。\"白景行看著那條",["preposterous","荒謬的"],["clause","條款"],"，本想",["decline","婉拒"],"，卻想起醫院裡等待",["surgery","手術"],"的母親。他愕然抬頭，對上宋亦琛一雙",["firm","堅定的"],"眼睛：\"學長，這次換我照顧你。\""],["白景行 ,"伸出"],"手，掌心躺著一枚戒指，\"我想和你許下一份",["bond","羈絆"],"，期限是",["everlasting","永遠"],"。\"許硯的眼眶",["red","泛紅"],"，卻笑得",["bright","燦爛"],"。唐懷瑾心裡又酸又",["painful","發疼"],"，那層冰冷終於",["melt","融化"],"，像春雪",["thaw","消融"],"，所有",["tension","緊繃"],"都被",["release","釋放"],"。唐懷瑾俯身吻他，眼底只剩",["fervent","熾烈的"],"溫柔：\"這份約定，我說了算。你只負責說好。\""]],"nw":70},{"id":8,"title":"總裁與深夜獸醫","paras":[["凌晨兩點，暴雨砸在招牌上。剛談妥要",["acquire","收購"],"一家公司的嚴司珩，抱著愛犬雷霆",["burst","衝"],"進喬嘉樹的獸醫院。\"救牠，多少錢都行。\"他的嗓音",["low","低沉"],"而",["icy","冰冷"],"，手卻在雷霆嗚咽時微微",["quiver","顫抖"],"。值班的喬嘉樹頭髮亂翹，睡眼惺忪地瞥了他一眼，語氣",["mild","溫和"],"，話卻說得",["blunt","直白"],"：\"先生，在我這裡，錢不是重點，安靜才是。\"他戴上手套檢查，眉頭一皺：雷霆不是生病，是誤食了",["lethal","致命的"],"毒餌。有人",["calculate","算準"],"了時機，要讓這位商業",["dynasty","王朝"],"的繼承人在併購關鍵期亂了陣腳。嚴司珩眸色一沉：\"誰敢",["touch","碰"],"我的狗，我就讓他好好",["experience","體驗"],"什麼叫",["destruction","毀滅"],"。\""],["搶救持續到天亮。喬嘉樹替雷霆縫合嘴邊的",["wound","傷口"],"，手法穩得驚人。嚴司珩在一旁",["fret","焦躁"],"得來回踱步，被他一句\"再晃我就請你出去\"堵得說不出話。等雷霆終於脫離危險，喬嘉樹累得靠在牆邊，嚴司珩竟俯身過去，用",["magnetic","富磁性的"],"嗓音在他耳邊",["whisper","低語"],"：\"你剛才凶我的樣子，很好看。\"喬嘉樹耳根一熱，抬眼",["tease","調侃"],"：\"嚴總平常談",["business","生意"],"也這樣撩人？\"空氣裡忽然多了幾分說不清的曖昧。隔天，嚴司珩送來一份",["overture","提議"],"：重金",["recruit","招募"],"喬嘉樹擔任集團寵物醫療品牌的",["core","核心"],"顧問。喬嘉樹看都沒看就",["rebuff","回絕"],"：\"我不賣。\"嚴司珩笑了，眼裡是少見的",["satisfaction","滿意"],"：\"很好，不賣的人，我才想要。\""],["然而，對手邵啟峰早有部署。他先",["disrupt","擾亂"],"嚴氏的",["upstream","上游"],"原料，收買關鍵",["supplier","供應商"],"斷貨，再發動一場",["media","媒體"],"抹黑",["campaign","攻勢"],"，聲稱要",["expose","揭發"],"嚴氏產品的",["quality","品質"],"問題。短短一週，集團",["talent","人才"],"大量",["drain","流失"],"，人人都在",["question","質疑"],"：嚴氏王朝是否即將",["crumble","崩塌"],"？最",["deadly","致命的"],"一招落在喬嘉樹身上：邵啟峰",["coerce","脅迫"],"診所助理作偽證，說毒餌是喬嘉樹放的，只為接近嚴司珩。嚴司珩卻遲遲沒有出現。當晚，喬嘉樹被一通\"雷霆病危\"的電話騙出門，再醒來時，已被",["detain","關押"],"在郊外廢棄的",["warehouse","倉庫"],"。邵啟峰笑得",["frenzied","癲狂"],"：\"你猜，他會為了一個獸醫放棄併購嗎？\""],["嚴司珩早就",["envision","預想"],"到這一步。他一通電話",["mobilize","調動"],"手上所有",["resource","資源"],"，三十分鐘內",["locate","找到"],"了倉庫。生鏽的門鎖被一腳踹到",["snap","斷裂"],"，喬嘉樹的手腕被繩子勒得",["bleed","流血"],"，眼神卻依舊",["defiant","倔強"],"，直直瞪著邵啟峰。嚴司珩將人",["enfold","擁入懷中"],"，一句話讓整個倉庫的空氣都",["freeze","凝結"],"：\"我的人，輪不到你來動。\"邵啟峰臉上閃過一絲",["alarm","驚慌"],"，還想拿助理的證詞要挾，嚴司珩卻當著尾隨而來的記者播放錄音——正是助理被脅迫的完整對話。原來他消失兩天，是去",["unearth","挖出"],"真相。\"這件事，我來",["handle","處理"],"。我",["determine","決定"],"要護的人，誰也動不了。\"喬嘉樹眼中的恐懼慢慢",["recede","退去"],"，埋在他胸口，終於忍不住",["weep","落淚"],"。風波平息時，檢方已決定",["prosecute","起訴"],"邵啟峰。"],["三個月後，邵啟峰被",["sentence","判處"],"十年，嚴氏也",["retrieve","取回"],"了被他竊取的",["patent","專利"],"，新的",["brand","品牌"],"一上市就大賣。雷霆的傷完全",["heal","痊癒"],"，每天在診所裡撒野。黃昏時，嚴司珩把一份文件推到喬嘉樹面前：\"你",["review","審閱"],"一下。\"喬嘉樹低頭一看，竟是\"終身家屬\"登記表。\"嚴總這是在跟我",["negotiate","談判"],"？\"在商場上出了名",["ruthless","冷酷無情"],"的男人，此刻目光卻",["devoted","深情"],"：\"不談。這份合約，我說了算。\"喬嘉樹露出",["cunning","狡黠的"],"笑容：\"那我要加一條：讓我也能",["safeguard","守護"],"你。\"窗外城市的",["skyline","天際線"],"亮起，嚴司珩低頭吻住他，喬嘉樹的心跳",["skip","漏跳"],"了一拍。這是一場",["unexpected","意外的"],"相遇，也是他們給彼此的",["final","最終"],"答案。"]],"nw":71},{"id":9,"title":"總裁與颱風夜主播","paras":[["為了付清",["university","大學"],"的學貸，新人氣象主播夏知遙下班後還在電視台兼差打掃。深夜，他跪在地上",["scrub","刷洗"],"地板、把玻璃",["polish","擦"],"得",["spotless","一塵不染"],"，日子",["monotonous","單調"],"又",["exhausting","累人"],"，唯一的",["motivation","動力"],"是有一天能站上主播台。那晚，他端著咖啡轉進",["hallway","走廊"],"，一場",["accident","意外"],"發生了——他和一個男人",["collide","撞上"],"，咖啡",["splash","潑"],"在對方",["bespoke","訂製的"],"西裝上，留下一大片",["stain","汙漬"],"。男人眼神",["frigid","冰冷"],"，身後的助理嚇得說不出話。夏知遙沒有",["grovel","卑躬屈膝"],"，只抬頭說：\"我會",["compensate","賠償"],"，分期可以嗎？\"男人",["arch","挑起"],"一邊眉毛，第一次對一個",["lowly","卑微的"],"清潔工起了興趣。"],["他是韓璟深，國內最大",["gemstone","寶石"],"珠寶集團的",["chairman","董事長"],"，名字幾乎與",["power","權力"],["synonymous","劃上等號"],"。韓家有個古老",["tradition","傳統"],"：繼任的",["successor","接班人"],"必須在三十歲生日的",["deadline","期限"],"前",["marry","結婚"],"，否則將",["forfeit","喪失"],"全部",["inheritance","繼承權"],"。他身邊總是",["surround","環繞"],"著無數",["socialite","名媛"],"，個個",["calculating","精於算計"],"，只對他的",["wealth","財富"],["interested","感興趣"],"，他打從心底厭倦這些",["artificial","虛假的"],"笑臉。隔天，他把一份合約丟到夏知遙面前：\"賠西裝太慢。當我三個月的伴侶，債一筆勾銷。\"夏知遙皺眉：\"這算我幫你一個",["favor","忙"],"？\"韓璟深淡淡道：\"算你欠我的。誰准你說不？\""],["接著，他請",["stylist","造型師"],"替夏知遙",["reshape","重塑"],"形象，親自",["select","挑選"],"一枚",["delicate","精巧的"],"袖扣，還請老師教他上流",["etiquette","禮儀"],"。週年晚宴上，換上",["chic","時髦的"],"西裝的夏知遙一身",["natural","自然的"],"乾淨氣質，說一口",["fluent","流利的"],"法語，談吐",["witty","風趣"],"，還主動替冷場的外賓解圍，",["captivate","迷倒"],"了整廳賓客。韓璟深的堂弟韓啟銘卻當眾冷笑：\"一個掃地的，也配站在這裡？\"說完故意把紅酒潑向他。夏知遙保持",["poise","從容"],"與",["decorum","體面"],"，韓璟深卻已一把將人拉到身後：\"我的人，輪不到你來動。\"韓啟銘目光陰沉，一場更大的陰謀正在醞釀。"],["一週後，強颱登陸。韓啟銘以公司",["schedule","排程"],"為由，力主讓港口",["staff","員工"],"連夜裝運珠寶原石，還把延誤的責任",["blame","歸咎"],"到董事會的保守派身上。韓璟深在辦公室翻著報告，本已準備簽字。電視裡，夏知遙站在風雨中直播，頭髮濕透，語氣卻無比誠懇：\"還在戶外工作的朋友，請回家吧。沒有任何一份工作，值得用生命交換。\"韓璟深的筆停住了。他當場取消裝運，命令所有人撤離。凌晨，港口吊架在狂風中倒塌。事後調查揭開真相：吊架早被韓啟銘的",["subordinate","下屬"],"動過手腳，他想製造事故，逼韓璟深下台。董事會上，一眾",["wealthy","富有的"],"股東面面相覷，韓啟銘臉色",["ashen","慘白"],"，陷入",["frenzy","狂亂"],"。韓璟深最",["despise","鄙視"],"拿人命換利益的人，只給了他",["cursory","敷衍的"],"一瞥：\"那一晚，是他救了所有人。你，滾出韓家。\""],["這場",["ordeal","磨難"],"成了改變一切的",["catalyst","催化劑"],"。韓璟深在記者會上宣布，韓氏的繼承規則由他改寫：不需要聯姻，只需要真心。散場後，他在",["urban","都市的"],"夜色裡等到下班的夏知遙。\"三個月合約的",["mission","任務"],"已經",["complete","完成"],"了。\"他低聲說，\"但我不打算放你走。\"夏知遙笑著踮起腳，給了他一個",["hug","擁抱"],"：\"韓總，你的",["kindness","善良"],"藏得太深了。\"韓璟深把親手設計的",["jewelry","珠寶"],"手鍊戴上他的手腕，那光芒",["dazzle","閃耀"],"如星：\"你值得，你",["deserve","配得上"],"最好的。\"夏知遙的臉",["glowing","容光煥發"],"，韓璟深那顆",["dormant","沉睡的"],"心終於被",["awaken","喚醒"],"。原來童話故事裡，也可以有兩個王子，一起",["happy","幸福"],"地走下去。"]],"nw":70},{"id":10,"title":"總裁與受傷的首席","paras":[["鍾氏集團總裁鍾硯白有一套冷硬的",["philosophy","哲學"],"：任何",["personal","私人的"],["attachment","依戀"],"都是",["weakness","弱點"],"，更是",["liability","負擔"],"。直到他在基金會的贊助名單裡，看見一份",["resume","履歷"],"。程以澈，以",["exceptional","卓越的"],"成績",["graduate","畢業"],"於皇家舞蹈學院，曾是舞團最年輕的首席，經歷",["impressive","亮眼"],"，卻在一次演出後膝蓋重傷，被舞團",["dismiss","解雇"],"。鍾硯白去排練室時，正好",["observe","看見"],"那個男人獨自跳著，每次落地，膝蓋都像被針",["stab","扎"],"了一下，他的肩膀微微",["shudder","發抖"],"，卻一次也沒停。鍾硯白開口：\"我贊助你復出。\"程以澈喘著氣：\"為什麼？\"他冷冷道：\"因為我不投資",["mediocre","平庸的"],"人。\""],["鍾硯白是出了名",["demanding","苛刻的"],"老闆。他親自",["optimize","優化"],"程以澈的復健計畫，把訓練量推到",["maximum","極限"],"。\"從今天起，你的時間，我說了算。\"程以澈很快",["adapt","適應"],"了他的",["rhythm","節奏"],"，甚至能",["predict","預判"],"他下一句挑剔。面對再",["difficult","困難"],"的動作，他都咬牙",["tackle","攻克"],"，連團隊的大小安排也打理得井井有條。他對鍾硯白",["politely","禮貌地"],"道謝，又",["firmly","堅定地"],"畫下",["boundary","界線"],"：\"我接受你的錢，但我不會",["depend","依賴"],"你的憐憫。\"鍾硯白沒說話，卻開始",["postpone","延後"],"董事會，只為了每晚到排練室",["visit","探望"],"他。那些",["unseen","無人看見的"],"溫柔，連他自己都沒發覺。"],["舞團新首席方景曜看著這一切，眼紅得發狂。他對程以澈",["jealous","妒火中燒"],"，恨他奪走所有",["attention","關注"],"，暗中派人",["investigate","調查"],"程以澈的",["background","背景"],"，隨即在記者會上",["proclaim","宣稱"],"：程以澈的父親只是劇院的",["janitor","清潔工"],"，而他能復出，靠的是\"討好金主\"。方景曜語氣",["contemptuous","輕蔑"],"，全場",["press","媒體"],"的鏡頭瞬間對準程以澈，讓他背上莫大的",["shame","恥辱"],"。董事會施壓，要鍾硯白",["revoke","撤銷"],"贊助、",["cancel","取消"],"一切",["arrangement","安排"],"，以免造成",["loss","損失"],"。程以澈在後台",["feign","假裝"],"平靜，對鍾硯白說：\"你撤吧，我不想當你的麻煩。\"說完，他轉身走進漆黑的走廊，沒讓任何人看見他發紅的眼眶。"],["鍾硯白的決定不曾",["waver","動搖"],"。復出公演當晚，他站在後台，一句話讓所有人陷入",["silence","沉默"],"：\"誰准你替我做決定？\"程以澈",["straighten","挺直"],"背脊走上台，聲音",["clear","清亮"],"而",["unwavering","堅定"],"：\"我父親用",["labor","勞力"],"把我養大，每一分錢都是他",["earn","掙來"],"的。我",["revere","敬重"],"他。任何",["occupation","職業"],"都有它的",["worth","價值"],"。\"台下先是一片寂靜，隨即掌聲雷動，有人甚至站起來喊他的名字。緊接著，鍾硯白公開監視畫面：當年在程以澈舞鞋裡動手腳、害他受傷的，正是方景曜。這個真正的",["villain","反派"],"臉色慘白，只能",["capitulate","認輸"],"。鍾硯白的",["countenance","神色"],"冷得像冰，手段",["merciless","毫不留情"],"：\"法務部，立刻",["execute","執行"],"。\"舞團當場將方景曜除名，所有中傷也就此",["cease","停止"],"。"],["謝幕後，鍾硯白在空蕩的舞台上等他。\"我以為感情是負擔，\"他低聲說，\"但你",["change","改變"],"了我。\"他單膝跪下，向程以澈",["propose","求婚"],"。戒指的",["design","設計"],"一點也不",["ostentatious","張揚"],"，樸實低調，中央卻嵌著一顆",["impeccable","完美無瑕的"],"、",["uncommon","罕見的"],"藍色",["gem","寶石"],"。\"從遇見你那天起，我們就被",["destine","註定"],"要在一起。\"程以澈紅了眼，笑得",["candid","坦率"],"：\"鍾總，這次你這麼",["courageous","勇敢"],"，我只好",["agree","答應"],"了。\"後來，兩人把贊助改成",["altruistic","無私的"],"公益計畫，資助更多受傷的舞者。最",["mundane","平凡的"],"日子裡，美好仍不斷",["happen","發生"],"，就像舞台上的燈光，一遍一遍亮起，從不落幕。"]],"nw":73},{"id":11,"title":"總裁與改不掉的結局","nw":71,"locked":1},{"id":12,"title":"總裁與雪山嚮導","nw":73,"locked":1},{"id":13,"title":"總裁與荒原上的志工","nw":69,"locked":1},{"id"
