看她被",["castigate","嚴厲斥責"],"。沒想到沈硯只是淡淡一句：\"很好，妳是第一個不對我阿諛奉承的人。\""],["從那天起，知夏成了全公司最",["conspicuous","顯眼"],"的人。部門學姐蘇曼妮最受不了，她外表",["benevolent","仁慈"],"，內心卻極其",["malevolent","惡毒"],"，表面說\"我會好好照顧妳\"，背後到處",["disparage","貶低"],"知夏，說她靠臉上位。知夏向來",["reticent","不願多談"],"，懶得多做解釋，只是更",["assiduous","勤勉不懈"],"地工作。她知道蘇曼妮手段",["insidious","暗中為害"],"，只能謹慎再謹慎。可是她沒想到，對方的",["duplicity","表裡不一"],"比想像中更",["pernicious","極其有害"],"。"],["季度報告會上，蘇曼妮突然站起來，語氣",["brazen","厚顏無恥"],"：\"總裁，這份市場分析是我熬夜寫的，卻被林知夏冒名頂替，掛上了她的名字！\"她把一疊列印稿甩在桌上，證據看起來",["cogent","令人信服"],"。所有人看向知夏的眼神都變了，有人鄙夷，有人想",["ostracize","排擠"],"她。知夏指尖發冷，想要",["vindicate","證明清白"],"自己，卻發現原始檔案被刪得一乾二淨。她咬著唇，不肯",["capitulate","屈服投降"],"，聲音卻還是有點抖：\"那份報告的每一個字都是我寫的。\"會議室裡氣氛緊繃得近乎",["ominous","不祥"],"，蘇曼妮嘴角揚起一抹",["condescending","高高在上"],"的笑。"],["就在這時，沈硯慢條斯理地放下鋼筆，一個字一個字地說：\"蘇曼妮，妳的說法很",["eloquent","雄辯"],"，可惜缺乏",["veracity","真實性"],"。\"他按下遙控器，螢幕上出現伺服器紀錄：檔案建立者、修改時間，全部指向知夏，而刪除指令來自蘇曼妮的帳號。真相一目了然，蘇曼妮臉色慘白，還想",["equivocate","含糊其詞"],"，沈硯冷冷",["rebuke","斥責"],"：\"不必",["prevaricate","支吾搪塞"],"。明天不用來了。\"全場鴉雀無聲。知夏被當眾",["exonerate","洗清罪名"],"，眼眶一熱，卻倔強地不肯讓眼淚掉下來。她一直以為他",["aloof","冷淡疏離"],"，原來他什麼都看在眼裡。"],["散會後，沈硯把她叫進辦公室，丟給她一個牛皮紙袋。裡面是她申請研究所需要的推薦信，署名沈硯。\"妳每晚在論壇上發的英文作文，\"他神情依舊",["impassive","面無表情"],"，\"幫妳改到凌晨的那個匿名網友，是我。\"知夏愣住了，原來那個說話",["pedantic","愛賣弄學問"],"、批改卻無比",["meticulous","一絲不苟"],"的網友，竟然就是他！她心裡的感動",["ineffable","難以言喻"],"，卻嘴硬：\"總裁這麼",["magnanimous","寬宏大量"],"，是想讓我欠你人情？\"沈硯起身把她困在書櫃前，眼神",["ardent","熾熱"],"得令人心跳失序：\"推薦信我只寫了一句——她是我見過最",["tenacious","堅韌不拔"],"的人。但林知夏，我對妳的心思從來不是",["ephemeral","短暫"],"。研究所可以去，人得回到我身邊。\"知夏耳根通紅，終於",["acquiesce","默許"],"，輕輕點了點頭。"]],"nw":39},{"id":2,"title":"總裁的贗品疑雲","paras":[["葉書禾是瀚古拍賣行最年輕的首席鑑定師，眼光",["incisive","犀利"],"，從不對權貴卑躬屈膝。拍賣行被嚴氏集團收購那天，新老闆嚴墨衍走進鑑定室，全場員工都對他表現出近乎誇張的",["deference","恭敬"],"，只有她頭也不抬地拿著放大鏡。\"這幅畫，妳看了三個小時。\"他語氣",["terse","簡短生硬"],"，神情",["impervious","不為所動"],"。書禾淡淡回答：\"鑑定不是演戲，不需要",["embellish","渲染"],"。\"她對古畫有天生的",["affinity","親近感"],"，筆觸、紙紋、印泥裡透出的年代感，她一眼便知。嚴墨衍盯著她看了許久，忽然勾起嘴角：\"從今天起，妳只對我一個人負責。\""],["拍賣行的舊部對新老闆既敬畏又不服。前任總監方瑤表面",["jovial","快活"],"，在酒會上永遠",["convivial","熱絡"],"地四處舉杯，私下卻生活",["dissolute","放蕩"],"，還欠下大筆賭債。她最看不慣書禾，說她",["fatuous","愚蠢自大"],"，只會",["didactic","好為人師"],"地糾正別人。嚴墨衍上任後宣佈要",["curtail","削減"],"冗員，推行",["egalitarian","平等主義"],"的考核制度，方瑤的權力瞬間",["dissipate","消散"],"。書禾的工作室裡堆滿各國古物，她常加班到深夜，門口總會多出一杯熱可可。她以為那只是隨手的施捨，卻不知道整棟大樓只有她的燈，他會親自守到熄滅。"],["秋拍之夜，壓軸是一幅明代山水，由書禾親筆出具真跡證書。槌聲未落，方瑤突然起身，情緒",["tempestuous","激動狂暴"],"，厲聲道：\"這幅畫是贗品！葉書禾收了賣家的",["largess","厚禮"],"，故意作假！\"她揚起一份外部報告，滿口",["diatribe","激烈抨擊"],"與",["slander","誹謗"],"，說書禾是披著專業外衣的",["charlatan","騙子"],"。台下無數閃光燈同時亮起，買家們",["fractious","躁動難控"],"，場面一片混亂。有人說她的鑑定根本是胡說八道，有人當場要求從名冊上",["expunge","抹除"],"她的名字。書禾臉色發白，卻仍",["steadfast","堅定不移"],"地站在台上：\"我的鑑定，經得起任何檢驗。\""],["就在此時，嚴墨衍從貴賓席起身，一步步走上台，把她護在身後。\"誰准你們動她？我的人，輪不到你們來審。\"他請上國際實驗室的專家，以光譜分析",["elucidate","闡明"],"顏料成分，結果全部吻合明代礦物。螢幕一轉，竟是方瑤與造假集團的轉帳紀錄：她想用假報告壓價，再低價吃下真跡轉賣。原來她",["dormant","潛伏的"],"多年的陰謀，早在收購前就被嚴墨衍盯上。方瑤還想",["exacerbate","加劇"],"混亂，保全已將她架走。原本因漫長爭執而陷入",["lassitude","倦怠"],"的會場爆出掌聲，剛才嘲笑書禾的人，那副",["repugnant","令人厭惡的"],"嘴臉全僵在原地。"],["散場後，書禾在空蕩的展廳裡終於腿軟，心中湧起難以言說的",["euphoria","狂喜"],"。嚴墨衍遞來外套，語氣難得帶著",["levity","輕鬆"],"：\"鑑定師小姐，妳今晚的",["sobriety","冷靜"],"，比那幅畫還值錢。\"她帶著",["empathy","同理心"],"看著他眼底的疲憊：\"你早就知道真相，為什麼不先告訴我？\"他沒有拐彎抹角，也沒有任何",["oblique","迂迴的"],"暗示，只是低頭，聲音",["emollient","溫柔撫慰"],"得不像他：\"因為我要全世界親眼看見，妳是對的。\"接著他扣住她的手腕，又恢復霸道：\"收購拍賣行只是順便。葉書禾，我真正想收藏的是妳，這輩子都別想從我身邊流拍。\""]],"nw":33},{"id":3,"title":"總裁的談判顧問","paras":[["許念棠是連續三屆的全國辯論冠軍，台風犀利，從不",["timorous","膽怯"],"。大學辯論社的老師曾",["inculcate","諄諄灌輸"],"她一個信念：邏輯是",["immutable","不可動搖"],"的武器。畢業後她卻甘願窩在小律所當研究助理，過著",["ascetic","苦行般"],"的日子，三餐",["abstemious","節制"],"到只剩泡麵。直到傅氏集團總裁傅承嶼親自上門，把一份顧問合約推到她面前。他神情",["staid","古板嚴肅"],"，一開口卻",["presumptuous","自以為是"],"得驚人：\"明天開始，妳替我談下這筆併購。\"念棠挑眉：\"傅總憑什麼認為我會答應？\"他俯身，聲音低沉：\"因為對方的首席律師是妳的前男友江屹。妳不想贏他一次？\""],["念棠最",["abhor","憎惡"],"被人看穿，卻還是簽了字。談判室裡，條文",["esoteric","深奧難懂"],"得像天書，江屹一如既往地",["churlish","粗魯無禮"],"，一見面就",["insinuate","暗示"],"她是靠男人才進了這間會議室。念棠不動聲色，只輕輕",["allude","暗指"],"他當年剽竊她論文的舊事，對方臉色一僵。傅承嶼這個商界出了名的",["maverick","特立獨行者"],"全程沉默，卻在桌下替她擋住江屹故意推來的咖啡。兩人漸漸有了",["tacit","心照不宣的"],"默契：她出招，他收尾。休會時他低聲說：\"做得好，但下次別對他笑。\"念棠失笑：\"傅總，你這是在吃醋嗎？\"他面不改色：\"是佔有慾。\""],["最後一輪談判前夜，江屹",["incite","煽動"],"媒體爆料，聲稱念棠利用顧問身分竊取機密，還拿出一段剪接過的錄音",["implicate","牽連"],"她。報導措辭",["incendiary","煽動性"],"，網友紛紛",["remonstrate","抗議"],"，董事會要求立刻將她",["relegate","降級"],"為閒置人員。一位董事當面",["admonish","告誡"],"傅承嶼：\"你為了一個女人，要賠上整個集團？\"那幾位老董事出了名的",["obstinate","頑固"],"，守舊得像一群",["zealot","狂熱信徒"],"。念棠站在走廊，第一次覺得自己的",["fortitude","堅忍"],"快撐不住了。她甚至想主動辭職，向所有人低頭認錯，即使她什麼都沒做錯。"],["隔天，談判桌旁圍著一群記者。江屹得意地播放錄音，眼裡滿是",["avarice","貪婪"],"。念棠深吸一口氣，以縝密的邏輯逐句拆解：錄音時間戳記與她的門禁紀錄矛盾，指控完全",["untenable","站不住腳"],"。江屹還想反駁，傅承嶼把一疊文件甩上桌，冷聲道：\"這份合約，我說了算。至於她，誰准你動我的人？\"文件裡是江屹私下收受回扣的證據，他那副得意的嘴臉瞬間崩塌。律師公會代表當場",["reprimand","譴責"],"他，傅承嶼又",["underscore","強調"],"一句：\"江律師，你被你的委託人開除了。\"那個自詡",["iconoclast","反傳統者"],"的男人，此刻狼狽不堪。"],["風波平息後，董事們個個",["contrite","懊悔"],"地前來道歉，傅承嶼一句話便",["assuage","平息"],"了眾人的不安。那晚他帶她登上集團頂樓，城市燈火璀璨如星河。念棠笑他：\"傅總今天的表現，堪稱霸道總裁的",["epitome","典範"],"。\"他沒笑，眼神是她從未見過的認真：\"念棠，我不想再用合約綁住妳。\"他取出一枚戒指，\"但我想用另一種",["yoke","羈絆"],"，一輩子的那種。\"她心跳如擂鼓，滿心歡喜藏都藏不住。\"這也是談判嗎？\"她問。\"不，\"他把戒指套上她的指尖，用詞再",["felicitous","恰當"],"不過，\"這是通知。妳只能是我的。\""]],"nw":33},{"id":4,"title":"總裁的契約新娘","paras":[["白芷寧在城南那座百年老圖書館修復古籍，日子",["quotidian","平淡日常的"],"卻安穩。她手藝",["proficient","精通"],"，也",["ingenious","巧妙"],"地自製工具，能讓蟲蛀的宋版書重獲新生。直到聶氏集團買下地皮，宣布拆館蓋商場。總裁聶司寒親臨現場，態度",["imperious","專橫"],"，一身西裝",["impeccable","無可挑剔"],"，身後跟著一排律師。芷寧擋在門口：\"拆掉它，等於拆掉一座城市的記憶。\"他眼神",["cynical","憤世嫉俗"],"：\"記憶不能當飯吃。\"她寸步不讓，他卻在看見她手中那本破舊家譜時沉默良久，眼底閃過一絲",["nostalgia","懷舊之情"],"。"],["三天後，聶司寒丟給她一份合約，條款裡",["replete","充斥著"],"各種限制：\"嫁給我一年，圖書館保留。\"原來聶老爺子病重，遺囑規定孫子須成婚才能接掌集團。芷寧對這交易",["ambivalent","矛盾猶豫"],"，獨自",["ruminate","反覆思量"],"了一整夜，最終為了圖書館簽下名字。婚禮辦得",["ostentatious","鋪張炫耀"],"，他在賓客面前",["gregarious","善於交際"],"，對她卻冷淡疏離。她並不",["docile","溫順"],"，常為了古籍和他吵得面紅耳赤。可她發現，他會在深夜溜進修復室，安靜看她工作。這讓她困惑不已：一個",["despot","暴君"],"般的男人，怎會有這樣溫柔的一面？"],["聶家二叔聶宏遠一直想",["supplant","取代"],"姪子的位置。他",["instigate","策動"],"一場陰謀：買通工人在修復室動手腳，讓一批國寶級古籍受潮發霉，再對媒體放出",["innuendo","影射"],"，暗指芷寧",["negligent","疏忽"],"失職，嫁入豪門只為貪圖財富。網路流言",["rife","四起"],"，評論",["scathing","尖刻"],"，文化局揚言要",["rescind","撤銷"],"她的修復師資格，圖書館的保存計畫也被判定不再",["viable","可行"],"。家族會議上，聶宏遠語帶",["guile","狡詐"],"，一再",["aver","斷言"],"：\"這種女人進門，簡直是一場",["debacle","大災難"],"。\"芷寧咬著牙，眼眶通紅，卻一句也不肯求饒。"],["會議室大門被推開，聶司寒帶著寒氣走進來：\"我的妻子，輪不到你來評價。\"他把監視器畫面投上螢幕：清楚拍到二叔的助理深夜潛入修復室，那場",["subterfuge","詭計"],"在證據面前無所遁形。聶宏遠還想",["glib","油嘴滑舌"],"地辯解，聶司寒冷冷打斷：\"不必用",["euphemism","委婉說法"],"粉飾。蓄意毀損文物是",["unconscionable","喪盡天良"],"的罪行，與背叛家族",["tantamount","等同"],"。\"他當場宣布",["punitive","懲罰性的"],"處分，撤除二叔所有職權，作為對其他心懷不軌者的",["deterrent","警告"],"。董事們噤若寒蟬，轉而對芷寧的專業獻上",["encomium","讚詞"],"，再無人敢隨意議論她。"],["風波過後，聶司寒帶她回到圖書館，交給她一份新文件，不是離婚協議，而是圖書館的永久保存契約。\"你為什麼……\"她哽咽。他拿出那本舊家譜：\"小時候我和",["indigent","貧困"],"的母親常來這裡躲雨，是一位修書的老先生收留了我們。那位老先生，是妳的祖父。\"原來這場相遇並非",["serendipity","意外的幸運"],"，他找了她整整十年。\"這不是",["altruism","利他之舉"],"，是報恩，也是私心。\"那段",["dismal","陰鬱"],"的童年，竟成了兩人之間",["indelible","不可磨滅"],"的連結。他擁她入懷，語氣霸道：\"一年的合約作廢。從今天起，妳要修的書，就是我們一輩子的故事。\""]],"nw":38},{"id":5,"title":"總裁的專屬口譯","paras":[["日內瓦氣候高峰會上，喬映雪是口譯廂裡最資淺的",["novice","新手"],"。台上發言的是封氏能源總裁封景珩，以",["redoubtable","令人敬畏"],"的談判手腕聞名，個性",["irascible","易怒"],"，觀點更是",["heterodox","離經叛道"],"，連各國部長都怕他三分。他引用一句據說出自亞里斯多德的名言，映雪卻在同步翻譯中停頓一秒，按下發言鍵：\"抱歉，封總，這句話",["apocryphal","出處可疑"],"，並非亞里斯多德所說。\"全場嘩然，在這種場合糾正講者，簡直是",["effrontery","厚顏放肆"],"。封景珩隔著玻璃看向她，神情",["imperturbable","泰然自若"],"，只說了一句：\"會後，來找我。\""],["映雪以為自己要被開除，沒想到他竟向主辦方點名，要她擔任他的專屬口譯。\"從今天起，妳的耳朵和嘴，只為我工作。\"他語氣",["haughty","傲慢"],"，脾氣",["mercurial","反覆無常"],"，卻在她加班錯過晚餐時讓助理送來熱湯，態度",["solicitous","殷切體貼"],"得不像他。映雪出身收入微薄的單親家庭，靠自學一門",["obscure","冷門的"],"小語種才擠進這一行。兩人漸漸建立起奇妙的",["rapport","融洽關係"],"：她總能用",["pithy","精闢"],"的譯文抓住他話裡的鋒芒，他則在",["pugnacious","好鬥"],"的記者圍堵她時，一句話就讓對方閉嘴。這份特殊待遇，卻",["kindle","點燃"],"了資深口譯魏詩涵的嫉妒。"],["第三天的閉門協商攸關一項跨國減碳協議，議題本就",["intractable","棘手"],"。魏詩涵趁映雪離席，偷偷竄改她的譯稿，把\"願意讓步\"改成\"拒絕讓步\"，讓談判陷入一片混亂。對方代表當場暴怒，協議眼看就要",["languish","停滯不前"],"。魏詩涵趁機向媒體散播",["aspersion","中傷"],"，說映雪立場",["subversive","顛覆性"],"、被敵對國收買，翻譯水準更是",["abysmal","極糟"],"。那些",["credulous","輕信"],"的記者照單全收，報導",["ubiquitous","無所不在"],"，映雪陷入前所未有的",["plight","困境"],"。她站在走廊，渾身發冷，不知該如何",["extricate","脫身"],"。"],["隔天記者會，魏詩涵",["pretentious","自命不凡"],"地表示要\"代映雪向各國致歉\"。封景珩卻起身打斷，語氣",["implacable","毫不寬容"],"：\"道歉？該道歉的人是妳。\"他公布會議錄音與檔案修改紀錄，經過",["exhaustive","詳盡的"],"比對，竄改者正是魏詩涵的帳號。證據確鑿，足以",["dispel","驅散"],"所有謠言。他冷冷補上一句：\"口譯的忠實是",["sacrosanct","神聖不可侵"],"的。妳碰了底線，也碰了我的人。\"魏詩涵",["wily","狡猾"],"的笑容瞬間崩裂，主辦方當場撤銷她的資格。協議重回正軌，對方代表甚至主動致歉。"],["閉幕夜，雪落在萊芒湖上，像一場",["evanescent","轉瞬即逝"],"的夢。映雪終於得到片刻",["respite","喘息"],"，封景珩卻把她堵在湖畔長椅前。\"你為什麼那麼相信我？\"她問。他難得語氣",["facetious","開玩笑"],"：\"全世界只有妳敢當眾糾正我，我不信妳，信誰？\"隨即眼神變得",["fervent","熾熱"],"：\"映雪，妳是我改變的",["impetus","動力"],"。我不想",["squander","浪費"],"任何一分鐘去猜妳的心意。我要妳當我的專屬口譯，一輩子的那種。\"她怔住，淚珠在睫毛上凝成霜。他低頭吻去，聲音霸道：\"不准翻譯，直接回答。\"她笑著點頭：\"好。\""]],"nw":36},{"id":6,"title":"總裁的冒牌學生","paras":[["夏梔言是哲學系最",["erudite","博學"],"的助教，身形",["diminutive","嬌小"],"，寫起論文卻",["prolific","多產"],"得驚人，只可惜窮得必須兼職家教。這次雇主開價驚人：替秦氏集團總裁的弟弟補習哲學，據說學生",["indolent","懶散"],"又",["boorish","粗野無禮"],"，已經氣走三位老師。第一堂課，書房裡的男人西裝筆挺，自稱\"秦小舟\"，對她的講解處處",["quibble","吹毛求疵"],"。\"康德說的自由，不過是",["bourgeois","中產階級"],"的幻想。\"他語氣",["sardonic","譏諷"],"。梔言放下書，面不改色：\"那你先把作業寫完，再來推翻康德。\"男人愣了一下，竟低低笑出聲來。"],["幾週下來，\"秦小舟\"不再",["dilatory","拖延"],"，作業交得比誰都快，提問也越來越刁鑽。他",["loquacious","健談的"],"起來能跟她辯到深夜，安靜時卻會",["wistful","悵然若失"],"地望著窗外。有一次他問：\"如果一個人說了謊，動機卻是愛，他是",["culpable","有罪的"],"嗎？\"梔言眼中",["evince","流露"],"一絲疑惑，仍認真回答：\"動機無法抵銷謊言。\"他沉默許久。她漸漸發現，這學生的學識非但不淺薄，反而深得驚人；兩人出身",["disparate","迥異"],"，卻有著奇異的默契。而",["unwitting","毫不知情"],"的她，早已一步步走進他布下的局。"],["秦家世交千金韓若綺早把秦家視為囊中物，對梔言心懷",["enmity","敵意"],"。她在學術圈散布消息，說梔言剽竊同門論文，又把她出入秦宅的照片配上",["gratuitous","無端的"],"揣測，說她攀附豪門的",["cupidity","貪婪"],"昭然若揭。輿論",["incessant","不斷"],"地轟炸，系上要求她",["retract","撤回"],"論文，那些曾給她",["approbation","讚許"],"的學者也紛紛轉身。學術晚宴上，韓若綺",["sanctimonious","偽善清高"],"地說：\"學術圈需要乾淨的人。\"梔言站在角落，彷彿跌入人生的",["nadir","最低點"],"，連一向引以為傲的",["equanimity","沉著"],"都碎了一地。"],["這時宴會廳大門推開，\"秦小舟\"走了進來，身後跟著秦氏法務團隊。有人驚呼：\"秦總？\"梔言如遭雷擊。她的學生，竟是商界",["notorious","惡名昭彰"],"的冷面總裁秦晏舟本人。他走到她身邊，攬住她的肩：\"誰說她攀附我？是我求她來的。\"他公布完整的投稿紀錄，證明被抄襲的其實是梔言，散布謠言的帳號則屬於韓若綺的助理。\"想",["discredit","詆毀"],"她？妳還不夠格。\"韓若綺臉色慘白，昔日",["servile","奴顏婢膝的"],"圍著她的人紛紛退開；那位號稱學術倫理",["proponent","擁護者"],"的教授也只能",["concede","承認"],"錯判，當眾致歉，並把年度論文",["accolade","榮譽"],"頒還給她。"],["回程車上，梔言一言不發。秦晏舟難得",["penitent","悔過"],"，低聲",["divulge","吐露"],"一切：三年前他在講堂後排聽過她的演講，從此念念不忘，卻怕身分嚇跑她，只好做個",["craven","懦弱"],"的騙子。\"你騙了我。\"她說。\"我認。但我絕不會放棄妳。\"他握緊她的手，霸道又笨拙：\"妳可以生氣，可以罰我寫一百篇作業，但不准走。\"窗外是",["variegated","五彩斑斕"],"的城市燈火，梔言終於笑了。那份悸動並不",["mawkish","濫情"],"，而是真實的",["rapture","狂喜"],"。\"那就從今天起，\"她輕聲說，\"你當我的",["linchpin","支柱"],"，我當你一輩子的老師。\"他",["elated","欣喜若狂"],"，低頭吻住她：\"成交。\""]],"nw":38},{"id":7,"title":"總裁的首席小提琴手","paras":[["葉聆箏是城市交響樂團的首席小提琴手，出身",["penury","貧困"],"，靠一把二手琴",["persevere","堅持不懈"],"了十五年。樂團剛換了神秘贊助人，傳聞他",["saturnine","陰沉"],"、脾氣",["impetuous","衝動"],"，對一切",["blandishment","奉承話"],"都免疫，一句話就能讓整個團解散。排練廳裡的",["cacophony","刺耳雜音"],"在他推門那刻戛然而止。男人一身黑西裝，眼神",["perspicacious","洞察敏銳"],"，只在聆箏身上停了一秒：\"第二樂章，妳慢了半拍。\"團員們倒抽一口氣，聆箏卻抬起下巴：\"那是",["subtle","細微的"],"彈性速度，裴先生聽不出來，不代表它錯。\"他微微挑眉：\"有意思。從今天起，妳的每一場演出，我都要坐第一排。\""],["贊助人裴少淵從此成了排練廳的常客。他從不",["chide","責備"],"任何人，卻總在散場後遞給聆箏一杯熱可可，態度冷淡得像在交代公事。副首席范詩蕾看在眼裡，嫉妒得近乎",["rabid","發狂"],"。她表面",["unctuous","油滑諂媚"],"，一口一個\"聆箏姊\"，背地裡卻",["surreptitious","偷偷摸摸"],"地在群組散布",["calumny","誹謗"],"，說首席的位置是陪贊助人吃飯換來的。流言像",["deluge","洪水"],"一樣淹沒社群，聆箏收到",["copious","大量的"],"辱罵私訊。她以為這些話",["innocuous","無害"],"，太過",["complacent","掉以輕心"],"，沒想到流言早已足以",["undermine","暗中破壞"],"她的名聲。"],["年度音樂會前一晚，范詩蕾",["contrive","策劃"],"了一場好戲。她找來相熟的樂評人，在記者面前",["denigrate","詆毀"],"聆箏的演奏",["vapid","空洞乏味"],"，詮釋更是",["derivative","模仿而來"],"，全靠男人捧，還拿出一段剪接過的影片，畫面裡聆箏深夜從裴少淵車上下來。輿論匯聚成一句話：讓她",["abdicate","讓位"],"。團長不敢得罪人，委婉地說：\"聆箏，要不妳先休息一陣子？\"聆箏攥緊琴弓，不願",["supplicate","哀求"],"，只說了一句：\"我會在台上給大家答案。\"那晚她獨自坐在空蕩的後台，神情",["pensive","沉思"],"，手指一遍遍撫過舊琴的裂痕。"],["音樂會當晚，范詩蕾刻意把聆箏的弦調鬆。開場前一刻，裴少淵大步走進後台，把一把名琴放進她懷裡：\"用這個。我的人，誰都別想動。\"聆箏一曲終了，琴聲",["galvanize","激勵"],"了全場，觀眾起立，掌聲雷動。謝幕時，裴少淵走上台接過麥克風。他向來",["shrewd","精明"],"，早讓人保全了",["unassailable","無懈可擊的"],"證據，語氣篤定：\"那段影片是",["fallacious","誤導人的"],"剪接。完整版在這裡——那晚她在我車上，是因為她母親病危，我送她去醫院。\"大螢幕播出監視器畫面，連范詩蕾偷偷調鬆琴弦的手法都拍得一清二楚。那些",["nebulous","含糊不清的"],"指控瞬間瓦解，這是一場徹底的打臉。他冷冷補上一句：\"造謠的人，我的律師明天會找妳。\""],["真相大白，聆箏被徹底",["exculpate","開脫罪責"],"，團長公開支持她續任首席，連當初質疑她的樂評人都在專欄承認自己",["fallible","會犯錯"],"。范詩蕾哭得",["lachrymose","淚汪汪"],"，想求聆箏",["absolve","寬恕"],"她，聆箏只淡淡回答：\"不必，那些",["extraneous","無關的"],"人和事，我不想再記得。\"散場後，裴少淵在後門等她，一反平日的冷硬，神情竟有些",["ingenuous","天真坦率"],"：\"那把名琴，是我十年前在街頭聽妳拉琴時就買下的。我等了妳十年。\"聆箏愣住，眼淚掉了下來。他低頭替她擦去淚水，語氣霸道：\"從今以後，妳只准為我一個人哭——也只准為我一個人拉安可。\""]],"nw":36},{"id":8,"title":"總裁的考古女神","paras":[["考古學家鍾以禾在南部山區的挖掘現場待了三個月，曬得黝黑，生活",["frugal","節儉"],"，研究的卻是極為",["recondite","深奧的"],"古代祭祀文化。她的方法向來不夠",["orthodox","正統"],"，學界前輩私下都笑她異想天開。投資人嚴靖深是出了名的冷面總裁，",["taciturn","沉默寡言"],"，第一次到工地，就對著滿地土坑露出",["skeptical","懷疑的"],"眼神：\"三個月花了我八百萬，就挖出這些",["mundane","平凡的"],"碎陶片？\"以禾不卑不亢，把一塊陶片遞到他眼前：\"總裁，地層的",["accretion","逐層堆積"],"不會說謊，這些碎片是一千年前的生活。\"他沉默片刻，竟收下那塊陶片：\"給妳一個月。證明妳的價值和這筆錢",["commensurate","相稱"],"。\""],["從那天起，嚴靖深每週都飛來工地。他嘴上冷淡，卻默默讓人送來新帳篷和發電機。以禾嘴硬，說他只是怕錢打水漂，心裡卻像有什麼在",["burgeon","萌芽"],"。同組研究員羅子翔看在眼裡，對她越發",["supercilious","高傲輕蔑"],"，整天擺出",["pompous","自負浮誇的"],"姿態指揮學生，還常學總裁說話，拙劣地想",["emulate","仿效"],"那份氣場。他向來",["loathe","厭惡"],"屈居人下，更見不得以禾憑",["innate","天生的"],"直覺屢屢挖到好東西。以禾對這些一笑置之，性子",["blithe","無憂無慮"],"，對羅子翔的嫉妒完全",["oblivious","渾然不覺"],"。直到某個深夜，她在最底層挖出一枚刻滿銘文的青銅印，激動得手都在抖——這將改寫整段地方史。"],["然而三天後，羅子翔搶先在學術研討會上發表那枚青銅印，說是自己的發現。更",["harrowing","令人煎熬"],"的是，他與系主任早有",["collusion","勾結"],"，連田野日誌都被篡改，一切看起來毫無",["discrepancy","矛盾之處"],"。台上，羅子翔以華麗",["rhetoric","修辭"],"侃侃而談，還",["feign","假裝"],"惋惜地說：\"以禾太想出名了，才會亂說。\"以禾",["indignant","憤慨"],"地站起來，卻被主任",["truculent","凶狠好鬥"],"地打斷，當眾宣布將她排除在後續研究之外。全場目光如刀，她第一次嘗到",["visceral","發自肺腑的"],"屈辱，卻咬緊牙關，不肯",["grovel","卑躬屈膝"],"。"],["就在此時，會議廳大門被推開。嚴靖深一身黑大衣走進來，身後跟著律師：\"這場研討會的經費是我出的。我的人，輪得到你們來定罪？\"他把平板投上大螢幕：挖掘現場的全天候錄影，清楚拍下以禾出土青銅印的那一刻，以及羅子翔深夜潛入帳篷翻拍日誌的畫面。證據確鑿，無可辯駁。原本",["vociferous","大聲叫囂的"],"主任頓時噤聲，羅子翔臉色慘白，仍",["belligerent","好鬥"],"地想爭辯，嚴靖深只冷冷一句：\"你可以閉嘴了。\"現場記者轉而",["excoriate","嚴厲抨擊"],"這樁剽竊醜聞，羅子翔的",["hubris","傲慢自大"],"終於反噬，兩人當場被要求",["relinquish","交出"],"所有研究權限。"],["風波過去，以禾的論文登上頂尖期刊。她站在夕陽下的探坑邊，心情終於",["placid","平靜"],"。朋友都說她",["resilient","有韌性"],"，被打倒也能馬上站起，而他最欣賞的，是她那份不肯妥協的",["rectitude","正直"],"。嚴靖深走到她身邊，一貫的冷臉竟有些",["gauche","笨拙"],"，遞來一個小盒子：\"妳說過，好的考古學家要",["heed","留意"],"每一層土。那妳有沒有留意到，我在這裡站了多久？\"以禾怔住。盒子裡是一枚戒指，內圈刻著與青銅印相同的銘文。她笑他手段",["banal","老套"],"，他卻俯身逼近：\"老套也好，",["saccharine","甜膩的"],"也罷——妳是我挖到最珍貴的寶，這輩子別想逃。\"那一刻",["poignant","令人動容的"],"沉默裡，她輕輕點了頭。"]],"nw":38},{"id":9,"title":"總裁的論文守護者","paras":[["醫學研究員方若棠是實驗室裡最",["indefatigable","不知疲倦"],"的人，為了一組",["anomalous","異常的"],"血液數據，連熬了四十個通宵。她手法",["dexterous","靈巧"],"，心思",["circumspect","謹慎周到"],"，每一筆",["empirical","實證的"],"資料都親手核對。這天，國際醫學期刊的出資人封冽親自來訪。傳聞他性格",["dour","嚴厲陰鬱"],"，說話",["acerbic","尖酸刻薄"],"，最痛恨",["verbose","冗長囉嗦的"],"報告。若棠只用三分鐘講完研究，他翻著資料冷聲道：\"數據乾淨，邏輯",["cohesive","連貫緊密"],"。妳是第一個沒讓我想睡的人。\"她不服氣地回嘴：\"那是因為別人的報告太",["soporific","催眠"],"。\"他嘴角幾不可察地一動。"],["若棠的指導教授杜明謙是學界名人，外表溫文，帶學生卻極其",["lax","鬆散"],"，從不指導，只管掛名。若棠見怪不怪，以為那只是他",["inveterate","根深蒂固的"],"老毛病。封冽卻說得",["explicit","直白明確"],"：\"妳的教授看妳論文的眼神，不對。\"若棠笑他多疑，他沒有笑：\"我的人，我自然盯得緊。\"這句話讓她心跳漏了一拍，也埋下一絲",["disquiet","不安"],"。之後封冽常藉口討論數據約她吃飯，席間說些學界",["anecdote","軼事"],"，態度從不",["flippant","輕率"],"。他明明對甜食有",["aversion","反感"],"，卻記得她愛吃什麼，每次都替她點好甜點。"],["一個月後，若棠在期刊官網上看見自己的論文——第一作者卻是杜明謙，她的名字被",["jettison","剔除"],"得一乾二淨。她衝進教授辦公室，杜明謙態度",["impudent","厚顏無恥"],"：\"學生的成果本來就屬於實驗室。妳鬧，只會",["impede","阻礙"],"自己的前途。\"他在系上的",["milieu","人脈圈子"],"根深葉茂，轉頭就以",["histrionic","做作誇張的"],"姿態向同事訴苦，說若棠想",["encroach","侵占"],"他的研究。那些謊話被",["relentless","無休止"],"地轉述，若棠淪為",["hapless","不幸的"],"代罪羔羊，被迫申請",["hiatus","休學中斷"],"，卻",["adamant","堅定不移"],"地不肯道歉。"],["期刊年度頒獎典禮上，杜明謙正準備上台領獎。封冽卻先一步走上講台，語氣",["vitriolic","刻薄尖銳"],"得讓全場發寒：\"這篇論文的得獎資格，我宣布撤銷。\"他",["adroit","老練"],"地按下遙控器，螢幕上是若棠電腦裡的原始檔案、時間戳記，以及杜明謙要求助理更改作者順序的郵件。多年來，他利用",["opaque","不透明的"],"審稿機制",["perpetuate","延續"],"這種",["nefarious","邪惡的"],"剝削。\"學術",["turpitude","卑劣行徑"],"，在我的期刊沒有生存空間。\"杜明謙還想用",["superficial","膚淺的"],"藉口辯解，封冽冷冷打斷：\"你不配跟她站在同一個講台上。\"他轉身握住若棠的手：\"這篇論文真正的作者，是她。\""],["醜聞曝光後，杜明謙被撤職，學界紛紛與他切割，學生們終於不再被",["subjugate","壓制"],"。若棠重回實驗室，那份",["pristine","純淨原始的"],"熱情也回來了。夜裡，封冽在實驗室門口等她，平日",["stolid","不動聲色的"],"臉上竟帶著一絲緊張：\"妳說過，我是世上最難",["beguile","迷惑"],"的人。\"他拿出一只戒指，\"可妳做到了。\"若棠一時愣住，還想謝謝他這段日子的",["forbearance","包容忍耐"],"，他卻把她摟進懷裡，低聲命令：\"別想太多。這次不是數據，是我——不准拒絕。\"若棠紅著眼笑了，把手伸到他面前。走廊的燈一盞盞熄滅，只剩兩人相擁的影子，被月光拉得很長很長。"]],"nw":39},{"id":10,"title":"總裁的御用編輯","paras":[["梁書苡是文淵出版社最",["stringent","嚴格的"],"文學編輯，紅筆一落，從不留情。這天，一向",["affable","和藹可親的"],"總編把一份",["opulent","奢華的"],"燙金合約推到她面前：暢銷作家「無垠」的新書，指名由她負責。無垠是文壇",["anomaly","異數"],"，從不露面，作品卻篇篇",["profound","深刻"],"。直到見面那天，書苡才發現，坐在會議室裡的竟是傅氏集團總裁傅聿珩。他態度",["cavalier","傲慢隨便"],"，把稿子一丟：\"改可以，別改壞了。\"書苡翻了兩頁，語氣",["trenchant","犀利"],"：\"第三章對白太",["bombastic","浮誇"],"，情緒太滿，請刪掉一半。\"他抬眸，眼神危險：\"整個出版界，還沒人敢這樣跟我說話。\""],["合作初期兩人針鋒相對，會議室裡的",["acrimony","尖刻敵意"],"濃得化不開。他脾氣",["capricious","反覆無常"],"，今天要改結局，明天又要恢復；她一",["demur","提出異議"],"，他就冷著臉",["vituperate","痛罵"],"她不懂文學。可每到深夜，他又會傳來一句：\"書苡，那段改得好。\"漸漸地，她發現他筆下那個",["morose","陰鬱的"],"孤獨主角其實就是他自己——一個從小",["nomadic","四處漂泊"],"，在寄養家庭間輾轉長大的少年。她的嚴格成了他寫作的",["catalyst","催化劑"],"，而他偶爾",["jocular","愛開玩笑"],"的訊息，也悄悄",["ameliorate","緩解"],"了她加班時的",["melancholy","憂鬱"],"。"],["新書發表前夕，對手出版社的編輯邱芷妍設下圈套。她",["clandestine","秘密的"],"買通文淵內部員工，把「無垠就是傅聿珩」的消息放給媒體，再把洩密紀錄偽造成書苡的帳號。一夕之間新聞鋪天蓋地，有人說書苡為了",["aggrandize","抬高"],"自己出賣作者，有人罵這種行為",["heinous","極其惡劣"],"。邱芷妍還在節目上",["brash","囂張魯莽"],"地宣稱，書苡的修改都是",["spurious","假冒"],"，所有功勞都該",["ascribe","歸於"],"作者本人。書苡被總編停職，合作全面陷入",["abeyance","擱置"],"。她站在雨裡，第一次覺得自己像個",["quixotic","不切實際的"],"傻子。"],["發表會當天，所有媒體都在等傅聿珩譴責書苡。他走上台，神色冷得像冰：\"今天只說三件事。\"第一，他公開洩密的網路位址，指向邱芷妍收買的員工，證據確鑿，讓全場譁然；第二，他放出書苡逐頁批註的原稿，每一處修改都",["exemplary","堪稱典範"],"；第三，他直視鏡頭：\"你們可以",["flout","藐視"],"我的隱私，但誰敢動她，我奉陪到底。我的編輯，只有梁書苡一個。\"邱芷妍這種",["incorrigible","無可救藥的"],"慣犯，",["perfunctory","敷衍的"],"辯解在鐵證面前毫無力量，她氣急敗壞地想搶麥克風，立刻被保全請出會場。傅聿珩冷聲補上一句：\"這種抹黑，我會徹底",["eradicate","根除"],"。\""],["風波平息，總編親自登門",["placate","安撫"],"書苡，同事們",["exuberant","熱情洋溢"],"地為她鼓掌。傅聿珩倚在門口，身形",["lithe","修長矯健"],"，手裡拿著一份新稿：\"下一本，寫一個嚴格的編輯，和一個被她改了三年稿，終於不顧一切愛上她的作家。\"書苡臉一紅：\"太老套了，這種甜文讀者早就看膩了。\"他俯身逼近：\"那就由妳來改，改到妳滿意為止——但結局，我說了算。\"兩人難得達成",["concord","共識"],"。窗外那個",["homogeneous","千篇一律的"],"世界依舊喧鬧，而她終於找到只屬於兩人的",["utopia","理想國"],"。"]],"nw":37},{"id":11,"title":"總裁的政治聯姻","nw":38,"locked":1},{"id":12,"title":"總裁的財報煉金術","nw":37,"locked":1},{"id":13,"title":"總裁的三星侍酒師","nw":36,"locked":1},{"id":14,"title":"總裁與國寶策展人","nw":40,"locked":1},{"id":15,"title":"總裁失憶後賴上我","nw":38,"locked":1},{"id":16,"title":"總裁的競圖打臉現場","nw":37,"locked":1},{"id":17,"title":"總裁的直播主播","nw":39,"locked":1},{"id":18,"title":"總裁與雪夜觀星台","nw":38,"locked":1},{"id":19,"title":"總裁祖母的文學沙龍","nw":40,"locked":1},{"id":20,"title":"總裁與十年前的圖書館","nw":38,"locked":1},{"id":21,"title":"總裁的答辯席","nw":41,"locked":1},{"id":22,"title":"總裁與遺忘的畫","nw":42,"locked":1},{"id":23,"title":"總裁的海牙之約","nw":43,"locked":1},{"id":24,"title":"總裁與宋版書","nw":42,"locked":1},{"id":25,"title":"總裁與國宴口譯","nw":44,"locked":1},{"id":26,"title":"總裁的田園交響曲","nw":44,"locked":1},{"id":27,"title":"總裁與撤稿風波","nw":43,"locked":1},{"id":28,"title":"總裁的版權爭奪戰","nw":45,"locked":1},{"id":29,"title":"總裁與四千年遺址","nw":45,"locked":1},{"id":30,"title":"總裁與辯論女王","nw":43,"locked":1},{"id":31,"title":"總裁的星空契約","nw":36,"locked":1},{"id":32,"title":"總裁的專利保衛戰","nw":41,"locked":1},{"id":33,"title":"總裁的光之競圖","nw":39,"locked":1},{"id":34,"title":"總裁的葡萄園之約","nw":41,"locked":1},{"id":35,"title":"總裁的首演之夜","nw":39,"locked":1},{"id":36,"title":"總裁的白袍戰役","nw":38,"locked":1},{"id":37,"title":"總裁與白帽女王","nw":38,"locked":1},{"id":38,"title":"總裁的獎學金面試","nw":38,"locked":1},{"id":39,"title":"總裁的鑑偽之眼","nw":38,"locked":1},{"id":40,"title":"總裁與諾貝爾之吻","nw":39,"locked":1},{"id":41,"title":"總裁的惡意收購","nw":34,"locked":1},{"id":42,"title":"總裁與她的辯護席","nw":32,"locked":1},{"id":43,"title":"總裁的首席鑑定師","nw":32,"locked":1},{"id":44,"title":"總裁與她的指揮棒","nw":35,"locked":1},{"id":45,"title":"總裁與她的口譯箱","nw":31,"locked":1},{"id":46,"title":"總裁與她的新藥","nw":36,"locked":1},{"id":47,"title":"總裁與她的老洋樓","nw":31,"locked":1},{"id":48,"title":"總裁的退稿信","nw":32,"locked":1},{"id":49,"title":"總裁與她的星空","nw":32,"locked":1},{"id":50,"title":"總裁的頒獎台求婚","nw":32,"locked":1},{"id":51,"title":"總裁的諷刺畫師","nw":32,"locked":1},{"id":52,"title":"總裁與雕塑館律師","nw":33,"locked":1},{"id":53,"title":"總裁的毒舌退稿信","nw":33,"locked":1},{"id":54,"title":"總裁的超新星","nw":33,"locked":1},{"id":55,"title":"總裁與製琴師","nw":34,"locked":1},{"id":56,"title":"總裁的小鎮帳本","nw":34,"locked":1},{"id":57,"title":"總裁與最後一匹絲","nw":34,"locked":1},{"id":58,"title":"總裁的南島護身符","nw":34,"locked":1},{"id":59,"title":"總裁的龍眼蜜","nw":34,"locked":1},{"id":60,"title":"總裁的化石戒指","nw":34,"locked":1}],"blgre":[{"id":1,"title":"總裁的辯論宿敵","paras":[["恆遠集團總裁閔致遠是商界出了名的",["recluse","隱居者"],"，在權貴雲集的",["milieu","圈子"],"裡獨來獨往。他對細節",["punctilious","一絲不苟"],"到近乎苛刻，三個月換掉七任祕書，理由都是\"太",["servile","卑躬屈膝的"],"\"。直到新祕書程予澈的履歷放上桌，他指尖一頓。那張臉他記了八年——大學辯論賽決賽，這人站在反方，一句話就",["impugn","質疑"],"他整套論證，讓他在全校面前輸掉冠軍。程予澈推門進來，神態",["affable","親切隨和"],"，舉止合乎",["decorum","禮節"],"，語氣卻不卑不亢：\"閔總，好久不見。\"閔致遠靠回椅背，聲音冷得像冰：\"在這間辦公室，我說的話就是結論。你沒有反方。\""],["出乎所有人意料，程予澈撐過了第一週。他",["assiduous","勤勉"],"得可怕，凌晨三點回覆郵件，早上七點已把咖啡放在總裁桌上。閔致遠故意丟給他一份",["convoluted","錯綜複雜"],"的併購案，條款寫得冗長浮誇又",["esoteric","艱深晦澀"],"，連法務都看得頭痛；程予澈卻只花一個下午，就用三行字抓出",["gist","要點"],"。會議上他簡報時神采飛揚，手勢俐落有力，眼裡那份",["fervent","熾熱"],"的光芒，連最挑剔的董事都被",["captivate","迷住"],"。閔致遠表面上皺著眉，彷彿被這份能幹",["exasperate","惹惱"],"，心底卻湧起一股",["visceral","發自內心的"],"熟悉感——當年他就是被這樣的眼神打敗，也是從那時起，再也忘不掉這個人。"],["好景不長。副總經理韓明澤是公司裡最會逢迎的",["sycophant","馬屁精"],"，平日對誰都笑得",["saccharine","甜膩"],"，眼看新祕書搶走總裁的目光，便使出",["unscrupulous","不擇手段"],"的招數：他盜用程予澈的帳號，把機密報價寄給了對手。董事會上，韓明澤",["feign","假裝"],"一臉痛心：\"這種洩密行為實在",["reprehensible","可恥"],"，何況他平時就愛",["malinger","裝病偷懶"],"。閔總，您總不能因為私交就包庇這種",["transgression","過錯"],"吧？\"幾位",["partisan","立場偏頗"],"的董事立刻附和。轉眼間，程予澈成了全公司的",["pariah","被排擠者"],"，人人說他是混進來的內鬼。他沒有辯解，只是抬頭看向主位上的人，眼神安靜得讓人心疼。"],["閔致遠緩緩起身，修長的手指敲了敲桌面：\"韓副總，你剛才犯了一個",["gaffe","失言"],"——你說寄件時間是週三晚上十點，這個細節我們從沒公開過。\"他按下遙控器，螢幕跳出門禁紀錄與",["aggregate","彙整"],"後的網路日誌：\"那個時間，程予澈在我辦公室。你想",["circumvent","規避"],"系統，卻忘了伺服器不會說謊。\"證據一條條攤開，韓明澤的說法瞬間",["untenable","站不住腳"],"，臉色慘白，狼狽不堪。閔致遠聲音不高，卻字字如刀：\"你的",["megalomania","自大狂"],"，我忍很久了。還有——我的人，輪不到你來動。\"他當場",["reprimand","訓斥"],"那幾位附和的董事，宣布韓明澤即日停職。程予澈站在原地，心跳亂得不像話。"],["風波過後，頂樓辦公室只剩他們兩人。程予澈本想說幾句客套的",["platitude","陳腔濫調"],"道謝，閔致遠卻打斷他：\"不必。那些",["extraneous","多餘"],"的話，留給別人。\"他從抽屜拿出一張泛黃的照片——八年前辯論賽的合照。程予澈愣住，忍不住用",["irreverent","沒大沒小"],"的語氣笑他：\"原來冷面總裁也會偷藏照片？\"閔致遠沒笑，只是把他拉近：\"我費盡心思把你調來，就是為了",["obviate","杜絕"],"所有讓你離開的可能。你是恆遠的",["linchpin","關鍵人物"],"，也是我的。\"窗外的城市燈火",["variegated","斑斕多彩"],"，程予澈心裡",["elated","狂喜"],"得說不出話。閔致遠低頭，在他額上落下一吻：\"這場辯論，我認輸。但你這個人，誰准你走了？\""]],"nw":37},{"id":2,"title":"總裁與失竊名畫","paras":[["瀚藝拍賣行總裁裴景琛向來",["impassive","面無表情的"],"，對藝術圈的吹捧早已",["jaded","厭倦的"],"。直到春拍前夕，鎮館之寶——那幅畫著",["verdant","青翠的"],"山谷的十七世紀名畫——在庫房失竊，他才第一次踏進城郊那間小小的修復工作室。修復師江念白正伏在畫架前，對他的來訪只投來",["cursory","匆匆的"],"一瞥：\"排隊，我手上還有三幅。\"助理嚇得臉色發白，裴景琛卻神色",["unflappable","處變不驚"],"，逕自坐下，整整等了兩小時。等江念白終於抬頭，他只說了一句：\"我要你。替我找回那幅畫。\"江念白挑眉：\"裴總，你這語氣不像請人，像下聘。\""],["江念白在業界",["renown","盛名"],"響亮，個性卻",["abrasive","尖刻"],"，最討厭",["pedantic","賣弄學問"],"的鑑定專家。他",["peruse","細讀"],"失竊名畫留下的檔案照片，眼神越來越亮：\"這幅畫早在三年前就被人換過。你們去年展出的，是贗品。\"裴景琛一向",["phlegmatic","沉穩冷淡"],"的臉上終於出現裂痕。兩人連夜追查，江念白對線索的胃口",["voracious","極大"],"，推理",["cerebral","理性縝密"],"又大膽，裴景琛則用一通通電話撬開整個黑市。凌晨四點，江念白靠在他肩上睡著，裴景琛一動也不動，只對祕書",["discreet","低調"],"地比了個噤聲手勢。"],["春拍當天，對手拍賣行的首席鑑定師莫子謙帶著",["bevy","一群"],"記者闖進會場。他",["brazen","厚顏無恥"],"地指著江念白：\"就是他！修復師監守自盜，用",["surreptitious","暗中的"],"手法調包名畫，這是業界最",["heinous","令人髮指"],"的罪行！\"他甩出幾張模糊照片，配上一套",["fallacious","謬誤"],"的推論與華麗",["rhetoric","修辭"],"，全場頓時一片",["cacophony","嘈雜聲"],"。記者的提問",["strident","刺耳"],"又",["vehement","激烈"],"，還有人散布",["scurrilous","惡意中傷"],"的流言，說江念白全靠討好總裁才接得到案子。江念白臉色蒼白，那些",["gratuitous","無端"],"的羞辱像刀一樣，幾乎抽乾他最後一點力氣。"],["\"說完了？\"裴景琛的聲音不大，滿場喧鬧卻瞬間",["abate","減弱"],"。他把江念白拉到身後，冷冷看著莫子謙：\"你太",["complacent","自滿"],"了。你以為這套",["subterfuge","詭計"],"天衣無縫，可惜你那份偽造的來源證明，紙張年份比你宣稱的晚了兩百年。\"大螢幕亮起，江念白連夜做的光譜分析一目了然，更有監視畫面拍下莫子謙三年前深夜進出庫房。證據擺在眼前，全場譁然，記者紛紛調轉鏡頭。莫子謙慌忙想",["retract","撤回"],"指控，卻已來不及。裴景琛語氣森寒：\"我的人，輪不到你來審判。\"莫子謙被警方帶走，那是他一生最",["ignominious","屈辱"],"的一刻。"],["真畫在莫家地下室尋回，春拍以天價成交。慶功宴上，賓客對江念白滿是",["deference","敬重"],"，與先前的嘲諷判若兩樣，他卻只想逃。裴景琛在露台找到他，難得",["solicitous","體貼"],"地替他披上外套。江念白從不",["rail","怨嘆"],"命運，此刻卻低聲說：\"裴總，別讓我習慣被你保護。\"裴景琛用",["emollient","安撫"],"的語氣回答：\"那就習慣。\"他捧起江念白的臉：\"你不是",["neophyte","新手"],"，我也不是只看",["superficial","表面"],"的人。那幅畫我等了三年，你，我等多久都行。\"晚風裡，兩人的影子終於依偎在一起。江念白笑得",["jaunty","神氣"],"，踮腳吻了他：\"成交。\""]],"nw":36},{"id":3,"title":"總裁與模擬法庭","paras":[["封以墨是誠衡律師事務所最年輕的合夥人，表情永遠",["inscrutable","高深莫測的"],"，說話",["terse","簡短生硬"],"得像判決書。實習律師傅星野報到第一天，就在電梯裡撞翻了他的咖啡。封以墨低頭看著被弄髒的西裝，語氣",["sardonic","譏諷"],"：\"傅律師，你的身手倒是很",["lithe","靈活"],"，可惜方向錯了。\"傅星野沒有一味道歉，反而遞上紙巾：\"封律師，這杯咖啡我賠，但我不會因此少說一句話。\"事務所裡沒人敢這樣頂撞他，一向",["placid","平靜"],"的封以墨卻勾了勾嘴角：\"很好。下週模擬法庭，你當我的對手。\""],["消息一出，全所譁然。傅星野是出了名的",["maverick","特立獨行者"],"，辯論風格大膽又帶著",["panache","瀟灑氣勢"],"，卻從不",["patronize","擺架子對待"],"任何助理，在新人之間建立了深厚的",["camaraderie","同袍情誼"],"。模擬法庭那天，旁聽席擠滿了看熱鬧的同事。兩人針鋒相對：封以墨的論點",["concise","簡明"],"、邏輯",["impeccable","無懈可擊"],"；傅星野則",["adroit","靈巧"],"地抓住證人證詞中",["dubious","可疑"],"之處，攻勢",["incessant","不停歇"],"。最後封以墨竟罕見地",["concede","讓步"],"一分，全場掌聲雷動。散場時他低聲說：\"你是第一個讓我想認真打的人。\"傅星野耳根一熱。"],["資深律師鄒凱文是個",["officious","愛管閒事"],"又",["venal","貪財"],"的人，暗地收了對手的錢，對傅星野積怨已久。他用",["covert","隱密"],"手法竄改了傅星野經手的證據清單，再向管理委員會檢舉他竄改文件。一夜之間，傅星野陷入",["dismal","悲慘"],"的",["plight","困境"],"，同事紛紛",["ostracize","排擠"],"他，有人甚至在群組裡用",["profane","粗鄙"],"的字眼辱罵他。委員會考慮",["punitive","懲罰性的"],"處分，要求他當眾表現得",["contrite","悔悟"],"並認錯。傅星野臉色",["pallid","蒼白"],"，卻咬牙拒絕：\"我沒做過的事，絕不認。\"他的",["fortitude","堅毅"],"讓人心疼，卻沒人敢替他說話。"],["聽證會上，鄒凱文正得意地陳述，大門忽然被推開。封以墨走進來，西裝筆挺，目光冷得嚇人：\"抱歉遲到。我去調了一份東西。\"他把雲端版本紀錄投上螢幕：\"證據清單最後一次修改的帳號，是鄒律師你的。\"接著又播出一段錄音，鄒凱文與對手律師的通話清清楚楚。證據足以",["substantiate","證實"],"一切，鄒凱文想",["repudiate","否認"],"卻語無倫次——他自以為",["wily","狡猾"],"，其實早被盯上。封以墨的結論",["unequivocal","明確的"],"：\"委員會若對還原真相採取",["dilatory","拖延"],"的態度，就是共犯。\"他轉向鄒凱文，一字一頓：\"動我的人之前，先問過我。\""],["風波平息，委員會當場",["rectify","糾正"],"錯誤的處分，還給傅星野一份正式的",["approbation","嘉許"],"。同事們爭相道歉，傅星野卻只是",["wistful","惆悵"],"地望向窗外。他不擅長",["lament","哀嘆"],"，只怕自己太",["susceptible","容易動搖"],"，會誤會那人的好。深夜的辦公室，封以墨把一張聘書放在他桌上：\"轉正，跟我。\"傅星野愣住：\"封律師，我以為你",["loathe","厭惡"],"麻煩。\"封以墨俯身，聲音低得只有他聽得見：\"我討厭麻煩，但你例外。這些天我心裡",["turbulent","翻騰"],"得要命，比任何",["accolade","讚譽"],"都讓我在意的，是你。\"兩人之間那份",["tacit","心照不宣的"],"情意終於說破，傅星野笑著吻上他：\"那就請封律師，多指教了。\""]],"nw":40},{"id":4,"title":"總裁與調包樂譜","paras":[["嚴氏集團總裁嚴承澤是城市交響樂團最大的贊助人，作風強硬得像個",["despot","暴君"],"，一句話就能決定樂團生死。新任指揮唐聿卻是個",["eccentric","古怪"],"的天才，生活",["abstemious","節制"],"，不菸不酒，以",["probity","正直"],"聞名，排練時連一個音都不肯妥協。第一次見面，嚴承澤靠在後台門邊，語氣",["condescending","居高臨下"],"：\"聽說你把我推薦的獨奏家換掉了？\"唐聿頭也不抬：\"他的音準有問題。我不",["condone","容忍"],"錯音，就算是贊助人的面子也一樣。\"四周團員倒抽一口氣，連那位思想守舊的老團長都嚇得冒汗，嚴承澤卻笑了：\"有意思。首演那天，我坐第一排。\""],["此後，嚴承澤成了排練廳的常客。他從不說討好的",["blandishment","甜言蜜語"],"，卻總在唐聿",["despondent","消沉"],"時出現，帶著一杯熱茶和一句",["felicitous","恰到好處"],"的評語。唐聿起初以為他",["disingenuous","虛情假意"],"，漸漸卻發現，這個男人",["perspicacious","敏銳"],"得可怕，聽得出第二小提琴慢了半拍，也看得穿他藏在指揮棒後的疲憊，連他熬夜改譜的",["foible","小毛病"],"都記得。嚴承澤對外界批評向來",["impervious","不為所動"],"，卻說唐聿的詮釋",["eloquent","富表現力的"],"，像一種",["ineffable","難以言喻"],"的語言。唐聿嘴上嫌他吵，卻會在散場後多留十分鐘，只為聽他說一句\"今天很好\"。"],["首演前夜，唐聿打開樂譜，臉色瞬間發白——總譜被人調包，第三樂章被改得面目全非，若照著指揮，整場演出將淪為笑柄。更",["ominous","不祥"],"的是，樂團首席邵允書早已向媒體放話，說唐聿個性",["volatile","喜怒無常"],"，對團員",["vitriolic","尖酸刻薄"],"，還暗示他為了出名自導自演。幾個個性",["pliable","耳根子軟"],"的團員很快被煽動。邵允書在鏡頭前一副",["sanctimonious","道貌岸然"],"的模樣：\"我只是心疼大家。\"那份",["hypocrisy","偽善"],"讓唐聿作嘔，他卻陷入",["quandary","進退兩難"],"：重寫總譜時間不夠，取消演出又會毀掉整個樂團。"],["首演當晚，嚴承澤沒有坐在第一排，而是直接走上台。他拿出一份",["exhaustive","詳盡"],"的調查報告，冷聲宣布：\"樂譜調包，是邵允書與對手樂團的",["collusion","勾結"],"。\"監視畫面與轉帳紀錄一一",["corroborate","證實"],"了真相，足以",["implicate","牽連"],"邵允書背後的每一個人。邵允書當場",["grovel","卑躬求饒"],"，那張搬弄是非的嘴再也說不出話。嚴承澤居高臨下：\"你的",["ruse","詭計"],"很拙劣。這個人，我護定了。\"他轉身遞給唐聿一本",["pristine","完好如新"],"的總譜——原來他早就備份了原稿。真相大白，唐聿被徹底",["exculpate","證明無罪"],"。"],["那一晚的演出震撼全場，樂評人紛紛",["decry","譴責"],"邵允書的卑劣，給了唐聿滿滿的",["kudos","讚譽"],"。謝幕後，嚴承澤在空蕩蕩的音樂廳裡等他。唐聿走過去調侃：\"嚴總這麼",["zealous","熱心"],"，我還以為你只在乎投資報酬率。\"嚴承澤握住他的手：\"我這輩子最",["prudent","明智"],"的投資，就是你。\"他說，自己少年時一度陷入",["penury","貧困"],"，幾乎",["bereft","一無所有"],"，是一場免費音樂會陪他撐過最艱難的日子，那天台上的指揮，正是學生時期的唐聿。唐聿眼眶發熱。嚴承澤低頭吻他：\"往後，我要",["foster","栽培"],"你，你的每一場演出，我都要坐在第一排。誰也別想搶。\""]],"nw":37},{"id":5,"title":"總裁與他的口譯官","paras":[["外交部翻譯官夏知珩接到臨時調派：替祁氏集團的跨國併購談判擔任口譯。他懷著",["trepidation","惶恐"],"走進會議室，抬頭就看見主位上那張七年不見的臉——祁司衍。當年兩人是大學室友，祁司衍出國前夜，夏知珩連一句再見都沒說。如今這男人已是業界人人",["revere","崇敬"],"的",["epitome","典範"],"，脾氣",["irascible","暴躁"],"，談判手段",["relentless","毫不留情"],"。祁司衍",["glower","怒視"],"著他：\"外交部派來的人，就是你？\"夏知珩笑容",["amiable","友善"],"，平靜的表情",["belie","掩飾"],"了心底的慌亂：\"祁總，我只負責翻譯，不負責敘舊。\"祁司衍聲音一沉：\"那可由不得你。\""],["談判一開始，對方代表態度",["recalcitrant","頑固不配合"],"，報價高得近乎",["gouge","敲竹槓"],"。夏知珩的翻譯",["lucid","清晰"],"又",["incisive","犀利"],"，每一句都精準傳達祁司衍的意思，連對方話裡藏的",["guile","詭計"],"都一併點破。他",["indefatigable","不知疲倦"],"地連翻六小時，嗓子啞了也不肯休息。祁司衍表面",["flippant","漫不經心"],"地轉著鋼筆，視線卻始終沒離開他。休息時，祁司衍把一杯溫蜂蜜水推到他面前：\"喝。\"夏知珩一愣——這是大學時他感冒，祁司衍天天替他泡的。兩人之間那份",["affinity","親近感"],"從未",["dissipate","消散"],"，只是誰都不肯先說。"],["第三天，談判破局。對方指控祁氏內部有人",["flout","藐視"],"保密協議，把底價洩露給競爭者，矛頭直指外交部派來的口譯。祁氏副總邢書豪剛",["fawn","奉承"],"完對方代表，轉頭就",["castigate","嚴厲斥責"],"夏知珩：\"一個",["tyro","新手"],"，也敢在這種場合動手腳？這種",["malfeasance","瀆職"],"根本",["unconscionable","天理難容"],"！\"他還宣稱夏知珩是外交部的",["renegade","叛徒"],"，被長官放逐才來接案。幾個原本",["lackadaisical","散漫"],"的成員也跟著起鬨。面對如此",["adverse","不利"],"的局面，這位孤立無援的口譯沒有退縮，背脊挺直：\"我翻的每一個字，都經得起檢驗。\""],["祁司衍緩緩放下鋼筆，會議室安靜得能聽見呼吸。\"邢副總，你的",["gall","厚顏"],"讓我佩服。\"他把一疊文件丟到桌上：\"洩露底價的郵件，從你的私人信箱寄出，時間是夏知珩拿到資料的前一天。\"證據一條條攤在眾人眼前，邢書豪臉色死白，還想狡辯，模樣無比",["craven","怯懦"],"。祁司衍冷笑：\"我不是",["infallible","永不犯錯"],"的人，也許會看錯生意，但絕不會看錯他。\"他起身走到夏知珩身邊，當著所有人握住他的手：\"他是我的人。誰再對他無禮，就是跟祁氏過不去。\"全場無人敢不",["heed","聽從"],"，邢書豪當場被保全請了出去。"],["併購案最終順利簽約。夜裡，兩人站在飯店頂樓，城市燈火鋪滿腳下。夏知珩終於開口，神情",["penitent","懊悔"],"：\"七年前我不告而別，是怕自己耽誤你。\"祁司衍沒有",["reproach","責備"],"他，只是",["ruminate","反覆思量"],"了很久：\"我恨過你，卻從沒放下你。\"他承認自己也是",["fallible","會犯錯"],"的凡人，曾天真地以為時間是",["panacea","萬靈丹"],"。\"我不信",["altruism","利他主義"],"，你那套為我好，我不收。\"夏知珩眼裡有淚，笑容卻依舊",["resilient","堅韌"],"。祁司衍捧起他的臉：\"這一次，我說了算——你不准再走。\"夏知珩踮腳吻他，算是回答。"]],"nw":37},{"id":6,"title":"總裁的全年家教","paras":[["程以謙是大學哲學系的兼任講師，薪水微薄，日子",["quotidian","平淡"],"得像一杯放涼的白開水。那晚他下課經過酒吧後巷，撿到一個醉倒在台階上的男人，西裝",["opulent","奢華"],"，袖扣閃著冷光，嘴裡卻還",["vociferous","大聲嚷嚷"],"地罵著董事會。以謙本想走開，終究心軟，把人扛回自己堆滿書的小套房。半夜男人醒來，眼神",["pensive","若有所思"],"地盯著整面書牆，啞聲問：\"你讀這些，有什麼用？\"以謙頭也不抬：\"教人在喧囂裡保持",["sobriety","清醒"],"。至少，比現在的你清醒。\"男人低笑一聲，那笑聲裡有種說不出的",["portent","預兆"],"，像是什麼事要開始了。"],["隔天一早，男人只留下一張名片——嚴墨深，嚴氏集團總裁。中午，以謙就接到秘書電話：嚴總以近乎離譜的高價，包下他全年的家教時間。以謙被這種施捨",["nettle","惹惱"],"，衝進總裁辦公室想",["gainsay","反駁"],"，嚴墨深卻",["imperious","專橫"],"地靠在椅背上：\"董事會說我只會下命令，不懂說服。你教我。\"以謙冷笑：\"我不賣。\"墨深抬眼，聲音低沉：\"我買的不是你的課，是你的時間。誰准你說不？\"從此每晚七點，以謙教他",["brevity","簡潔"],"的力量，教他何謂",["antithesis","對比修辭"],"，教他一句",["pithy","精闢的"],"話勝過十句",["hyperbole","誇大之詞"],"。墨深學得極快，甚至開始",["emulate","仿效"],"以謙說話時那種從容的停頓。"],["可惜好景不長。墨深的二叔嚴振榮一向",["rapacious","貪得無厭"],"，他與姪子的",["enmity","敵意"],"由來已久，早想奪下整個集團。他手段",["devious","陰險狡詐"],"，暗中派人",["disseminate","散布"],"各種",["lurid","聳動的"],"流言：說總裁被一個窮講師迷得神魂顛倒，連併購機密都透露給對方。謠言",["insidious","陰毒"],"又",["pervasive","無孔不入"],"，短短三天就傳遍全公司。臨時董事會上，嚴振榮發表一篇充滿",["invective","謾罵"],"的",["diatribe","長篇抨擊"],"，指控以謙竊取商業資料，要求罷免總裁。幾位董事被說動，現場幾乎形成",["consensus","共識"],"。以謙被叫來對質，面對眾人鄙夷的目光，他的手在發抖，脊背卻挺得筆直，意志",["indomitable","不屈不撓"],"。"],["就在投票前一刻，嚴墨深站了起來。他沒有拍桌，也沒有怒吼，只用以謙教他的方式，停頓、然後開口：\"二叔，你說得很動聽，可惜每一句都經不起推敲。\"螢幕亮起，是一份清清楚楚的資金流向：嚴振榮把集團資金轉進一家早已",["defunct","停業"],"的空殼公司，真正",["culpable","有罪"],"的人是他自己。墨深語氣冷得像冰：\"你想",["undermine","暗中破壞"],"我，可以。但我的人，輪不到你來動。\"董事們面面相覷，原本的共識瞬間瓦解。嚴振榮臉色慘白，眼神",["vindictive","怨毒"],"，還想求一次",["reprieve","網開一面"],"，墨深只回了兩個字：\"報警。\"一場陰謀就此被",["thwart","挫敗"],"。"],["散會後，董事們紛紛",["laud","讚揚"],"總裁的演說精采，以謙卻被他拉進電梯。\"你明知道我被拖下水，會",["exacerbate","加劇"],"你的處境，為什麼不切割？\"墨深低頭看他，難得不再",["imperious","專橫"],"：\"因為你說過，有些東西是",["immutable","永恆不變"],"的。\"以謙心跳在理智與悸動之間",["oscillate","擺盪"],"，嘴硬地說：\"你真是",["incorrigible","無可救藥"],"。\"墨深握住他的手，聲音沉穩：\"合約是一年，但我想續約一輩子。你的時間是我的，你這個人，也是。\"電梯門打開前，他輕輕吻上以謙的額頭。那一刻，以謙終於明白，所謂哲學，原來也能被一個人",["imbue","注入"],"溫度。"]],"nw":37},{"id":7,"title":"總裁與沙漠遺址","paras":[["白知遠是考古隊隊長，一心想找到傳說中被黃沙掩埋的古城。學界那些",["parochial","眼界狹隘"],"的老教授，多半覺得他的理論太",["heterodox","離經叛道"],"，嘲笑他是",["quixotic","不切實際"],"的夢想家，經費一刀一刀被砍，連最基本的帳篷都快買不起。就在計畫快要停擺時，封氏集團總裁封凜突然注資。封凜本人",["taciturn","沉默寡言"],"，簽約時只說一句：\"我投資的是你，不是石頭。\"知遠對這種",["cavalier","輕慢隨意"],"的態度很不以為然，卻也無法拒絕對方開出的條件：投資人必須親自隨隊。於是，一個西裝筆挺的男人，就這樣跟著一群灰頭土臉的考古隊員，踏進了沙漠。出發那天天氣晴朗，隊員都說是",["propitious","吉利"],"的好兆頭。"],["起初兩人處處不對盤。知遠說話總帶點",["didactic","說教的"],"口吻，封凜則一臉",["nonchalant","若無其事"],"，彷彿天塌下來也與他無關。隊上的副隊長齊浩表面",["jovial","爽朗"],"、對封凜極盡",["effusive","過分熱情"],"的奉承，背地裡卻嫉妒知遠多年，總在學會上",["disparage","貶低"],"他的研究，早把知遠當成一生的",["nemesis","死對頭"],"。第七天，一場沙暴來得毫無徵兆。知遠為了搶救一塊石碑落在後面，封凜竟折返回來抓住他的手腕，把他拖進遺址的地下通道。入口隨即被流沙封死，兩人被困在伸手不見五指的黑暗裡，只剩一壺水和一支手電筒。"],["三天裡，空氣",["noisome","污濁難聞"],"，牆上滲出",["pungent","刺鼻"],"的礦物味。知遠起初還能撐著，第二晚卻發起燒來，情緒變得",["morose","陰鬱消沉"],"，喃喃說都是自己害了他，聲音",["timorous","怯弱"],"得不像平日的隊長。封凜把僅剩的水全遞給他，聲音低啞：\"喝。我不准你倒下。\"他用外套替知遠",["alleviate","減輕"],"寒意，又用一種知遠從沒見過的",["empathy","同理心"],"聽他說起童年、說起那座古城——他幾乎是在",["venerate","崇敬"],"它。那份",["ardor","熱忱"],"像一把火，悄悄",["kindle","點燃"],"了封凜心裡沉寂多年的東西。而在地面上，齊浩早已向媒體放出消息：隊長偽造文物、為騙經費擅闖禁區，害投資人失蹤。這番",["calumny","毀謗"],"在網路上變得",["ubiquitous","隨處可見"],"，學會甚至準備正式",["censure","譴責"],"知遠。"],["第三天清晨，封凜在通道盡頭摸到一道",["circuitous","迂迴曲折"],"的縫隙，兩人一路爬出，竟發現縫隙後方是整座",["dormant","沉睡的"],"古城的主殿。救援隊趕到時，齊浩正站在鏡頭前做",["bombastic","浮誇"],"的發言，說要接手考古計畫。封凜滿身沙土走到他面前，冷冷一句：\"你剪斷的那條安全繩，我拍下來了。\"他把手機丟給警方，畫面清清楚楚。齊浩臉色鐵青，全場記者一片",["incredulous","難以置信"],"的驚呼。封凜回頭，將知遠護在身後：\"想動他，先問我同不同意。\"齊浩那張臉上，再也藏不住",["malevolent","惡毒"],"的扭曲與",["chagrin","懊惱"],"。"],["後來，古城的發現",["perplex","困惑"],"了整個學界，也震撼了所有人，昔日嘲笑知遠的人轉而",["lionize","吹捧"],"他，把他",["exalt","頌揚"],"為年度最重要的考古學家。齊浩則在調查中認了錯，說想",["expiate","贖清"],"自己的罪過。慶功宴上，知遠找到躲在陽台的封凜：\"你那時明明可以先逃。\"封凜看著他，眼裡的冷意融成一片溫柔：\"三天前，我就決定放棄所有退路了。\"他低頭吻住知遠，沙漠的風溫熱而乾燥。\"往後你挖到哪裡，我就投資到哪裡，替你",["bolster","支撐"],"每一個夢。這輩子，你都跑不掉。\""]],"nw":35},{"id":8,"title":"總裁的專利保衛戰","paras":[["唐予澄是裴氏生技研究所裡最",["erudite","博學"],"的研究員，也是最不起眼的一個。他",["eschew","避開"],"所有應酬，每天窩在實驗室裡，對數據",["exacting","嚴苛"],"到近乎偏執。三年來，他在一片",["stagnant","停滯不前"],"的研究領域裡，獨自找出一種新型抗體的合成路徑。整個過程",["tortuous","曲折漫長"],"，失敗上百次，他卻從沒想過放棄。他的頂頭上司魏承瑞是出了名的",["martinet","嚴苛的上司"],"，對下屬極盡",["belittle","貶低"],"之能事，對研究經費卻像個",["miser","守財奴"],"，唯獨有搶功的",["penchant","癖好"],"。"],["集團總裁裴錚是業界公認的",["connoisseur","鑑賞家"],"，不只懂藝術，更懂人才。他行事",["flamboyant","高調張揚"],"，外界總以為他是只懂享樂的",["hedonist","享樂主義者"],"，卻有一個怪習慣：每週深夜都會一個人巡實驗室。那晚他停在予澄桌前，看了十分鐘的數據，只問一句：\"這是你做的？\"予澄點頭，態度既不",["complaisant","曲意討好"],"，也不",["impertinent","無禮"],"。裴錚盯著他，說話的",["cadence","語調節奏"],"慢得令人心慌：\"從今天起，你的實驗，直接向我報告。\"予澄愣住，研究所裡卻已經開始流傳各種曖昧的",["innuendo","影射"],"，說他靠總裁上位。在那個人人想法如出一轍的研究所裡，與眾不同本身就是罪。"],["真正的災難發生在專利申請前一週。魏承瑞趁予澄出差，以主管身分搶先遞件，硬生生",["usurp","篡奪"],"了發明人的位置。更狠的是，他還四處",["slander","誹謗"],"予澄偷竊團隊成果，甚至捏造實驗日誌，內容極具",["verisimilitude","逼真感"],"，連同事都信了。予澄回來時，迎接他的是一封停職信。走廊上的人或",["deride","嘲笑"],"、或閃避，有人用",["jocular","打趣"],"的口吻說：\"唐博士，下次記得先掛名啊。\"他據理力爭，人事部門只做了",["perfunctory","敷衍"],"的調查，便作出",["arbitrary","武斷"],"的處分，事情陷入",["impasse","僵局"],"。魏承瑞得意地以為自己能",["wanton","肆無忌憚"],"地踩著別人，永遠享有",["impunity","免受懲罰"],"。"],["專利發表記者會當天，魏承瑞站在台上，帶著",["ostentatious","得意炫耀"],"的笑容接受鏡頭，台下記者用各種讚美的提問",["inundate","淹沒"],"他，現場一片",["jubilant","歡騰"],"，主持人更念出一篇長長的",["encomium","頌詞"],"。直到側門打開，裴錚帶著予澄走進來。\"這項發明，\"裴錚的聲音不大，全場卻瞬間安靜，\"是我親眼看著他一筆一筆做出來的。\"他按下遙控器，螢幕上是實驗室監視器和雲端原始檔的時間戳記，每一筆都指向予澄。魏承瑞臉色煞白，態度變得",["erratic","顛三倒四"],"，先是",["pugnacious","咄咄逼人"],"地反咬予澄，又說是誤會。裴錚冷冷",["rebuke","斥責"],"：\"你偷的不只是專利，你動了我的人。\""],["當天下午，集團宣布",["rescind","撤銷"],"魏承瑞的任命與專利申請，並正式為予澄",["exonerate","洗清罪名"],"。那些曾經",["fickle","善變"],"的同事，轉頭便",["extol","讚揚"],"他是天才，語氣",["exuberant","熱烈"],"得近乎諂媚。予澄不在乎，他只是站在頂樓，看著夕陽燒成一片",["conflagration","大火"],"般的紅。裴錚走到他身邊，把外套披在他肩上：\"為什麼不早點來找我？我一直很",["vigilant","警覺"],"，卻還是讓你受了委屈。\"予澄低聲說：\"我怕連累你。\"裴錚握住他的手，語氣霸道又溫柔：\"我不准你一個人扛。你的研究，你的名字，還有你，以後都由我來護著。\"他低頭，輕輕吻住了予澄。"]],"nw":40},{"id":9,"title":"總裁的冒牌戀人","paras":[["夏亦安在老街開了一間小書店，店裡沒有",["garish","俗豔"],"的招牌，只有滿架舊書和一隻愛睡覺的貓。午後的陽光",["soporific","催人入睡"],"，日子",["idyllic","恬靜美好"],"得像一首詩。他曾是鋼琴",["virtuoso","演奏名家"],"，因為受傷才改開書店，從此只想安靜過日子。直到那天，一個西裝筆挺、氣場",["menacing","懾人"],"的男人推門而入，把一張支票拍在櫃台上。\"我是聶衡。週末陪我回老宅吃飯，假扮我的戀人。\"亦安抬頭打量他，語氣",["cynical","冷嘲"],"：\"聶總，錢買得到書，買不到人。\"聶衡卻",["laconic","簡短"],"地回了一句：\"那就買下這整條街。你選。\""],["原來聶家祖父年事已高，脾氣",["tempestuous","火爆"],"，一心逼孫子成婚，甚至放話不結婚就把繼承權交給堂弟聶子豪。聶衡對豪門聯姻有著",["innate","與生俱來"],"的",["antipathy","反感"],"，只好出此下策。他不想",["perpetuate","延續"],"家族那套用婚姻換利益的老規矩。亦安最後答應了，條件是聶衡得每週來店裡幫忙搬書。準備的過程比想像中",["arduous","艱辛"],"：兩人得對好",["myriad","無數的"],"細節，從初次見面到誰先告白，連眼神裡的",["nuance","細微差異"],"都要練。亦安原以為聶衡個性強硬、絕不",["tractable","好說話"],"，沒想到他學得比誰都認真。亦安發現，這個看似",["haughty","傲慢"],"的男人，其實記得他說過的每一句話，還把他的書架仔細",["scrutinize","端詳"],"過，摸清他喜歡哪個作家。"],["家宴那晚，聶家老宅燈火輝煌，親戚們談笑",["raucous","喧鬧"],"。聶子豪是個",["pompous","自負浮誇"],"又",["pretentious","矯揉造作"],"的人，一見亦安就上下打量，接著冷笑當眾揭穿：\"爺爺，這人是哥花錢雇來的，我有轉帳紀錄！\"全場譁然。亦安心中一陣",["disquiet","不安"],"，聶衡卻沒有",["equivocate","含糊其詞"],"，只是握緊他的手。聶子豪趁勢加碼，指責聶衡用",["duplicity","兩面手法"],"欺騙長輩，人品卑劣不配繼承，一臉",["bravado","虛張聲勢"],"地等著看好戲。他向來有落井下石的",["proclivity","癖性"],"，這次更是有備而來。祖父臉色鐵青，那目光",["enigmatic","難以捉摸"],"，誰也猜不透。"],["聶衡站起身，聲音冷得讓整張餐桌結霜：\"錢，是我付的。但我付錢，是因為他不肯收我的心。\"他轉向聶子豪，丟出一疊文件：\"倒是你，去年",["embezzle","侵吞"],"了公司兩億，帳本我替你",["abridge","濃縮"],"好了，重點都在第一頁。\"聶子豪的",["cupidity","貪婪"],"被攤在陽光下，臉色瞬間慘白。祖父久經商場、極其",["sagacious","睿智"],"，憑著多年的商業",["acumen","敏銳"],"早看出端倪，當場收回孫子的職權，並嚴令任何人不得再替他求情。聶衡把亦安護在身後：\"我的人，輪不到你來審問。\""],["家宴散場，祖父竟把亦安叫到書房，態度出乎意料地",["benign","和藹"],"：\"那孩子從小跟我",["estranged","疏遠"],"，這是他第一次帶人回家。\"老人難得",["magnanimous","寬厚"],"，還拿出",["munificent","豐厚"],"的見面禮。回程車上，亦安終於問：\"你剛才那句話，是演的嗎？\"聶衡停下車，眼神",["scintillating","閃爍"],"得像星火：\"我這輩子不演戲。你是我人生的",["catalyst","催化劑"],"，讓我不再",["myopic","短視"],"，眼裡只有公司。合約作廢，換一份新的——終身的。\"亦安笑了，笑聲",["effervescent","輕快"],"，那個晚上就像一場",["alchemy","煉金術"],"，把一場假戲煉成了真心。聶衡低頭吻他：\"你逃不掉了。\""]],"nw":40},{"id":10,"title":"總裁與十年之約","paras":[["江若川二十八歲，白天在祁氏集團當資料管理員，夜裡抱著留學考試的單字本苦讀。十年前父親",["improvident","揮霍無度"],"，家道中落，他一度",["destitute","一貧如洗"],"到只能躲在一間",["obscure","不起眼"],"的市立圖書館取暖，空氣",["redolent","瀰漫"],"著舊紙張的氣味。那段日子在旁人口中只是一則",["anecdote","小故事"],"，對他卻是全部，是讓他沒有墜入",["nihilism","虛無主義"],"的唯一",["boon","恩賜"],"。他記得，當時有個",["precocious","早慧"],"的少年總坐在他對面，兩人用便利貼交換難字，還約好\"十年後一起考留學考試，一起出國\"。後來少年隨家人過著",["nomadic","漂泊"],"的生活，不告而別。若川始終",["steadfast","堅定不移"],"，一個人把約定守到現在。"],["祁氏總裁祁默是公司裡最難以捉摸的存在。他極少露面，說話",["oblique","拐彎抹角"],"，審核報告的標準卻極為",["stringent","嚴苛"],"。可他偏偏常在深夜出現在若川的座位旁，看他背單字，偶爾",["chide","責備"],"一句：\"這個字你又拼錯了。\"若川以為這是上司的刁難，所謂「指點」不過是刁難的",["euphemism","委婉說法"],"，私下卻忍不住好奇。有同事說總裁是商界的",["iconoclast","打破傳統者"],"，厭惡一切",["orthodox","正統"],"的規矩，推行",["egalitarian","平等"],"的管理；也有人說他",["abhor","痛恨"],"別人靠近。只有若川發現，祁默看他的眼神，總像在找什麼遺失的東西。"],["留學考試當天，若川才剛進考場，就被監考官攔下。有人匿名檢舉他夾帶",["illicit","違規"],"的小抄，而他的筆袋裡竟真的多了一張紙。始作俑者是同部門的杜維，一個",["boorish","粗魯"],"又愛",["exploit","利用"],"別人的人，早就嫉妒總裁對若川另眼相看。他自己對英文只是個",["dilettante","半吊子"],"，卻見不得別人努力。他竟也守在考場走廊，",["obstreperous","吵吵嚷嚷"],"地大喊，當眾",["excoriate","痛斥"],"若川，四處散布",["aspersion","中傷"],"，說他靠不正當手段爬上來。若川臉色",["livid","鐵青"],"，想要辯解，卻發現任何話都無法",["mitigate","減輕"],"眾人的懷疑，最後仍被要求立刻離場，十年的努力眼看就要付諸流水。"],["就在這時，一輛黑色轎車停在考場外。祁默大步走來，冷冷看著杜維：\"你在便利商店影印小抄的監視畫面，我已經交給考試中心了。\"他把手機遞給監考官，畫面的",["veracity","真實性"],"不容質疑。杜維還想",["cajole","哄騙"],"監考官，發表一段天花亂墜的",["impromptu","即興"],"辯詞，說這只是一場",["aberration","偶發失常"],"，祁默卻不給他半點餘地：\"我的人，誰准你碰？\"監考官當場撤銷指控，杜維被警衛帶走，想",["placate","安撫"],"眾人的笑容僵在臉上。祁默轉身，從口袋裡拿出一張泛黃的便利貼，上頭是若川十年前的字跡——\" ",["serendipity","意外的幸運"],"：遇見你\"。"],["若川愣在原地，眼眶一熱：\"原來是你。\"祁默的聲音難得不再",["stoic","克制冷靜"],"：\"那年我被家族帶走，這十年像一場漫長的",["hiatus","中斷"],"，我也曾",["vacillate","猶豫不決"],"要不要相認，怕自己會",["hinder","妨礙"],"你的人生。我回來，建了這間公司，只為了當你的",["bastion","堡壘"],"。\"他低聲",["beseech","懇求"],"：\"進去考吧。考完，我們一起出國，一起把剩下的單字背完。\"若川笑著點頭，眼淚卻掉了下來。考場鈴聲響起，祁默在他額頭落下一吻：\"去吧。不管你考幾分，我都在這裡等你——十年都等了，不差這一輩子。\""]],"nw":39},{"id":11,"title":"總裁的後台協奏曲","nw":37,"locked":1},{"id":12,"title":"總裁與大使的假面舞","nw":38,"locked":1},{"id":13,"title":"總裁的毒舌主編","nw":39,"locked":1},{"id":14,"title":"總裁與宿敵律師","nw":38,"locked":1},{"id":15,"title":"總裁與星空觀測站","nw":42,"locked":1},{"id":16,"title":"總裁的競圖之約","nw":36,"locked":1},{"id":17,"title":"總裁的午夜一小時","nw":36,"locked":1},{"id":18,"title":"總裁與他的男秘書","nw":37,"locked":1},{"id":19,"title":"總裁的贗品與真心","nw":34,"locked":1},{"id":20,"title":"總裁與圖書館之約","nw":38,"locked":1},{"id":21,"title":"總裁的學術死對頭","nw":31,"locked":1},{"id":22,"title":"總裁與首席談判官","nw":31,"locked":1},{"id":23,"title":"總裁的拍賣槌","nw":31,"locked":1},{"id":24,"title":"總裁與對席律師","nw":31,"locked":1},{"id":25,"title":"總裁與美術館館長","nw":31,"locked":1},{"id":26,"title":"總裁的思辨對手","nw":33,"locked":1},{"id":27,"title":"總裁的期刊主編","nw":34,"locked":1},{"id":28,"title":"總裁與歌劇院首席","nw":35,"locked":1},{"id":29,"title":"總裁與考古隊長","nw":30,"locked":1},{"id":30,"title":"總裁的私人圖書館","nw":35,"locked":1},{"id":31,"title":"總裁的調查官","nw":36,"locked":1},{"id":32,"title":"總裁的葡萄園","nw":30,"locked":1},{"id":33,"title":"總裁與競圖新人","nw":33,"locked":1},{"id":34,"title":"總裁的專利 cked":1},{"id":29,"title":"總裁的直升機坪","nw":40,"locked":1},{"id":30,"title":"總裁的極光求婚","nw":41,"locked":1},{"id":31,"title":"總裁的宋畫庫房夜","nw":35,"locked":1},{"id":32,"title":"總裁的條約特使","nw":37,"locked":1},{"id":33,"title":"總裁的合夥人敕令","nw":36,"locked":1},{"id":34,"title":"總裁的速寫簿證據","nw":38,"locked":1},{"id":35,"title":"總裁的穹頂壁畫師","nw":38,"locked":1},{"id":36,"title":"總裁的方言學者","nw":39,"locked":1},{"id":37,"title":"總裁的誹謗案記者","nw":37,"locked":1},{"id":38,"title":"總裁的銀壺匠人","nw":38,"locked":1},{"id":39,"title":"總裁的仲裁庭新娘","nw":38,"locked":1},{"id":40,"title":"總裁的老法院審判","nw":36,"locked":1}],"ielts":[{"id":1,"title":"總裁的替嫁真千金","paras":[["真千金被接回宋家的第三天，就被當成替身嫁了出去。她住的是傭人房，吃的是剩飯，連宋家的姓都像是勉強施捨給她的。假千金宋瑤不肯嫁給",["leg","腿"],"傷癱瘓、傳聞活不過今年的許靳言，養母便一臉",["contempt","輕蔑"],"：\"妳在外面吃了那麼多苦，嫁過去也算享福。\"宋清歡沒有哭，只覺得這一切",["absurd","荒謬"],"得可笑。她本是",["psychology","心理學"],"研究生，",["side job","副業"],"是經營一間小小的",["cupcake","紙杯蛋糕"],"店。她把店門口寫著",["open","營業中"],"的牌子翻了過來，平靜地坐上了婚車。"],["許家別墅冷清得可怕。許靳言坐在輪椅上，聽說他是在北極救人時嚴重",["frostbite","凍傷"],"，才廢了雙腿。他養了一隻",["parrot","鸚鵡"],"，那鳥一見她就喊\"笨蛋\"。宋清歡不惱，反而放起輕柔的",["ambient","氛圍"],"音樂讓他放鬆，用",["detailed","詳細的"],"復健計畫逼他每天練習。她每天推他到花園曬太陽，替他按摩僵硬的雙腿，一邊講店裡客人的趣事。他聽著聽著，嘴角竟有了弧度。他冷嘲：\" ",["theoretically","理論上"],"，妳不該對一個廢人這麼好。\"她雙手",["cup","捧住"],"他冰涼的手：\"那你也不該這麼早",["give up","放棄"],"。\"他愣住了，臉上露出",["rare","少見的"],"茫然。夜裡，他指著窗外的星：\"那是北極星，迷路的人靠它回家。\""],["聽說許靳言的腿有望康復，宋瑤後悔了。許氏",["enterprise","企業"],"週年晚宴上，她不請自來，當眾指著宋清歡胸前的",["gemstone","寶石"],"胸針：\"這是許老夫人留下的遺物，是許家的傳家寶！她偷的！\"養母也在旁幫腔，說宋清歡的身世是",["fake","假的"],"，真正該嫁進許家的人是宋瑤。宋瑤還故意抬高聲音，說宋清歡在外面流浪多年，手腳本來就不乾淨。賓客竊竊私語，宋清歡被眾人的目光淹沒，只能咬牙",["endure","忍耐"],"這份羞辱和",["sorrow","悲傷"],"。"],["宋清歡深吸一口氣，強迫自己",["concentrate","集中精神"],"，盯住宋瑤閃爍的眼神——學心理學的她一眼看出對方在說謊。就在此時，許靳言特地讓人帶來的",["parrot","鸚鵡"],"在籠中尖聲學舌：\"就說胸針是她偷的！快！\"那正是宋瑤前天上門\"探望\"時，躲在客廳講電話的聲音。全場死寂。下一秒，輪椅上的許靳言緩緩站起，",["roll","捲起"],"袖口，朝保全",["wave","揮手"],"示意：\"胸針是我送的。讓我",["introduce","介紹"],"一下，宋清歡，我唯一的妻子。誰",["invite","邀請"],"妳來的？\"宋瑤嚇得腿軟。許靳言冷笑：\"想在我的",["company","公司"],"鬧事，妳還不夠格。\"一場陰謀就此被",["thwart","粉碎"],"。養母慌忙想拉女兒離開，卻被保全攔下。當晚，宋家和許氏的所有合作全部取消。"],["回家的車上，宋清歡終於問：\"你的腿早就好了？\"許靳言點頭。三年前那場",["epidemic","疫情"],"，他在醫院門口",["encounter","遇到"],"了一個免費給醫護送蛋糕的女孩，她那顆",["caring","體貼"],"的心和毫不張揚的善意，深深",["intrigue","吸引"],"了他。後來他在北極被冰冷的",["current","海流"],"捲走，差點丟了",["life","性命"],"，撐下去的念頭只有一個：回來找她。\"替嫁這件事，是我安排的。\"他低聲承認，\"我",["resist","抗拒"],"不了想見妳的心。\"他吻了吻她的指尖：\"我想換個",["occupation","職業"],"——當妳一輩子的丈夫。\"宋清歡紅了臉，輕聲說：\"准了。\"窗外的北極星，亮得耀眼。"]],"nw":35},{"id":2,"title":"總裁的亡妻回來了","paras":[["三年前的婚禮前夜，景安然死於一場",["car accident","車禍"],"，車子墜入海中，屍骨無存。從那天起，薄靳言就像變了一個人：冷血、寡言，身體也日漸",["deteriorate","惡化"],"，整座薄氏",["skyscraper","摩天大樓"],"裡，沒人敢在他面前提起那個名字。直到集團週年的",["festive","喜慶的"],"晚宴上，",["board","董事會"],"新聘的首席策略",["advisor","顧問"],"走上台。燈光亮起，喧鬧的宴會廳一下子變得",["quieter","安靜許多"],"，所有人都盯著那張臉——是景安然。她微笑伸出手：\"薄總，初次見面，我叫安娜。\""],["薄靳言死死盯著她，眼底的猩紅一點點",["deepen","加深"],"。晚宴後，他在停車場",["accost","攔住"],"她，嗓音",["low","低沉"],"得可怕：\"妳以為換個名字，我就認不出來？\"她神色淡然地",["retort","反駁"],"：\"薄總認錯人了。我在國外經營一座",["winery","酒莊"],"，這次回國只為工作。\"可他分明聽見她轉身時輕輕",["sigh","嘆"],"了口氣，輕得幾乎聽不見。那是她從前每次心軟時的習慣。"],["真正的危險藏在暗處。薄靳言同父異母的弟弟薄靳川，在宴會上毫不掩飾地",["ogle","色瞇瞇打量"],"她，私下卻警告她：\"準嫂子，三年前妳命大，這次可沒那麼好運。\"原來那場車禍根本不是意外——是薄靳川在煞車壓力",["regulator","調節閥"],"上動了手腳。她在墜海前跳車，被漁民救起，隔天一場",["hurricane","颶風"],"抹去所有痕跡。這三年，她以",["persistence","毅力"],"和",["intelligence","智慧"],"暗中蒐證，就是為了這一天。她太了解薄靳言了，若早讓他知道，他會不計",["cost","代價"],"衝去拚命，而她不能讓他受到任何",["harm","傷害"],"。"],["決戰在董事會上。薄靳川指控\"安娜\"是商業間諜，要求罷免她。她不慌不忙，播放一段",["audio","錄音"],"：正是三年前他與修車廠的通話。全場譁然。她又亮出一份股權文件：這三年，她用酒莊的收益悄悄買進薄氏百分之十五的股份，如今是第二大股東。剛才還附和薄靳川的董事們，紛紛低下了頭。而全部證據，她早已送交警方，警察此刻就等在門外。薄靳川惱羞成怒，衝上前要",["grab","抓住"],"她的手腕，一道身影比他更快。薄靳言把她拉到身後，一字一句：\"我",["despise","鄙視"],"你這種人。動她，你付不起這個",["price","代價"],"。\"他回頭看她，眼眶通紅：\"我的女人，死過一次，就夠了。\""],["那晚，他",["drive","開車"],"載她回到兩人初遇的海邊小火車",["station","站"],"，再走到熟悉的",["beach","沙灘"],"。她從包裡拿出一個小蛋糕，那是她的",["specialty","拿手甜點"],"：草莓",["cream","奶油"],"抹面，淋上雪白的",["icing","糖霜"],"，上面",["stick","插著"],"一根小蠟燭。\"三年前，我們沒能一起過你的生日。\"這個在商場上從不低頭的男人，終於",["bend","彎下"],"身，把頭埋在她肩上，壓抑地",["sob","啜泣"],"，像個迷路太久的孩子。她輕輕為他擦去眼淚：\"薄靳言，這三年我不是在躲你，是在用我的方式保護你。從今以後，我們是",["equal","平等的"],"——你護我，我也護你。\"海風溫柔，他終於學會",["unwind","放鬆"],"，捧起她的臉：\"這是我等了三年的",["answer","答案"],"。這一次，就算天塌下來，我也不會再放開妳。\"他吻住她，海浪替他們說完了剩下的誓言。"]],"nw":36},{"id":3,"title":"總裁的同學會邀約","paras":[["十年同學會的",["venue","場地"],"訂在全市最貴的酒店，景書瑤推門進去的瞬間，包廂安靜了一秒。\"喲，這不是我們的學霸嗎？\"當年的班花周婷",["snort","嗤笑"],"一聲，把",["menu","菜單"],"推到她面前，\"聽說妳現在在山上養流浪貓？妳那個",["retired","退休的"],["taxi driver","計程車司機"],"老爸，現在靠妳養吧？\"眾人鬨笑。景書瑤神色平靜，她是研究",["ancient","古老的"],"植物的",["biologist","生物學家"],"，也在郊區經營一間動物",["shelter","庇護所"],"，早就不在乎這些人怎麼看她。只是有件事很",["strange","奇怪"],"：十年來，那個人從沒出現過。"],["那個人叫時遠舟，是高中時最沉默的",["introvert","內向的人"],"。他家境清寒，靠",["self-study","自學"],"考進資優班，總被周婷一夥人欺負。只有景書瑤會擋在他前面，像個小小的守護者，還把自己用",["oven","烤箱"],"烤的餅乾分給他。後來在",["annual","年度"],"模擬考中，兩人答題",["accuracy","準確率"],"都是百分之百，周婷卻檢舉他們作弊，時遠舟被迫轉學，從此再無音訊。那件事像幽靈一樣",["haunt","糾纏"],"了景書瑤很多年。她一直很",["miss","想念"],"那個安靜的少年，卻始終沒等到他的一通電話。"],["酒過三巡，周婷故意打翻紅酒，潑在景書瑤的白色",["coat","外套"],"上：\"哎呀，反正是便宜貨。\"同學們有的別過頭，有的偷偷拿手機拍照，等著看她出糗。景書瑤抽出紙巾，淡淡地說：\"周婷，十年了，妳還是只會這一招。\"周婷得意地宣布，今晚還有一位神秘貴賓，是她正在\"接觸\"的上市公司總裁。話音剛落，一輛加長",["limousine","豪華轎車"],"停在門口。走進來的男人高大冷峻，西裝筆挺——竟是時遠舟。周婷立刻迎上去：\"遠舟，你還記得我嗎？\"時遠舟眼神",["indifferent","冷漠"],"，越過她，徑直走到景書瑤面前，脫下自己的大衣披在她肩上：\"誰准妳穿著濕衣服坐在這裡？\""],["全場鴉雀無聲。時遠舟示意助理播放一段錄音，當年偷換答案卷、誣陷兩人作弊的",["mastermind","幕後主使"],"，正是周婷。他冷冷",["reveal","揭曉"],"：\"這家酒店是我的，今晚的帳單也是。至於周小姐，妳父親公司的貸款，明天會被全數抽回。\"周婷臉色慘白，手中的筷子啪地",["snap","折斷"],"。接著他又宣布，以景書瑤的名義向她的庇護所和研究室",["donate","捐贈"],"一筆",["generous","豐厚的"],"款項，讓流浪貓有家，她的植物研究也不再因",["scarce","短缺的"],"經費而停擺。包廂裡爆出",["thunderous","雷鳴般的"],"掌聲，周婷被迫低頭",["acknowledge","承認"],"自己的錯。時遠舟環視眾人，聲音不大，卻字字清晰：\"從今天起，誰再動她一根頭髮，就是跟時氏為敵。\""],["散場後，兩人回到她山上的小屋。一隻橘貓跳上",["sofa","沙發"],"，衝他",["meow","喵了一聲"],"。時遠舟從懷裡拿出一本泛黃的",["first edition","初版"],"詩集，那是她十七歲送他的生日禮物。\"妳的電話號碼，我",["memorize","記住"],"了十年，卻怕打過去，妳已經屬於別人。\"他有些",["sheepish","靦腆"],"地笑，\"我知道妳很",["independent","獨立"],"，也知道妳的",["stubbornness","固執"],"。但",["reality","現實"],"是，我這輩子只想對妳一個人好。\"她踮起腳緊緊",["hold","抱住"],"他：\"那下週我爸的",["check-up","體檢"],"，你陪我去。\"他低頭吻她：\"遵命，時太太。\""]],"nw":37},{"id":4,"title":"總裁的契約畫家","paras":[["簽下婚約的那一刻，喬念才發現，自己嫁的是全",["city","城市"],"最令人畏懼的",["dictator","獨裁者"],"。傅景深身形",["tall","高大"],"，站在落地窗前冷冷",["scowl","皺眉"],"，把合約推到她面前：\"一年",["term","期限"],"，妳扮演傅太太，我替妳償清債務。別",["naive","天真"],"到以為我會愛上妳。\"喬念是醫院",["pediatric","兒科"],"病房的壁畫",["painter","畫家"],"，為了弟弟的手術費，她只能點頭。她不知道的是，男人桌上",["pile","堆"],"著的資料裡，夾著一張她十年前畫的",["miniature","小幅"],"水彩——那是他在",["trauma","創傷"],"最深的夜裡，唯一留下的東西。"],["婚後生活比想像中",["serene","平靜"],"。傅景深每晚準時回家，嘴上嫌她",["lazy","懶"],"，卻默默把她的畫室搬進一棟",["coastal","海邊"],"別墅，那是由舊燈塔",["converted","改造"],"而成的工作室，海風鹹鹹的。她在陽台寫生曬出",["sunburn","曬傷"],"，他一邊冷著臉替她擦藥，一邊說：\"誰准妳傷害我的人？就算是太陽也不行。\"他有嚴重的",["migraine","偏頭痛"],"，她就替他按摩太陽穴，還把他的咖啡",["ration","限量"],"成一天一杯。傅景深盯著她看了很久，低聲說：\"女人，妳是第一個敢管我的人。\"那一刻，她的心跳亂了節拍，卻告訴自己：這只是一場交易。"],["好景不長。傅父的",["memorial","追思會"],"那天，傅家二叔傅成安排了一場",["live","直播"],"記者會，把喬念推到",["spotlight","聚光燈"],"下：\"這女人用",["fraudulent","造假"],"的畫作騙錢，頂著豪門太太的名頭招搖撞騙！\"他甩出一份鑑定報告，聲稱她賣出的畫全是贗品。閃光燈此起彼落，網友罵聲一片。有人翻出她的出身，說她是靠心機攀上高枝的灰姑娘，畫廊也連夜撤下她所有作品。傅家長輩要求立刻離婚，二叔冷笑著看向侄子：\"景深，你竟然還",["accompany","陪同"],"她出席？你的眼光，這次徹底失準了。\""],["喬念沒有哭。她平靜地走上台，請工作人員把投影儀重新",["calibrate","校準"],"：\"顏色差一度，真相就差一里。\"她放大畫作簽名旁的筆觸，冷靜地用",["math","數學"],"計算顏料層的厚度比例，證明所謂贗品，其實是二叔請人臨摹、再反咬她的假貨。全場譁然。她又說出那個",["dormant","沉寂"],"多年的筆名——念。原來，她正是畫壇那位神秘",["talent","奇才"],"。二叔臉色慘白，還想狡辯，傅景深已經起身，把她護在身後：\"我的人，誰敢動？\"他把一疊證據摔在桌上，二叔挪用公款的帳目全被公開，警方表示將全面",["pursue","追查"],"。二叔被押走前還在叫囂，傅景深只淡淡回了一句：\"傅家的門，從今天起不歡迎你。\""],["風波過後，喬念把離婚協議放到他桌上：\"一年快到了，傅總，我不想再",["wait","等待"],"你的答案。\"傅景深卻把協議撕得粉碎。他第一次拿出全部的",["honesty","坦誠"],"：十年前那場車禍，他在",["life and death","生死"],"之間徘徊，是兒科病房裡一個小女孩送他那幅畫，畫上寫著\"別放棄\"。他找了她十年，用這份契約把她留在身邊，只為",["cultivate","培養"],"一點點她對他的感情。\"我",["disregard","忽視"],"過全世界，唯獨沒辦法忽視妳。妳的",["virtue","美德"],"和",["loyalty","忠誠"],"，讓我把一紙合約",["convert","轉變"],"成一輩子。\"喬念紅了眼，踮腳吻上他：\"那這次，換我說了算。\""]],"nw":36},{"id":5,"title":"總裁的閃婚營養師","paras":[[["typhoon","颱風"],"登陸那天，許晴在戶政事務所門口，和一個只認識二十分鐘的男人閃婚了。她是醫院的",["nutritionist","營養師"],"，被家裡逼婚逼到",["breaking point","崩潰邊緣"],"；他自稱剛從華爾街失業回國，名叫江硯舟，渾身透著",["coldness","冷漠"],"。登記完，他把一枚素圈戒指隨手丟給她，連一句好聽的話都沒有。\"我們各取所需，\"他說，\"給彼此三個月",["probation","試用期"],"。\"許晴咬著",["lip","嘴唇"],"點頭，心想這男人雖然窮，卻有一張",["uncommon","少見的"],"俊臉。"],["婚後，她天天替他做便當，嫌他只喝黑咖啡：\"你再這樣下去，連",["breathing","呼吸"],"都會累。\"他嘴上嫌煩，卻把便當吃得一粒米不剩。週末他陪她去看",["immersive","沉浸式"],"光影展，她指著投影裡的",["rainbow","彩虹"],"說像小時候；他偷偷用老相機拍下她的側臉，那卷",["film","底片"],"一直沒捨得沖洗。夜裡他靠在她肩上",["rest","休息"],"，手裡的",["book","書"],"好半天沒翻一頁。她朝他",["wink","眨眼"],"，他耳根瞬間紅透。她不知道，每天來接她的破車，一開過轉角就換成了勞斯萊斯。"],["好景不長。醫院附設的",["diner","簡餐店"],"爆出",["lead","鉛"],"中毒事件，承包餐飲的正是某集團旗下的",["subsidiary","子公司"],"。供應商千金林薇當眾把責任推給許晴：\"配餐單是她簽的！\"院方立刻把她調離崗位，同事們開始",["marginalize","排擠"],"她，甚至有人逼她向家屬",["bow","鞠躬"],"認錯。許晴挺直背脊：\"沒做過的事，這份",["shame","恥辱"],"我不背。\"林薇還在網上帶風向，罵她是想攀高枝的騙子，連她母親都打電話來哭著叫她認錯。可回到家，她一個人坐在黑暗裡，第一次感到",["desperation","絕望"],"——原來在這座城市，她始終",["alone","孤單"],"一人。"],["但許晴不是會認輸的人。她熬了三個通宵化驗樣本，終於取得",["breakthrough","突破"],"：毒素來自林家新進的廉價鍋具，而非她的配方。調查會上，林薇還想反咬，大門卻被推開，所有高層齊齊起身——走進來的，正是集團總裁江硯舟。許晴愣住了。原來那個每天吃她便當、連悠遊卡都要跟她借的男人，竟是這家集團真正的主人。林薇雙腿一軟，臉色慘白：\"江總，我不知道她是……\"男人一步步走到她身邊，冷聲道：\"我早就",["see through","看穿"],"妳的把戲。林家的合約全部終止，受害者的",["compensation","賠償金"],"由江氏全額承擔。\"他把許晴攬進懷裡，\"從今天起，誰對她不夠",["respect","尊重"],"，就是跟我作對。\""],["許晴氣得三天不理他。第四天，他帶她到郊外牧場，馬兒在夕陽下",["neigh","嘶鳴"],"，遠方的",["horizon","地平線"],"被染成金紅色。\"母親說我是孤獨的",["navigator","航海者"],"，一直在找能靠岸的港口。\"他低聲說，\"我隱瞞身分，是想知道有沒有人愛的是我，不是錢。妳像石縫裡的",["weed","野草"],"，再難也長得倔強。\"他拿出一枚戒指，",["gem","寶石"],"裡有天然的金色",["vein","紋路"],"：\"它不張揚，但很",["durable","耐用"],"。試用期提前結束，我想參與妳往後的每一天。\"許晴哼了一聲：\"你的",["worth","價值"],"，我還得重新評估。\"他低笑著吻住她：\"那就重新開始，這次我們站在同一條",["starting line","起跑線"],"。我會",["always","永遠"],"在。\""]],"nw":36},{"id":6,"title":"總裁的替嫁新娘","paras":[["婚禮前一夜，繼母把一疊",["cash","現金"],"甩在江疏月臉上：\"妳妹妹不能嫁給那個",["deaf","耳聾"],"的丈夫，妳替她嫁。\"誰都知道，宋氏",["consortium","財團"],"的繼承人宋聿白一場意外後聽力全失，被族人推到了",["sideline","邊緣"],"。江疏月",["look down","低頭"],"看著散落一地的鈔票，只說了一句：\"我嫁，但從此我的",["future","未來"],"與江家無關。\"她不屑",["explain","解釋"],"，也懶得聽繼母",["nag","嘮叨"],"，拎著一只舊行李箱就走進了宋家。宋家派來的車停在巷口，司機連行李都不肯替她提，眼裡滿是輕視。"],["新婚夜，男人坐在窗邊靜靜",["read","看書"],"，連眼皮都沒抬。江疏月倒了一杯",["mineral water","礦泉水"],"放到他手邊，用手語比著：\"我叫江疏月，不是我妹妹。\"宋聿白終於看了她一眼，那眼神和傳聞中的",["different","不一樣"],"。她白天在一間小事務所做",["financial","財務"],"審計，晚上回家替他準備",["snack","點心"],"。某天翻文件時，她的指尖被劃出一道",["paper cut","紙割傷"],"，他沉默地替她貼上一片小繃帶。第二天，她指尖的",["swelling","腫脹"],"已經消了，桌上卻多了一整盒進口藥膏。那晚她才發現，這個沉默的男人，似乎比任何人都更早看穿她的委屈。"],["宋家二叔宋鈞早就虎視眈眈。董事會上，他聯合股東",["outvote","投票否決"],"了宋聿白的提案，又在家族",["yacht","遊艇"],"晚宴上當眾羞辱江疏月：\"一個",["ordinary","普通"],"的替嫁貨色，也配坐主位？\"妹妹江夢瑤也來了，挽著二叔冷笑：\"姊姊，妳那點審計的",["gimmick","花招"],"，在這裡沒人看得上。\"賓客們紛紛轉頭看她，有人掩嘴偷笑，有人舉起手機拍攝，等著看替身新娘出醜。衝突不斷",["escalate","升級"],"，二叔甚至放話要",["sue","起訴"],"江疏月騙婚。宋聿白坐在一旁，安靜得像聽不見任何聲音。"],["江疏月沒有退縮。她把一份報告投上大螢幕：\"二叔，你挪用新藥",["trial","試驗"],"的",["funding","資金"],"，轉進境外帳戶，名單",["include","包括"],"你的三家空殼公司。\"身為",["seasoned","老練的"],"審計師，她的數據",["authoritative","權威"],"又精確，每一筆都是",["potent","有力"],"的鐵證。股東們面面相覷，剛才倒向二叔的幾人悄悄把椅子往後挪。二叔暴跳如雷：\"一個替身，誰會",["trust","信任"],"妳？\"就在這時，宋聿白緩緩起身，聲音清冷：\"我信。\"全場死寂——他根本不是聾子。\"我裝了三年，就是等你派人",["infiltrate","潛入"],"公司，自己露出馬腳。\"他看向江疏月，\"妳是這場局的",["catalyst","催化劑"],"。想動她之前，先問過我。\""],["二叔被帶走那天，江夢瑤哭著求姊姊原諒。江疏月只說：\"妳的",["cowardice","懦弱"],"，不該由我來買單。\"江夢瑤從此在名流圈裡再也抬不起頭。聖誕夜，街角飄來",["carol","聖誕歌"],"，宋聿白把她圈在懷裡：\"三年前我出事陷入",["peril","危險"],"，是一個陌生女孩跳進河裡把我拖上岸。我找了很久——那個",["guardian angel","守護天使"],"就是妳。\"原來婚禮換人，他早就知道，甚至是他默許的。\"妳的",["determination","決心"],"，讓我不想再裝了。\"江疏月笑他心機深，他低頭吻她額角：\"我的情緒只有一個",["outlet","出口"],"，就是妳。從今往後，妳不必為誰變成另一個人，我會",["cherish","珍惜"],"原本的妳。現在，陪我回家吃飯。\""]],"nw":37},{"id":7,"title":"總裁的假面女友","paras":[["凌晨三點的",["convenience store","便利商店"],"，許庭川戴著",["noise-canceling","降噪"],"耳機走進來，丟下一句話：\"當我女朋友三個月，價錢妳開。\"她身上那件洗得發白的制服，和他腕上的名錶格格不入，卻偏偏讓他一眼就挑中了她。喬安正在",["boil","煮"],"關東煮，抬頭打量這個西裝筆挺的男人。她",["accidentally","無意間"],"撞見過他在停車場被家人逼婚——許家奶奶",["sick","生病"],"了，最大的心願就是看孫子成家。喬安想了想：\"不收錢。我們",["barter","以物易物"],"，你幫我一個忙。\"許庭川挑眉：\"女人，敢跟我談條件，妳是第一個。\""],["假扮情侶比想像中難。奶奶要他們每週回老宅吃飯，還親自教喬安",["flower arrangement","插花"],"。許庭川剝",["mango","芒果"],"給她吃，她",["bite","咬"],"了一口，汁水沾在嘴角，他竟看得愣住。他長年",["overwork","過勞"],"，夜裡常有",["constant","持續的"],"頭痛，她就放",["soothing","舒緩"],"的音樂，輕聲哼歌。他說她的",["voice","聲音"],"像夏夜的風。奶奶看在眼裡，笑得合不攏嘴，私下拉著喬安說：\"這孩子從小冷冰冰的，只有在妳面前才像個人。\" ",["full moon","滿月"],"那晚，他在庭院裡低聲說：\"這場戲，我好像入戲了。\""],["一個月後，許庭川的前未婚妻沈曼",["resurface","重新出現"],"。她父親是知名",["developer","開發商"],"，覬覦許家老宅那塊地很久了。慈善晚會在",["prime time","黃金時間"],"直播，貴賓休息室裡，沈曼突然尖叫：\"奶奶的",["platinum","鉑金"],"項鍊不見了！那是許家的傳家寶！\"保全在喬安包裡翻出項鍊，鏡頭全對準了她。直播彈幕瘋狂刷屏，罵她是貪財的騙子，許家股價應聲下跌，連奶奶都急得臉色發白。沈曼冷笑：\"一個",["convenience store","便利商店"],"的店員，演什麼豪門女友？\"有人想",["force","強迫"],"她當眾下跪道歉，喬安卻沒有",["step back","後退"],"半步。"],["喬安舉起項鍊，在燈下看了三秒：\"這條是假的。\"她當場",["appraise","鑑定"],"，指出真鉑金不會在刮痕裡殘留黑色",["soot","煤灰"],"，這種殘渣只來自地下熔煉作坊——有人調了包，再把假貨塞進她包裡。\"我是珠寶鑑定協會的",["undercover","臥底"],"調查員，追查沈家仿冒工廠半年了。\"她",["superb","精湛"],"的專業眼光讓全場嘩然。沈曼轉身想跑，許庭川一聲\" ",["stop","站住"],"\"，保全立刻攔住了門。他把喬安護在身後：\"想動她，先過我這關。\"警方隨後在",["conference room","會議室"],"裡取得口供，所有",["truth","真相"],"一一揭開。沈家的仿冒工廠當晚就被查封，沈父經營多年的建設公司股價一夜崩盤。"],["戲落幕了，喬安回老宅收拾行李準備離開。許庭川把她堵在門口：\"誰准妳走了？\"他說起一段",["memory","記憶"],"：小時候在鄉下，一個拿著",["slingshot","彈弓"],"的小女孩趕走野狗，",["save","救"],"了他。後來他被接回城裡，再也找不到那個女孩，直到在便利店的燈光下重新遇見她。\"妳手腕上那道疤，我第一眼就",["discern","認出"],"來了。\"這時，一直喊著病重的奶奶竟從沙發上",["stand up","站起來"],"，笑咪咪地說醫生早查過，她的病根本不是",["organic","器質性"],"問題，只是想撮合他們。喬安又好氣又好笑。許庭川握住她的手：\"我沒辦法",["prevent","阻止"],"自己愛上妳。我",["look forward to","期待"],"每個有妳的明天——妳",["ready","準備好"],"了嗎？\"她笑著吻上他：\"早就好了。\""]],"nw":36},{"id":8,"title":"總裁的同居花藝師","paras":[["為了",["grandfather","祖父"],"的遺囑，江承野不得不和一個陌生女人協議同居一百天。宋檸拖著行李站在玻璃",["dome","穹頂"],"花房前，戴著一頂舊",["sunhat","遮陽帽"],"，語氣",["bold","大膽"],"：\"江總，房租我照付，規矩你定。\"江承野當場訂下三條規矩：不准進他書房，不准碰他的東西，不准愛上他。宋檸笑著全部答應，轉頭就把一盆向日葵擺在了他書房門口。江承野冷眼看她：\"兩家祖輩有",["grudge","恩怨"],"，妳最好別打什麼主意。\"他不知道，這女人正是想把他打算拆掉的老",["bazaar","集市"],"重新",["revitalize","振興"],"的花藝師——而接下來的一百天，她就住在他書房的走廊對面。"],["同居的日子雞飛狗跳。她用",["deft","靈巧"],"的手指修剪",["stem","花莖"],"，他嫌她吵；她拉他晨間",["exercise","運動"],"，他抱怨時間寶貴。",["rainy","下雨"],"的夜裡他",["stomach","胃"],"痛，她煮了熱粥，動作",["tender","溫柔"],"；他嘴上嫌棄，卻一口不剩。某天她在客廳隨音樂",["dance","跳舞"],"，",["laughter","笑聲"],"灑滿整間屋子。她把他冷冰冰的灰色客廳，一點一點佈置成了花園。江承野靠在門邊看了很久，忽然覺得這女人",["gorgeous","美"],"得過分。\"宋檸，\"他聲音低啞，\"妳成功打亂了我的生活。\""],["宋檸籌備已久的花藝",["exhibit","展覽"],"開幕前夜，所有花材一夜枯萎。現場被大批",["press","媒體"],"包圍，江承野的堂弟江浩搶先爆料：宋檸出身",["poverty","貧寒"],"，為了錢才搬進江家，網上的流言",["disturbing","令人不安"],"，惡意得讓人心寒。有記者把麥克風戳到她面前：\"請問妳是不是靠同居上位？\"江承野正在國外出差，手機打不通，她只能獨自面對所有的惡意。有人往她身上丟爛掉的花瓣，嘲笑她是江家養的金絲雀。宋檸其實很",["scared","害怕"],"，指尖都在發抖，卻沒有",["shrink","退縮"],"：\"給我一小時。\""],["她蹲下來，在花莖切口找到",["clue","線索"],"：一股刺鼻的",["bleach","漂白劑"],"味。她用園藝",["tool","工具"],"取樣，",["adjust","調整"],"燈光拍照存證，又沿著監視器畫面一路追到後巷，正好撞見江浩的助理從通風口",["crawl","爬"],"出來。真相大白：江浩",["divert","挪用"],"公款打點拆遷，還想嫁禍給她。他還想狡辯，大螢幕卻亮起——原來宋檸正是國際知名的",["legendary","傳奇"],"花藝師，再也沒有人能質疑她。江承野穿過人群走來，沒有多餘的",["word","言語"],"，只把外套披在她肩上，回頭冷冷道：\" ",["implement","推行"],"你的計畫之前，你該先問問她是誰的人。\"江浩被保全押走時，連頭都不敢抬。"],["一百天期滿，宋檸收拾好行李。江承野卻擋在門口，遞給她一份新文件：\"老市集不拆了，交給妳振興。\"她愣住。他低聲說：\"我曾經",["err","犯錯"],"，以為兩家之間只剩恩怨。是妳讓我卸下冷漠的",["facade","表象"],"。現在我看到任何一朵花，腦中唯一的",["association","聯想"],"就是妳。那一百天裡，我每天最期待的，就是推開門看見妳站在花叢裡回頭笑。\"他的眼神前所未有地",["affectionate","深情"],"，\"同居協議到期了，我們換一份——期限是一輩子。\"宋檸笑出聲，踮起腳吻他：\"這份，我簽。\""]],"nw":35},{"id":9,"title":"總裁與電台情人","paras":[["四月的山上竟下起",["snowstorm","暴風雪"],"，許星禾的車在半路發生",["breakdown","故障"],"。她是深夜",["radio","電臺"],["program","節目"],"的主持人，也是不紅的",["novelist","小說家"],"。敲開唯一亮燈的山屋時，開門的男人穿著黑色羽絨",["vest","背心"],"，眼神冷得像冰：\"出去。\"下一秒，他看見她凍得發紫的手，還是側身讓她進門。那一夜，他把唯一的毛毯丟給她，自己在壁爐邊坐到天亮，一句話也沒說。第二天清晨，狗仔",["photograph","拍到"],"兩人一起走出山屋，標題寫著：航太集團總裁喬墨言的秘密情人。"],["喬墨言找上電台，語氣",["firm","堅定"],"：\"假扮我女朋友半年，平息緋聞。\"許星禾正要拒絕，他補了一句：\"我公司的衛星即將進入",["orbit","軌道"],"，股價經不起任何風波。\"她想了想：\"成交，但你要上我的節目當訪談",["subject","受訪者"],"。\"於是冷面總裁第一次別上嘉賓",["name tag","名牌"],"，坐在直播間裡",["nervous","緊張"],"得握緊水杯。她憋著笑：原來他也有這麼",["cute","可愛"],"的時候。他聽著節目片尾的",["music","音樂"],"，低聲說：\"妳的聲音，讓我失眠的夜晚變得很短。\"節目播出後收聽率暴漲，網友紛紛喊著要嗑這對冰山與暖陽的組合。"],["衛星發射前夕，競爭對手陳家千金陳嫣在發表會上發難。她舉著一本書：\"許星禾的新小說抄襲我！\"還拿出逐段比對截圖，全場譁然。陳嫣笑得輕蔑：\"一個",["lowly","卑微"],"的電台主持人，靠假戀愛炒作，還想當作家？\"網路一夜炸鍋，出版社撤書，她向平台提出",["appeal","申訴"],"也被駁回。這一擊幾乎是",["lethal","致命"],"的。有人逼她公開道歉，甚至要她向陳家",["grovel","卑躬屈膝"],"。她最心愛的小說被說成偷來的東西，深夜的節目裡，她第一次哽咽到說不出話。喬墨言卻一連三天沒有出現。"],["許星禾沒有道歉。她熬到",["dawn","黎明"],"，",["decode","破解"],"雲端",["database","資料庫"],"裡每份手稿的時間戳記，證明初稿比陳嫣早了整整兩年。她還請來數位鑑識",["expert","專家"],"，以及兩年前就讀過初稿的一位",["psychiatrist","精神科醫生"],"讀者出面作證。記者會上，證據完整得無可辯駁，喬墨言也到了。原來那三天，他一直在替她追查陳嫣買通的寫手。陳嫣惱羞成怒推了她一把，她的手臂撞上桌角流了血。喬墨言大步上前，親手替她",["bandage","包紮"],"，抬頭時眼神冰冷：\"抄襲的人是妳。陳氏與我們的所有合作，到此為止。我的女人，不需要向任何人低頭。\""],["衛星順利進入預定軌道，控制中心一片",["excitement","興奮"],"，歡呼聲四起。喬墨言卻轉身走向她，在她手腕",["tie","綁"],"上一條",["blue","藍色"],"緞帶。\"那晚的暴風雪不是偶然。\"他",["earnest","真誠"],"地看著她，\"三年前我母親過世，她是",["paramedic","急救員"],"，倒在救人的路上。那段日子，妳的節目是我",["sole","唯一"],"的光。我上山，是為了找那個聲音的主人。\"許星禾怔住。他低聲說：\"這半年只是試用期。我想",["fulfill","履行"],"的，是一輩子的承諾。\"她露出",["smile","微笑"],"，他",["loving","深情"],"地吻下來：\"這一次，不用假扮了。\"控制中心的工程師們全都在起鬨鼓掌。"]],"nw":33},{"id":10,"title":"總裁的冰島閃婚","paras":[["在冰島的",["airport","機場"],"，江晚拖著行李衝向",["boarding","登機"],"口，迎面和一個男人",["collide","撞上"],"，咖啡潑了他一身",["designer","名牌"],"西裝。男人嗓音",["hoarse","沙啞"],"：\"賠。\"她翻遍錢包只有幾枚硬幣。男人看著她，忽然",["matter-of-fact","一本正經"],"地說：\"那就嫁給我。我",["grandma","奶奶"],"的",["diagnosis","診斷"],"出來了，她只想看我結婚。\"江晚以為他瘋了，可暴雨引發",["flood","洪水"],"，所有航班停飛。登記處的工作人員看著兩個陌生人，忍不住問了三次是不是真的確定。滯留的四十八小時裡，她竟真的和這個叫傅寒川的男人，在當地登記閃婚。"],["回國後，江晚才知道傅寒川是",["national","全國"],"晶片龍頭的總裁、業界的",["legend","傳奇"],"，而她只是對手公司裡一個不起眼的小工程師。傅寒川白天冷若冰霜，晚上卻帶她登上頂樓看城市",["panorama","全景"],"。萬家燈火",["illuminate","照亮"],"了夜空，她",["sip","啜飲"],"著熱可可，不自覺地",["lean","倚靠"],"在他肩上。他說話依舊",["severe","嚴厲"],"，卻總用冷漠",["mask","掩飾"],"自己的溫柔。她原本只打算等奶奶病情穩定就離婚，可每當夜深人靜，他總會替她留一盞燈，熱好一杯牛奶。\"江晚，\"他低聲說，\"妳笑起來的樣子，",["luminous","光彩照人"],"得讓我看不見別人。\""],["好景不長。她的上司周振發現了這段婚姻，立刻",["blackmail","要挾"],"她：\"把傅氏新一代",["chip","晶片"],"的設計圖帶回來，否則我就公開妳竊取公司機密的證據。\"這是一筆骯髒的",["transaction","交易"],"。江晚拒絕後，周振在產業峰會上當眾",["mock","嘲笑"],"她：\"傅總，你的新婚妻子可是我們派去的商業間諜！\"輿論把她當成",["target","箭靶"],"，傅氏股價應聲下跌，董事們要求傅寒川立刻離婚。曾經稱她為天才的同事紛紛和她劃清界線，有人扒出她的住址，還把她的照片做成梗圖。她一個人坐在空蕩蕩的辦公室裡，手指冰涼。"],["江晚眼神",["fierce","凌厲"],"，一步步走上台：\"周總，你太",["underestimate","低估"],"我了。\"她早有準備，先播放周振勒索她的錄音，又亮出一份專利文件——那款讓周家起家的晶片架構，正是她大學時",["apply","申請"],"的專利，被周振盜用多年。全場譁然，周振臉色慘白，只能",["admit","承認"],"罪行。被帶走時，他還不甘心地回頭瞪著她。傅寒川起身走到她身旁，語氣冰冷：\"我太太行得正，一切都能",["transparent","公開透明"],"地攤在陽光下。倒是你，身為",["competitor","競爭對手"],"，手段太難看了。\"當天收盤，傅氏股價不跌反漲。"],["蜜月航班緩緩",["descend","降落"],"，窗外又是冰島的雪原。江晚瞇起眼：\"在機場撞上你，真的是巧合？\"傅寒川沒有否認。原來他早就知道她要搭哪班飛機。二十年前，社區",["playground","遊樂場"],"裡，一個小女孩把唯一的糖分給了哭泣的他。\"我找了妳很多年。在妳面前，我總是毫無防備。\"他握緊她的手，\ ":1},{"id":16,"title":"總裁與潑酒稽核","nw":10,"locked":1},{"id":17,"title":"總裁與遺產律師","nw":10,"locked":1},{"id":18,"title":"總裁與考古學者","nw":10,"locked":1},{"id":19,"title":"總裁與漁村律師","nw":10,"locked":1},{"id":20,"title":"總裁與家族史","nw":9,"locked":1},{"id":21,"title":"總裁的答辯狀之爭","nw":10,"locked":1},{"id":22,"title":"總裁的條約譯本","nw":11,"locked":1},{"id":23,"title":"總裁的拍品疑雲","nw":10,"locked":1},{"id":24,"title":"總裁與退稿堆的寶藏","nw":11,"locked":1},{"id":25,"title":"總裁與論壇上的宿敵","nw":11,"locked":1},{"id":26,"title":"總裁與茶廠女律師","nw":11,"locked":1},{"id":27,"title":"總裁與山區學校的帳本","nw":11,"locked":1},{"id":28,"title":"總裁與裂痕下的名畫","nw":11,"locked":1},{"id":29,"title":"總裁的對席辯護人","nw":11,"locked":1},{"id":30,"title":"總裁的五年後重逢約","nw":10,"locked":1}],"serial":[{"id":1,"title":"第1章・離婚協議書","paras":[["晚上九點，季氏集團",["headquarters","總部"],"四十八樓的",["conference","會議"],"室終於安靜下來。",["board","董事會"],"的會議剛剛結束，江梔夏合上筆電，把最後一頁",["presentation","簡報"],"存檔——為了晨曜科技的",["acquisition","收購"],"案，她已經連續加班十七天。董事們魚貫離開，經過她身邊時都客氣地點頭。誰都知道，這位三十歲的專案經理是總裁季晏城最倚重的左右手，私底下甚至有",["rumor","謠言"],"說她是靠美色上位；卻沒有人知道，她同時也是他結婚三年、從未公開的妻子。"],["她等最後一位董事走出門，才從公事包裡抽出兩份",["document","文件"],"，走進走廊盡頭的總裁辦公室。季晏城正背對她站在落地窗前講電話，聲音低沉冷硬：\"告訴他們，敢再提高",["bid","出價"],"跟我搶晨曜，我就讓他們明天的",["stock","股票"],"直接跌停。\"這就是季晏城，在商場上從不給人留後路的男人，連最大的",["competitor","競爭對手"],"提起他都要繞道走。他掛斷電話轉過身，看見桌上那兩份文件——一份是",["resignation","辭呈"],"，一份是離婚",["agreement","協議"],"。\"我們那份",["contract","合約"],"今晚十二點",["expire","到期"],"，\"江梔夏語氣平靜，\"依照第七條",["clause","條款"],"，任何一方都能無條件",["terminate","終止"],"婚姻關係。季總，我的",["signature","簽名"],"已經簽好了，剩下你的。\""],["季晏城沒有看文件，只看著她。他扯鬆領帶，一步一步走近，皮鞋踩在地毯上幾乎沒有聲音。江梔夏下意識後退，腰撞上辦公桌的邊緣。下一秒，他雙手撐在她身側的桌面上，把她整個人困在臂彎與桌子之間。窗外整座城市的燈火在他身後鋪開，他俯身，近得能數清她的睫毛。他身上淡淡的雪松香氣壓下來，江梔夏的心跳不爭氣地亂了一拍，卻硬是逼自己直視他的眼睛。他開口，嗓音低得發啞：\"女人，妳這是在玩火。\"\"我是在",["fulfill","履行"],"合約。\"她仰起下巴，毫不退讓，\"當年你需要一位妻子穩住那群老董事，我需要錢救我爸的工廠。三年來我從沒",["refuse","拒絕"],"過你任何要求，陪你",["attend","出席"],"每一場晚宴，替你應付家裡每一個長輩。現在時間到了，我們兩清。\""],["\"兩清？\"季晏城低笑一聲，笑意卻沒有抵達眼底。他退開半步，指尖慢條斯理地敲著桌面，\"晨曜收購案下週一要向",["investor","投資人"],"做最後說明，三百億的",["transaction","交易"],"，整份",["proposal","企劃書"],"是妳寫的，每個數字是妳算的，連對方的",["lawyer","律師"],"都只認妳一個人。妳現在走，是想讓我在所有人面前開天窗？\"他從抽屜裡抽出她的勞動合約，翻到其中一頁，\"還有，妳簽的是",["executive","主管"],"級合約。專案結案前擅自離職，",["penalty","違約金"],"是妳",["salary","薪水"],"的二十倍。江經理，妳那點",["savings","存款"],"，夠賠嗎？\""],["江梔夏氣得臉色發白。她早該想到，這個男人做任何事都不會讓自己吃虧。\"季晏城，你這是在威脅",["employee","員工"],"。\"\"不，\"他糾正她，嗓音壓得極輕，像在她耳邊說情話，\"這叫",["negotiation","談判"],"。妳想走，可以。等晨曜案",["approve","核准"],"通過、所有",["audit","稽核"],"結束，我親自送妳出門。\"說完，他拿起那份離婚協議，當著她的面撕成兩半，再撕成四半，扔進",["shredder","碎紙機"],"。機器嗡嗡作響，像在嘲笑她三年來所有的隱忍。\"你撕得了一份，撕不了第二份。\"她冷冷地說，\"電子檔我已經",["forward","轉寄"],"給律師了，他手上還有我簽好的",["copy","副本"],"。\""],["季晏城像是早就料到，連眉頭都沒動一下。他按下桌上的",["intercom","對講機"],"：\"周牧，進來。\"不到三十秒，特助推門而入。\"通知人資，江經理的離職申請一律",["reject","駁回"],"。另外，\"他盯著她，一字一句，\"把她",["assign","指派"],"為晨曜案的唯一負責人。",["deadline","截止日期"],"之前，她的",["itinerary","行程"],"由我",["personally","親自"],"安排。\"周牧低頭應是，連看都不敢看江梔夏一眼。季晏城又補了一句：\"晨曜案所有",["confidential","機密"],"資料，從今天起只准經過她的手。\"江梔夏咬牙：\"我們的合約裡，可沒寫你有權管我的私生活。\"\"現在寫了。\"他輕描淡寫，彷彿在討論明天的天氣，\"妳是我的人，妳的時間當然也是我的。\"她抓起包轉身就走，手才碰到門把，身後便傳來他慵懶又危險的聲音：\"誰准妳走了？\""],["她沒有回頭，用力甩上門。在",["elevator","電梯"],"門闔上的那一刻，她拿出手機，訂了隔天清晨七點飛往溫哥華的",["flight","航班"],"——退路，她三個月前就準備好了。可她不知道，四十八樓的辦公室裡，季晏城正看著",["surveillance","監視"],"畫面，對周牧淡淡吩咐：\"查她訂了哪家",["airline","航空公司"],"，把那班飛機的",["passenger","乘客"],"名單給我。\"他鬆開袖扣，唇角勾起一抹冷笑：\"她想飛，就讓她飛。我倒要看看，這座城市的天空，哪一寸不是我的。\""]],"nw":47},{"id":2,"title":"第2章・插翅難飛","paras":[["清晨五點，天還沒亮，江梔夏拖著",["suitcase","行李箱"],"走進桃園機場第二",["terminal","航廈"],"。她一夜沒睡，眼下一片青黑，卻把自己打理得一絲不苟：俐落的風衣、低跟鞋，",["passport","護照"],"夾裡壓著溫哥華一間小設計公司的錄取信。她查過",["departure","出發"],"時間，算得清清楚楚：等飛機起飛，再把早就寫好的離職信寄給人資，就算季晏城有通天的本事，也來不及攔她。排在",["counter","櫃檯"],"前時，她甚至難得地鬆了一口氣。"],["\"江小姐，很抱歉。\"地勤人員盯著螢幕，表情越來越尷尬，\"系統顯示您的",["reservation","訂位"],"在凌晨三點被",["cancel","取消"],"了，款項會全額",["refund","退款"],"到原卡。\"\"不可能，我沒有取消。\"她立刻改訂下一班，刷卡時機器卻嗶了一聲。第二張卡、第三張卡，全部失敗。她打給銀行，客服小心翼翼地說，她名下所有",["account","帳戶"],"都因為\"異常",["transaction","交易"],"\"被暫時",["suspend","停用"],"，不能刷卡，也不能",["withdraw","提領"],"。江梔夏握著手機的指節泛白。不用想也知道是誰——季氏集團正是那家銀行最大的股東之一。"],["就在這時，機場",["announcement","廣播"],"響起，甜美的女聲在整座大廳迴盪：\"請江梔夏小姐前往十二號",["gate","登機門"],"，您搭乘的",["private","私人"],"專機即將",["depart","起飛"],"。重複一次，請江梔夏小姐……\"四周的",["passenger","乘客"],"紛紛轉頭張望。兩名",["security","保全"],"人員已經站到她身後，態度恭敬得近乎客氣：\"江小姐，季總在等您。十二號登機門前，整組",["crew","機組人員"],"已經列隊候著了。\"她冷笑：\"如果我不去呢？\"其中一人面露難色：\"季總交代，您不上他的飛機，就哪班飛機也上不了。今天所有飛往加拿大的",["flight","航班"],"，剩下的機位他已經全部",["purchase","買下"],"了。\""],["江梔夏沒有去十二號登機門。她趁一群旅行團湧過來的空檔甩開保全，從側門直奔地下",["parking","停車"],"場，打算先搭計程車離開再說。可她才跑到停車場出口，一輛黑色勞斯萊斯便橫著滑過來，硬生生堵住去路。車門打開，季晏城跨下車，西裝筆挺，彷彿剛結束一場晨會。她往後退，他就往前逼，直到她的背抵上冰冷的車身。他一手撐在她耳側的車窗上，一手勾起她的下巴，聲音輕得危險：\"妳以為妳逃得掉？\"\"你凍結我的帳戶、取消我的機位，季晏城，你這是犯法。\"她咬牙瞪他。\"犯法？\"他低低一笑，\"那家",["airline","航空公司"],"的股份，季氏上個月剛",["acquire","取得"],"了三成。還有，溫哥華那間公司，我凌晨已經",["notify","通知"],"他們的老闆，妳的職缺不存在了。\"他湊近她耳邊，一字一頓：\"梔夏，在我放手之前，妳插翅難飛。\""],["回程的車上，她連",["destination","目的地"],"都沒得選。",["driver","司機"],"一踩油門，季晏城便把平板丟到她腿上，語氣恢復成上司的冷淡：\"晨曜那邊撤回了把會議",["postpone","延後"],"的要求，",["agenda","議程"],"不變，九點準時開。他們的",["legal","法務"],"團隊昨晚又丟來三十頁修改意見，妳有兩小時",["revise","修改"],"完。\"江梔夏低頭看著密密麻麻的紅字，氣到想把平板砸在他那張俊臉上，最後卻還是打開筆電，一條一條回覆。下車前，他還不忘",["remind","提醒"],"她：\"會議結束後，中午之前，我要看到雙方",["confirm","確認"],"過的最終版本。\"九點整，她站上台做",["presentation","簡報"],"。會議室裡氣氛",["tense","緊繃"],"，對方",["lawyer","律師"],"句句刁難，她寸步不讓，把每一筆",["expense","費用"],"與",["revenue","營收"],"預估都說得清清楚楚，連在場的",["executive","主管"],"們都忍不住點頭。只有她自己知道，從早上開始，胃裡就一直翻攪，手機裡還塞滿了",["urgent","緊急"],"郵件等她處理。"],["會議一結束，那股",["nausea","噁心感"],"終於壓不住了。她衝進",["restroom","洗手間"],"，扶著洗手台乾嘔，鏡子裡的臉白得嚇人，連站都站不穩，",["dizzy","頭暈"],"得像踩在棉花上。",["assistant","助理"],"小安追進來，擔心地遞上溫水：\"梔夏姐，妳這些",["symptom","症狀"],"……該不會是有了吧？\"江梔夏下意識想",["deny","否認"],"，手卻一抖，水灑了一地。她原以為只是連續熬夜加班、沒好好吃飯，可是——她忽然想起，兩個月前那場慈善晚宴之後，那個喝醉了、抱著她不肯放手的夜晚。她讓小安先回去，在洗手台前",["hesitate","猶豫"],"了很久，才繞去大樓地下一樓的",["pharmacy","藥局"],"，再回到最裡面那間隔間，反鎖上門。"],["五分鐘後，驗孕棒上浮現兩條清清楚楚的紅線。她靠著門板，慢慢滑坐到地上，腦中一片空白。門外，熟悉的皮鞋聲由遠而近，停在洗手間門口，季晏城的聲音冷冷響起，帶著不容拒絕的命令：\"江梔夏，給妳十秒，出來。\"她緊緊攥住那根驗孕棒，前所未有地清楚——這一次，她不只要逃，還得帶著他的孩子，逃到他永遠找不到的地方。"]],"nw":48},{"id":3,"title":"第3章・藏起來的祕密","nw":47,"locked":1},{"id":4,"title":"第4章・最後一次簽名","nw":45,"locked":1}],"serialielts":[{"id":1,"title":"第1章・十年的債","paras":[["晚上八點，南港恆曜生醫研究院的實驗室依舊燈火通明。許知微摘下護目鏡，盯著螢幕上最後一組數據，連呼吸都放輕了。經過上百次",["failure","失敗"],"，曙光計畫的可降解神經導管終於在",["animal","動物"],"實驗中成功：導管",["transplant","移植"],"進實驗鼠體內的第十二週，斷掉的坐骨神經重新長了回來。為了這一刻，她連續三週睡在研究室，用近乎固執的耐心一遍遍重跑",["massive","大量的"],"數據，全身的",["exhaustion","疲憊"],"幾乎把最後一點體力",["deplete","耗盡"],"。同組研究員爆出",["frenzied","瘋狂的"],"歡呼，有人開香檳，有人抱在一起哭。她卻只是把剛",["extract","取出"],"的神經組織切片編號存檔，",["organize","整理"],"好報告——成果下個月才會正式",["publicize","公開"],"，她一個字都不能出錯。最後，她在筆記本上寫下日期：七月十八日。今天，是她二十六歲生日。"],["沒有人知道她的身世。二十六年前，阿嬤在花蓮郊區一座海邊",["chapel","小教堂"],"門口撿到襁褓中的她，身上只有一條銀色墜子，於是把那天當成她的生日。祖孫倆住在狹小的鐵皮屋裡，阿嬤曾把唯一的金戒指拿去",["pawnshop","當鋪"],"換她的補習費。十六歲那年，背著破舊",["backpack","背包"],"上學的她，忽然多了一位匿名的「長腿叔叔」，學費、生活費、實驗經費，一資助就是十年。她考上台大，選擇",["specialize","專攻"],"神經再生，直到四年前來恆曜面試，坐在桌子另一端的男人才淡淡開口：\"妳寄來的那些信，我每一封都看了。\"那個人，就是恆曜集團總裁裴聿深。外界對他的",["description","描述"],"只有幾個字：",["ruthless","冷酷無情"],"、手段狠絕。財經雜誌說他是一頭",["fierce","兇猛的"],"孤狼，沒有",["empathy","同理心"],"，也沒有",["humanity","人性"],"，他的",["reputation","名聲"],"讓所有對手聞之色變。可只有她知道，這頭狼每年都會準時收下她寫的感謝信。"],["同組的研究員林柏翰捧著一束玫瑰走過來，滿臉",["sincerity","真誠"],"，耳根通紅：\"知微，生日快樂，等一下慶功宴結束，我能不能——\"話還沒說完，實驗室的門被推開，整個空間瞬間安靜。裴聿深一身黑色西裝站在門口，一道",["hostile","帶敵意的"],"目光掃過那束花。他慢條斯理走到她身邊，修長的手指抽走花裡那張",["greeting","祝福"],"卡片，看也不看就丟進回收桶。\"林研究員，\"他維持著無可挑剔的",["manner","舉止"],"，每個字卻冷得像冰，\"恆曜的職場",["etiquette","禮儀"],"第一條：別碰不屬於你的東西。\"他當著所有人的面扣住她的手腕，往",["private","私人"],"電梯走去：\"她今晚，我包了。\""],["四十分鐘後，信義區最高的那間頂樓餐廳裡只坐著兩個人。落地窗外是整座城市",["dramatic","壯觀的"],"夜景，",["outdoor","戶外"],"露臺上擺滿白色桔梗，角落的",["string","弦樂"],"四重奏輕輕拉著曲子，每一道菜的",["ingredient","食材"],"都是當天從日本和法國空運來的。這種近乎",["ostentatious","炫富的"],"排場，換成別的女人大概早就感動落淚。知微卻挑眉，語氣帶著幾分",["sarcastic","諷刺的"],"笑意：\"裴總，包下整間餐廳只為了吃一頓飯，你的",["publicist","公關"],"不會頭痛嗎？\"\"我的錢花在我的人身上，\"他替她切好牛排，推到她面前，\"誰有意見，叫他來找我。\"她一臉",["curious","好奇的"],"表情：\"誰是你的人？\"他放下刀叉，抬眼看她，那雙眼睛深得像不見底的夜：\"十年前開始，就是了。\"她一度以為自己的",["hearing","聽力"],"出了問題。他卻像什麼都沒說過，只淡淡",["remind","提醒"],"她：\"吃完，不准剩。\""],["桌上的手機忽然亮了一下。是在倫敦做博士後研究的台大學長梁亦舟：\"推薦信寄出了，霍爾教授說很欣賞妳的研究，等消息吧。\"她指尖一頓，若無其事地把螢幕朝下蓋住。沒有人知道，她三個月前偷偷考了雅思，拿到八分，申請了倫敦皇家理工學院的研究所。她對他的",["admiration","欽佩"],"從十六歲延續到現在，甚至在無數個加班的深夜裡，悄悄變成不敢說出口的心動——那份心動從來沒有",["surface","浮上檯面"],"，也不能。曙光計畫是他母親留下的",["legacy","遺產"],"，他總是",["emphasize","強調"],"那是他這輩子最重要的東西；而她，不想一輩子當個",["dependent","依附他人的"],"女孩，更不想成為他身邊一件漂亮的",["trophy","戰利品"],"。研究員這個",["occupation","職業"],"，是她靠自己掙來的。\"誰的訊息？\"他眸色一沉，修長的手指按住她的手機，\"在我面前，不准蓋手機。\"\"研究室群組。\"她面不改色，眼神",["resolute","堅定"],"。"],["服務生推來一座三層蛋糕，是他特地請主廚做的",["dessert","甜點"],"，最上層用糖霜畫著一座海邊小教堂。知微忍不住",["giggle","咯咯笑"],"了起來。她從不信",["superstition","迷信"],"，此刻卻也想對著蠟燭許一個願。落地窗映出她的側臉，",["ethereal","空靈"],"得不真實；那一瞬間的她，",["blissful","幸福"],"得像在作夢。若是旁人看見，大概會說這是全台北最",["romantic","浪漫的"],"一晚。就在這時，他的手機響了。是特助謝承恩。她聽不見電話那頭說了什麼，只看見他的臉色在一瞬間變了，那是她認識他四年來從未見過的神情，",["unsettling","令人不安"],"得讓她心口一緊。他站起身，丟下一句\"等我\"，連外套都沒拿就走了。偌大的餐廳裡只剩下她，和一座蠟燭還沒點燃的蛋糕。那種熟悉的",["loneliness","孤獨"],"，像潮水一樣慢慢漫上來。"],["手機螢幕亮起，一則新聞推播跳了出來：\"顧氏千金顧芷柔深夜返台，恆曜總裁裴聿深親自接機。\""]],"nw":52},{"id":2,"title":"第2章・白月光回國","paras":[["隔天早上八點，知微跟著一大群",["commuter","通勤族"],"擠下捷運。這條她",["commute","通勤"],"了四年的路線，今天卻顯得格外漫長。昨晚那座蛋糕，她一口都沒吃，整個打包送給了餐廳員工——她等到餐廳打烊，他沒有回來。回家後盯著天花板到天亮，心裡壓著說不出的",["melancholy","憂鬱"],"。手機裡那則新聞已經被轉發上萬次：機場的攝影記者拍到裴聿深親自替顧芷柔推行李，照片裡他微微低頭聽她說話，神情是她從沒見過的",["tender","溫柔"],"。她關掉螢幕，告訴自己：這十年就像一場",["marathon","馬拉松"],"，她只是剛好跑到了該清醒的那一段。"],["五十八樓總裁室隔壁，是她的辦公室。桌上多了一只絲絨盒子，裡面躺著一條",["custom","訂製的"],["platinum","鉑金"],"手鍊，鍊墜是小小的神經元造型，內側刻著一個「微」字。裴聿深倚在門邊，西裝筆挺，彷彿昨晚什麼事都沒發生：\"補妳的生日禮物。\"真是個",["unromantic","不浪漫的"],"道歉方式。她把盒子推回去：\"裴總要是覺得愧疚，不如把我這個月的加班費結清。\"他走過來，不由分說扣住她的手腕，把手鍊戴上，啪一聲扣緊。\"戴著，不准拿下來。\"他的拇指在她腕間輕輕摩挲，\"這樣全公司都知道，妳是誰的人。\"她冷笑：\"昨晚那條新聞，全台灣也都知道你是誰的人了。\"他眼神一暗，卻一句也沒解釋，只丟下一句：\"下午有",["visitor","訪客"],"，把實驗室整理好。\""],["下午兩點，所謂的訪客到了。二叔裴振邦親自陪同，身邊跟著一個",["petite","嬌小的"],"女孩，白色洋裝、栗色長捲髮，笑起來甜得像蜜——顧芷柔。\"妳就是知微吧？我可以這樣叫妳嗎？\"她一點都不怕生，",["bubbly","活潑"],"地挽著裴聿深的手臂，在實驗室裡東看西看，對每一臺儀器都",["marvel","驚嘆"],"不已：\"聿深哥哥好厲害！\"裴振邦笑著說明，顧家有意投入一大筆",["funding","資金"],"，和恆曜一起推動曙光計畫。\"顧氏航運是倫敦的百年家族企業，有深厚的",["heritage","傳承"],"，芷柔是唯一的",["successor","繼承人"],"，\"他意味深長地看了知微一眼，\"兩家的",["influence","影響力"],"要是加在一起，可就太",["powerful","強大"],"了。\"知微面無表情，解釋實驗鼠如何",["random","隨機"],"分組、每一項",["exacting","嚴苛的"],"檢驗標準，用專業把自己武裝得",["impenetrable","無懈可擊"],"。顧芷柔甜甜一笑：\"我好",["appreciate","欣賞"],"知微這種女生，這項研究一定能",["transform","徹底改變"],"整個神經醫學。\"可當知微彎腰調整顯微鏡時，頸間的銀色墜子滑出衣領，顧芷柔的笑容僵了一秒，眼底閃過一絲",["suspicious","狐疑的"],"光。"],["晚上的接風宴辦在信義區一間五星飯店，水晶燈",["bright","明亮"],"得刺眼。顧芷柔是今晚的主角，捧著一大束香檳玫瑰被名流們圍在中間。知微以首席研究助理的身分出席，替裴聿深整理顧家投資的",["account","帳目"],"資料，幾位董事投來",["skeptical","懷疑的"],"目光，像在估算她今晚的位置。裴振邦舉杯，說起一段",["anecdote","趣事"],"：小時候芷柔跌倒，十二歲的聿深背著她走了兩公里去診所。\"這兩個孩子的",["relationship","關係"],"，我們長輩都看在眼裡，\"他環視全場，\"雙方家長也有",["mutual","共同的"],"期待，今晚就當作提前預告吧！\"掌聲雷動，閃光燈此起彼落，在場兩百位賓客都",["witness","見證"],"了這一刻。所有人都在等裴聿深開口——包括知微。可他只是站在那裡，臉上的表情",["complex","複雜"],"得讓人看不懂，一個字都沒說。空氣彷彿",["frozen","凍結"],"了，知微臉上禮貌的微笑一點一點",["solidify","凝固"],"。她站在人群邊緣，那種",["isolation","孤立感"],"比昨晚更深。"],["她靠著",["self-discipline","自律"],"撐完最後十分鐘，跟顧家的會計核對完數字，轉身就走。才走到宴會廳外的長廊，手腕就被人一把扣住，整個人被帶到牆邊。砰的一聲，裴聿深單手撐在她耳側，高大的身影把燈光遮得一乾二淨，壓迫感",["overwhelming","排山倒海"],"般襲來。\"誰准妳走了？\"他嗓音低啞，帶著酒氣。\"主角還在等你，\"她仰起臉，眼神鋒利，\"裴總該回去陪你的未婚妻，不是在這裡為難一個加班的員工。\"\"我什麼時候說過她是我的未婚妻？\"\"你也沒說她不是。\"她用力推他的胸膛，那點",["strength","力氣"],"對他卻像撓癢。\"我只是",["correct","糾正"],"一件事：你資助我十年，我很感激；但我在恆曜靠的是",["competence","實力"],"，不是你的",["compassion","同情"],"。我是你的研究員，不是你養的",["kitten","小貓"],"，高興了逗兩下，不高興就丟在餐廳裡。\"他的眼神一寸一寸暗下去，那副說一不二的",["temperament","脾氣"],"全寫在臉上：\"許知微，我要的從來不是感激。\"他低頭逼近，鼻尖幾乎碰到她的，\"我要的是，妳哪裡都不准去。\"走廊盡頭傳來腳步聲，他卻不慌不忙，又盯了她三秒，才",["release","放開"],"她的手腕，指腹按了按那條手鍊：\"記住，不准拿下來。\""],["她逃進化妝室，對著鏡子深呼吸。門被推開，顧芷柔走進來，在她身旁補口紅，鏡子裡那張臉甜得無害。\"知微，別難過，\"她故作貼心地",["comfort","安慰"],"她，\"聿深哥哥脾氣就是這樣。給妳一個",["advice","忠告"],"：不屬於自己的東西，抓得太緊，只會受傷。\"知微沒有回頭：\"顧小姐想說什麼，直說。\"顧芷柔輕笑一聲，從領口拉出一條項鍊。銀色、橢圓形，連邊緣細細的花紋都一樣——和知微頸間那條墜子，一模一樣。知微腦中一片空白，只剩下零碎的",["fragment","片段"],"：海邊的小教堂、褪色的襁褓、阿嬤那句\"這是妳身上唯一的東西\"。顧芷柔湊到她耳邊，笑容",["enigmatic","難以捉摸"],"。"],["\"知微，妳知道他為什麼資助妳十年嗎？\""]],"nw":47},{"id":3,"title":"第3章・替身","nw":45,"locked":1},{"id":4,"title":"第4章・辭呈與本票","nw":45,"locked":1}],"rebirth":[{"id":1,"title":"總裁與重生的她","paras":[["我死的那天，下著大雨。未婚夫顧明軒摟著我同父異母的妹妹林婉柔，站在",["hospital","醫院"],"走廊盡頭。是他們",["deliberately","故意地"],"把我推下樓梯，我的腿",["fracture","骨折"],"，孩子也沒了。林婉柔笑著說：\"姐姐，妳媽留下的",["inheritance","遺產"],"，我收下了；真遺囑，我也替妳燒了。\"顧明軒的眼神只剩",["contempt","輕蔑"],"：\"林晚，妳太",["naive","天真"],"了。\"到死我才明白，我最信任的兩個人一起",["betray","背叛"],"了我。失去意識前，我只看見一個男人衝進病房——是全城都說最",["ruthless","無情"],"的厲寒川。他跪在床邊，聲音發抖：\"我來晚了。\""],["再睜開眼，我回到三年前，訂婚宴的前一天。",["stepmother","繼母"],"把一份",["document","文件"],"推到我面前：\"晚晚，簽了這份代持協議，明天才風光。\"上一世，我被她",["manipulate","操控"],"得團團轉，乖乖在上面留下",["signature","簽名"],"，從此一無所有。這一世，我看都沒看，當場撕成兩半。繼母臉色鐵青：\"妳瘋了？\"我笑了：\"我媽留給我的東西，誰都別想碰。\"當晚，我把上一世記得的每一條線索都整理好，連林婉柔藏起來的那份假遺囑放在哪裡都一清二楚。接著，我撥了一通電話給厲寒川。這一次，我不會再心軟，也不會再後悔。命運既然給了我重來的機會，我就要讓這群",["greedy","貪婪的"],"人，把欠我的全部還回來。"],["訂婚",["ceremony","典禮"],"上，賓客滿堂。顧明軒單膝跪地：\"晚晚，嫁給我。\"台下響起一片",["applause","掌聲"],"，林婉柔紅著眼眶，",["pretend","假裝"],"替我高興。我接過麥克風，按下播放鍵。大螢幕上，是他們昨晚在飯店門口擁吻的監視器",["footage","畫面"],"。全場瞬間安靜，有人倒抽一口氣，有人已經拿出手機錄影。接著是一段錄音：繼母和林婉柔正在",["conspire","密謀"],"，打算婚後把我送進療養院，奪走我的股份。顧明軒大喊：\"這是妳",["fabricate","捏造"],"出來的！\"我冷冷看著他：\"要不要現場請人",["verify","驗證"],"？\"這一刻，被當眾",["humiliate","羞辱"],"的人，終於換成了他們。"],["林婉柔尖叫著衝過來搶手機，一隻手攔住了她。厲寒川站在我身邊，聲音冷得像冰：\"動她一下，試試看。\"賓客們頓時噤聲。他轉身對我伸出手：\"林小姐，顧氏的",["takeover","收購案"],"我剛簽完，顧家人怎麼處置，妳說了算。\"顧明軒的父親當場",["collapse","癱倒"],"在椅子上。我一字一句宣布：\"顧家父子，明天起全部捲鋪蓋走人。林婉柔",["forge","偽造"],"遺囑的",["evidence","證據"],"，我已經交給律師。\"林婉柔全身",["tremble","發抖"],"，哭著說自己是",["innocent","無辜的"],"。台下沒有一個人相信她，只有閃個不停的鏡頭。"],["警察走進宴會廳時，我把一個隨身碟交出去：\"十年前，我媽的死不是意外。\"繼母被當場",["arrest","逮捕"],"，回頭狠狠瞪我。我只回了一句：\"這是妳們應得的",["consequence","後果"],"。\"夜風很涼，厲寒川把外套披在我肩上：\"為什麼找我？\"我想起上一世他跪在床邊的樣子，眼眶一熱：\"因為上一世，只有你來救我。\"他沉默很久，眼神第一次露出",["vulnerable","脆弱的"],"一面，忽然把我拉進他的",["embrace","懷抱"],"，在我耳邊",["whisper","低語"],"：\"這一世，換我先找到妳。誰敢再動妳，我讓他後悔活在這世上。\"上一世我沒能",["protect","保護"],"自己，這一世，我有他。"]],"nw":33},{"id":2,"title":"重生之榜首歸來","paras":[["我死在二十八歲生日那晚，只剩一隻手抓著橋欄杆。",["cousin","表妹"],"沈若琳蹲下來，晃著一張泛黃的成績單：\"姐，十年前那場",["exam","考試"],"，榜首是妳。我媽和校長聯手調包成績，還改了妳的志願，我才頂著妳的分數進了第一志願的",["university","大學"],"。\"我在工廠熬了十年，連",["tuition","學費"],"都存不夠；她卻在國外領我的",["scholarship","獎學金"],"。原來養我長大、我以為最疼我的姑姑，一直在",["deceive","欺騙"],"我。沈若琳",["sneer","冷笑"],"著，一根一根掰開我的手指：\"我嫉妒妳整整十年了。\"墜進河裡前，我看見一道身影跟著跳下來，是全城最",["merciless","冷酷無情"],"的陸氏總裁，陸景琛。"],["再睜開眼，我回到十八歲，志願登記截止那晚。姑姑端來熱牛奶：\"知夏，",["password","密碼"],"給姑姑，我幫妳",["register","登記"],"。\"上一世，我喝下這杯加了安眠藥的牛奶，人生就被調包了。這一世，我乖乖寫下密碼交給她，等她一走，就把牛奶倒進花盆，十分鐘內把志願",["submit","送出"],"，再改掉密碼。我要親手改寫",["destiny","命運"],"。",["midnight","午夜"],"，我聽見沈若琳在走廊講電話：\"密碼不對？沒關係，校長收了錢，今晚會直接從後台改成績。\"我按下錄音。逼她們親手留下證據，正是我要的。隔天清晨，一封",["anonymous","匿名的"],"郵件寄來電腦教室凌晨的",["security camera","監視器"],"畫面，附言只有一句：放榜那天，用得上。"],["放榜典禮上，",["media","媒體"],"擠滿禮堂。",["principal","校長"],"宣布，今年的全國榜首是沈若琳。姑姑紅著眼眶抱住女兒，所有人都以為她們贏了。我舉手：\"校長，借大螢幕一分鐘。\"畫面亮起：凌晨兩點，校長在電腦前改成績，姑姑把一個厚信封塞進他口袋，是明明白白的",["bribe","賄賂"],"。接著播出沈若琳的錄音。全場譁然，",["reporter","記者"],"的鏡頭全轉向台上。校長大喊：\"這是合成的！她想",["frame","陷害"],"我！\"我",["calmly","冷靜地"],"說：\"原始檔案已經送到教育部，他們會",["investigate","調查"],"到底。要不要等結果，看看誰在說謊？\""],["姑姑哭著撲過來，被保全攔下：\"我養妳十年，妳就這樣報答我？\"她轉向第一排：\"陸總，這孩子精神不穩定，別信她！\"陸景琛是姑姑公司最大的",["investor","投資人"],"，今天以校友身分致詞。他一起身，我的心跟著一沉。他卻走過來把我擋在身後：\"沈女士，我的",["investment","投資"],"今天全部撤回。妳這十年",["embezzle","侵占"],"她父母留下的",["trust","信託"],"基金，帳本在我律師手上。\"校長撐不住，當眾",["confess","坦承"],"收了錢。陸景琛冷冷看向沈若琳：\"妳想頂替她去領的那筆",["scholarship","獎學金"],"，是我匿名設的，只為一個人。她的東西，誰拿走，就給我加倍還回來。\""],[["police","警察"],"帶走了姑姑和校長，沈若琳",["kneel","跪"],"在地上向我",["apologize","道歉"],"。我只說：\"上一世妳掰開我手指時，可沒說對不起。\"她一臉茫然。夜裡，校門口只剩我們兩個。\"那封匿名郵件，是你寄的？\"陸景琛點頭，沉默許久才開口：\"上一世，我跳下河，還是晚了一步。\"我僵住，原來重生的不只我一個。他把我拉進懷裡：\"這一世，妳只管往前走，擋路的，我來清。\"手機忽然響起，是姑姑從警局打來：\"妳以為我為什麼非要搶走妳的榜首？去查妳的",["biological","親生"],"父親。他還",["alive","活著"],"，而陸景琛，早就知道他是誰。\""]],"nw":32},{"id":3,"title":"重生之隱藏簽名","nw":33,"locked":1},{"id":4,"title":"重生之上市前夜","nw":33,"locked":1},{"id":5,"title":"總裁的真千金","nw":33,"locked":1},{"id":6,"title":"重生之沖喜新娘","nw":31,"locked":1},{"id":7,"title":"重生之雪夜恩人","nw":32,"locked":1},{"id":8,"title":"重生之不再捐腎","nw":37,"locked":1},{"id":9,"title":"重生之不替你坐牢","nw":32,"locked":1},{"id":10,"title":"重生之當眾拒婚","nw":33,"locked":1}]},"vault":{"iv":"rVq/ht0tcekFZKeg","wraps":[],"it":150000,"ctUrl":"data/vault.bin?v=c60d56c1"}}</script>

function firstSentence(s){const p=s.paras[0];let out=[],len=0;for(const x of p){if(typeof x==='string'){const m=x.match(/^[^。！？]*[。！？]/);if(m&&len>20){out.push(m[0]);break}out.push(x);len+=x.length}else{out.push(x);len+=x[0].length}if(len>140)break}return out}
function renderSegs(segs,mode,pi){return segs.map((x,i)=>{if(typeof x==='string')return esc(x);const k=norm(x[0]);const sv=saved[k]?' saved':'';
  const g=mode==='review'?`<span class="g hide" data-reveal role="button" tabindex="0" aria-label="顯示中文">（${esc(x[1])}）</span>`:`<span class="g">（${esc(x[1])}）</span>`;
  return `<span class="w${sv}" role="button" tabindex="0" data-k="${esc(k)}" data-p="${pi}" data-i="${i}">${esc(x[0])}</span>${g}`}).join('')}
function contextOf(s,pi,ii){const p=s.paras[pi];let L=ii,R=ii;
  const leftStop=x=>typeof x==='string'&&/[。！？」"]/.test(x);
  // walk left
  let left='';for(let j=ii-1;j>=0;j--){const x=p[j];if(typeof x==='string'){const m=x.match(/[。！？][」"]?([^。！？]*)$/);if(m){left=m[1]+left;L=j;break}left=x+left}else left=' '+x[0]+' '+left;L=j}
  let right='';for(let j=ii+1;j<p.length;j++){const x=p[j];if(typeof x==='string'){const m=x.match(/^[^。！？]*[。！？][」"]?/);if(m){right+=m[0];break}right+=x}else right+=' '+x[0]+' '}
  const w=p[ii];left=left.replace(/^[」"，、\s]+/,'');
  return `${esc(left)}<span class="w">${esc(w[0])}</span><span class="g">（${esc(w[1])}）</span>${esc(right)}`}
function findOccurrence(k,pref){const order=pref&&byId[pref]?[byId[pref],...S]:S;for(const s of order){if(!s.paras)continue;for(let pi=0;pi<s.paras.length;pi++){const p=s.paras[pi];for(let i=0;i<p.length;i++){const x=p[i];if(typeof x!=='string'&&norm(x[0])===k)return {s,pi,i}}}}return null}
